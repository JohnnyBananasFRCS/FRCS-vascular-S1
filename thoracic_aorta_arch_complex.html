<style>
:root {
  --bg:#f6f7fb; --card:#fff; --ink:#17202a; --muted:#5f6b7a;
  --accent:#1f4e79; --accent2:#e8f1fa; --border:#d7dde7;
  --good:#167a3f; --bad:#a33131; --shadow:0 8px 24px rgba(20,30,50,.08);
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
}
header {
  background:linear-gradient(135deg,#173b5f,#1f4e79);
  color:white;
  padding:28px 18px;
}
.wrap { max-width:980px; margin:0 auto; }
header h1 { margin:0 0 8px; font-size:1.65rem; letter-spacing:-.02em; }
header p { margin:0; color:rgba(255,255,255,.86); }
.controls {
  margin:18px auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
  display:grid;
  gap:12px;
}
.control-row {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}
.mode-toggle,.actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button {
  border:1px solid var(--border);
  background:white;
  color:var(--ink);
  border-radius:999px;
  padding:9px 13px;
  font-size:.95rem;
  cursor:pointer;
}
button:hover { border-color:var(--accent); }
button.active,button.primary { background:var(--accent); color:white; border-color:var(--accent); }
button.danger { border-color:#e1b5b5; color:var(--bad); }
.score { font-weight:700; color:var(--accent); }
.note { font-size:.9rem; color:var(--muted); }
.question-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin:16px auto;
  box-shadow:var(--shadow);
}
.q-head {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:baseline;
  border-bottom:1px solid var(--border);
  padding-bottom:10px;
  margin-bottom:14px;
}
.q-num { font-size:1.05rem; font-weight:800; color:var(--accent); }
.q-id { font-size:.82rem; color:var(--muted); }
.exhibit {
  background:#fbfcfe;
  border:1px solid var(--border);
  border-left:5px solid var(--accent);
  border-radius:12px;
  padding:12px 14px;
  margin:12px 0 16px;
  white-space:pre-line;
  color:#263342;
}
.stem { margin:12px 0 16px; white-space:pre-line; }
.options { display:grid; gap:9px; margin-top:12px; }
label.option {
  display:grid;
  grid-template-columns:30px 1fr;
  gap:8px;
  align-items:start;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  cursor:pointer;
  background:white;
}
label.option:hover { border-color:var(--accent); background:var(--accent2); }
.option input { margin-top:5px; }
.letter { font-weight:800; color:var(--accent); margin-right:4px; }
label.option.correct { border-color:rgba(22,122,63,.55); background:rgba(22,122,63,.08); }
label.option.incorrect { border-color:rgba(163,49,49,.55); background:rgba(163,49,49,.07); }
.feedback {
  margin-top:14px;
  padding:13px;
  border-radius:13px;
  background:#fbfcfe;
  border:1px solid var(--border);
  display:none;
}
.feedback.show { display:block; }
.feedback h4 { margin:0 0 6px; color:var(--accent); }
.feedback .result { font-weight:800; margin-bottom:8px; }
.feedback .result.good { color:var(--good); }
.feedback .result.bad { color:var(--bad); }
.why-not,.trap { margin-top:10px; color:#27313d; }
.trap {
  border-top:1px solid var(--border);
  padding-top:10px;
  color:var(--muted);
  font-style:italic;
}
.footer-space { height:28px; }
@media (max-width:640px) {
  header h1 { font-size:1.35rem; }
  .question-card { border-radius:14px; padding:14px; margin:12px 8px; }
  .controls { margin:12px 8px; border-radius:14px; }
  .q-head { flex-direction:column; gap:2px; }
  button { padding:9px 11px; }
}

    .exhibit-image { margin: 12px 0 14px; text-align: center; }
    .exhibit-image img, .exhibit-image video { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
    .exhibit-image video { background: #000; }
    .source-verification { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.92rem; line-height: 1.45; white-space: pre-line; }
    .source-verification strong { color: var(--text); }
    .evidence-note { margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: var(--soft); font-size: 0.9rem; }

<script>
const QUESTIONS = [{"id": "THO-001", "number": 1, "internal_title": "Acute TBAD — persistent pain and planned LSA coverage", "exhibit": "CTA of the arch and proximal descending thoracic aorta. The primary entry tear is 6 mm distal to the left subclavian artery. A zone 2 proximal landing is required for an adequate seal. The patient has a patent LIMA-to-LAD graft, a dominant left vertebral artery and a hypoplastic right vertebral artery.", "stem": "A 66-year-old man presents with acute type B aortic dissection and persistent severe interscapular pain despite IV beta-blockade and opiate analgesia. Systolic blood pressure is controlled at 115 mmHg. Creatinine and lactate are normal. CTA shows no rupture or visceral malperfusion.\n\nThe primary entry tear is 6 mm distal to the left subclavian artery, so an adequate proximal seal requires zone 2 coverage. He has a previous CABG with a patent LIMA-to-LAD graft. The left vertebral artery is dominant and the right vertebral artery is hypoplastic.\n\nWhat is the most appropriate treatment strategy?", "options": {"A": "Continue medical therapy alone", "B": "Zone 3 TEVAR", "C": "Zone 2 TEVAR with intentional left subclavian artery coverage and no revascularisation", "D": "Left carotid-subclavian bypass followed by zone 2 TEVAR", "E": "Open descending thoracic aortic replacement"}, "answer": "D", "explanation": "Persistent refractory pain despite adequate analgesia is an indicator of impending rupture in acute TBAD and supports intervention. Because the entry tear is too close to the LSA for a zone 3 seal, zone 2 TEVAR is required. Planned LSA coverage is particularly important here because the patient has both a patent LIMA graft and compromised alternative posterior-circulation anatomy; LSA revascularisation should therefore be incorporated before elective/controlled coverage when feasible.", "why_not": "A does not address persistent refractory pain. B does not provide an adequate proximal seal. C jeopardises LIMA myocardial perfusion and posterior-circulation/spinal collateral perfusion. E is more invasive and is not the preferred first-line treatment for anatomically suitable complicated acute TBAD.", "editorial_trap": "The item tests the sequence: indication for TEVAR, recognition that zone 2 is required, then assessment of the consequences of LSA coverage.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.1.3.3, p.203: persistent/refractory/recurrent pain despite adequate analgesia is an indicator of impending rupture requiring intervention. ESVS 2026, §3.4, pp.192-193, Recommendation 21 (Class IIa, Level B): LSA revascularisation should be considered with intentional coverage; listed high-risk features include a patent LIMA graft, dominant left vertebral artery and compromised right vertebral artery.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "The need for LSA revascularisation is individualised, but this stem deliberately supplies multiple guideline-recognised high-risk features.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-002", "number": 2, "internal_title": "Incidental small PAU — morphology versus formal thresholds", "exhibit": "Axial CTA of the mid descending thoracic aorta showing a shallow eccentric contrast crater in an atherosclerotic plaque. There is no intramural haematoma, pseudoaneurysm, pleural effusion, peri-aortic haematoma or inflammatory change.", "stem": "A 79-year-old man undergoes CTA chest for pneumonia. The report describes an incidental shallow penetrating aortic ulcer in the mid descending thoracic aorta. He has no chest or back pain. There is no intramural haematoma, pseudoaneurysm, pleural effusion, peri-aortic haematoma or rapid aortic expansion. The aorta measures 34 mm and the ulcer crater is 3 mm deep and 7 mm wide.\n\nHe is already taking antiplatelet therapy and a statin.\n\nWhat is the most appropriate next step?", "options": {"A": "TEVAR during this admission", "B": "Best medical therapy with outpatient cross-sectional imaging at approximately 3 months", "C": "Repeat CTA in 48-72 hours and proceed to TEVAR if the ulcer remains visible", "D": "Open descending thoracic aortic replacement", "E": "Discharge without further aortic imaging"}, "answer": "B", "explanation": "This is an uncomplicated, incidentally detected small PAU without symptoms or adverse associated imaging features. ESVS 2026 recommends conservative management with best medical therapy and serial cross-sectional imaging for uncomplicated PAU; an initial post-discharge CT at about 3 months is suggested. The 3 x 7 mm dimensions are reassuring in context, but they are not a validated treatment threshold: the guideline explicitly states that no consensus cut-off exists for PAU width or depth.", "why_not": "A and D over-treat an uncomplicated incidental lesion. C is more appropriate to an unstable acute aortic syndrome or evolving high-risk lesion, not this clinically silent and uncomplicated PAU. E is inappropriate because stability should be demonstrated with surveillance imaging.", "editorial_trap": "Do not convert morphology into an invented binary size threshold. A much larger or morphologically hostile lesion with pseudoaneurysm, peri-aortic haemorrhage, rapid progression, recurrent pleural effusion or symptoms would materially alter management even if the patient were otherwise stable.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.2.1-4.2.3, pp.207-208, Recommendation 47 (Class I, Level C): uncomplicated PAU/IMH should receive best medical therapy and serial cross-sectional imaging; an initial post-discharge CT at 3 months is suggested. The same section states that no consensus cut-off exists for PAU ulcer width or depth. Full Vascular A Companion 2024, Ch.14, p.228: medical management is safe in the early phase, with intervention for haemodynamic instability, persistent pain/hypertension, rapid expansion, impending rupture or progressive peri-aortic haemorrhage.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE and ANEURYSM - EMERGENCY; thoracic aneurysm/dissection stent grafts and acute aortic syndromes.", "evidence_note": "Ulcer dimensions contribute to clinical judgement, but ESVS 2026 does not endorse a firm width/depth threshold for an asymptomatic PAU.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-003", "number": 3, "internal_title": "Post-TEVAR spinal cord ischaemia — immediate rescue", "exhibit": "No additional imaging is required for this question.", "stem": "A 70-year-old man is on the intensive care unit on day 1 after extensive thoracic endovascular aortic repair. He develops loss of temperature sensation in both legs, followed shortly afterwards by progressive bilateral lower-limb weakness.\n\nA lumbar CSF drain is already in situ but has been clamped. Blood pressure is 134/72 mmHg, haemoglobin is 91 g/L and he is breathing room air. His lower-limb pulses are unchanged.\n\nWhat is the most appropriate immediate management?", "options": {"A": "Urgent MRI of the spinal cord before treatment", "B": "Systemic anticoagulation and neurological observation", "C": "Immediately augment spinal cord perfusion by raising MAP, reopening CSF drainage and optimising oxygen delivery", "D": "Urgent iliac angiography", "E": "Emergency explantation of the thoracic endograft"}, "answer": "C", "explanation": "This is delayed spinal cord ischaemia until proven otherwise. Treatment should not wait for MRI. A protocolised rescue response should immediately improve spinal cord perfusion pressure and oxygen delivery: increase arterial pressure, reopen/commence CSF drainage when safe, and correct anaemia/hypoxaemia. In this real case, the first bedside manoeuvre was to raise the MAP, followed promptly by unclamping the lumbar drain as part of the COPS-style rescue bundle; the neurological deficit resolved.", "why_not": "A delays treatment of a time-critical and potentially reversible deficit. B does not correct spinal cord hypoperfusion. D would be appropriate if there were evidence of acute limb malperfusion, but the limb pulses are unchanged and the neurological pattern is bilateral. E is not an initial treatment for postoperative SCI.", "editorial_trap": "The important concept is the immediate rescue bundle rather than pretending that evidence defines a universal second-by-second order. The real case sequence was MAP augmentation first, then reopening the drain.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §3.5-3.5.4, pp.193-195, Recommendation 23 (Class I, Level C): protocolised SCI prevention/detection/management including high blood pressure, haemoglobin ≥10 g/dL, preservation/restoration of collaterals and CSF drainage as appropriate. Recommendation 26 (Class IIb, Level C) supports reactive/rescue CSF drainage in extensive endovascular repair. Full Vascular A Companion 2024, Ch.14, p.217: when SCI occurs, increase cord perfusion by reducing CSF pressure, targeting MAP about 100 mmHg and optimising oxygen delivery including Hb >10 g/dL. Oxford Textbook of Vascular Surgery, §8.8, p.624: postoperative SCI should prompt MAP >100 mmHg and CSF drainage.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "The sources support immediate simultaneous physiological rescue; they do not establish a mandatory temporal order between MAP augmentation and reopening an existing drain.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-004", "number": 4, "internal_title": "Extent II TAAA — staged endovascular strategy", "exhibit": "Synthetic coronal CTA/MPR of thoracoabdominal aneurysm. Displayed findings: aneurysm begins just distal to LSA; extends to aortic bifurcation; coeliac, SMA and both renal arteries arise from aneurysmal segment; maximum diameter 67 mm; proximal descending thoracic landing zone adequate; iliac access suitable; no rupture.", "stem": "A 62-year-old fit man is referred with an asymptomatic thoracoabdominal aortic aneurysm. CTA shows aneurysmal disease from just distal to the left subclavian artery to the aortic bifurcation. The coeliac artery, SMA and both renal arteries arise from the aneurysmal segment. Maximum diameter is 67 mm. Proximal thoracic landing zone and iliac access are suitable for endovascular repair.\n\nA total endovascular strategy is being considered.\n\nWhich option best describes the aneurysm and the preferred treatment principle?", "options": {"A": "Crawford extent I; single-stage TEVAR", "B": "Crawford extent II; staged TEVAR followed by fenestrated/branched repair", "C": "Crawford extent II; single-stage TEVAR and fenestrated/branched repair", "D": "Crawford extent IV; fenestrated infrarenal repair alone", "E": "Isolated descending thoracic aneurysm; TEVAR alone"}, "answer": "B", "explanation": "This is an extent II thoracoabdominal aneurysm: extensive descending thoracic and abdominal involvement down to the bifurcation. If a total endovascular strategy is chosen, a staged approach is generally preferred where feasible to reduce spinal cord ischaemia risk, for example proximal TEVAR followed later by fenestrated or branched visceral repair. A single-stage full-length thoracoabdominal endovascular exclusion carries a higher spinal cord risk.", "why_not": "A under-classifies the aneurysm and ignores the visceral/abdominal component. C is anatomically possible in some settings but is less attractive electively because extensive single-stage coverage increases spinal cord risk. D misclassifies the aneurysm and ignores thoracic involvement. E ignores the visceral and abdominal aortic disease.", "editorial_trap": "This tests both Crawford classification and staging strategy. Endovascular repair is not a single homogeneous answer.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §3.5.3, p.194 and Recommendation 24 (Class IIa, Level C): staged repair should be considered for extensive thoracic/thoraco-abdominal endovascular repair to reduce SCI risk. §6.3.1, pp.213-216 and Recommendation 65 support fenestrated/branched endovascular repair as first-line surgical treatment for suitable TAAA.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "Staging must be balanced against interval rupture risk; it is a treatment principle rather than an absolute requirement in every patient.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-005", "number": 5, "internal_title": "Loeys-Dietz syndrome — descending thoracic aneurysm threshold and modality", "exhibit": "CTA demonstrates a fusiform descending thoracic aortic aneurysm measuring 49 mm. Previous imaging 12 months earlier measured 45 mm. There is no dissection or rupture.", "stem": "A 42-year-old woman with genetically confirmed Loeys-Dietz syndrome is under surveillance in a specialist aortic service. CTA shows a descending thoracic aortic aneurysm measuring 49 mm, increased from 45 mm 12 months earlier. Her father had an aortic dissection in his forties. She is otherwise fit and has not undergone previous aortic surgery.\n\nWhat is the most appropriate management?", "options": {"A": "Continue annual surveillance until the aneurysm reaches 60 mm", "B": "TEVAR as the preferred elective treatment because it avoids thoracotomy", "C": "Refer for elective repair in a specialist aortic centre, with open repair preferred if anatomically feasible", "D": "Begin anticoagulation and repeat CTA in 6 months", "E": "No further imaging is required if blood pressure remains controlled"}, "answer": "C", "explanation": "Loeys-Dietz syndrome is associated with aortic dissection and rupture at younger ages and smaller diameters than degenerative disease. ESVS 2026 advises consideration of descending thoracic aneurysm repair at >4.5-5.0 cm, incorporating growth, age, family history and pathogenic variant. For elective thoracic aortic disease in genetic aortopathy, open repair is preferred when feasible; endovascular repair is mainly reserved for contraindication to open surgery, high surgical risk, acute settings or redo procedures.", "why_not": "A applies a degenerative-aorta threshold to genetic aortopathy. B reverses the guideline preference in a young fit elective patient with native aorta. D has no role in preventing aneurysm rupture. E ignores the need for lifelong aortic surveillance.", "editorial_trap": "The question is not asking for a universal Loeys-Dietz number. The decision is genotype- and risk-feature-dependent; this patient is already in the guideline range and has both interval growth and a strong family history.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §10.1.2 and §10.1.5, pp.230-233. Recommendation 107 (Class IIa, Level C): patients with Loeys-Dietz syndrome and DTA diameter >4.5-5.0 cm should be considered for repair, accounting for progression, age, family history and pathogenic variant. Recommendation 109 (Class IIa, Level C): open surgical repair should be considered preferentially for elective thoracic aortic disease in genetic aortopathy. Recommendation 110 defines selected circumstances for endovascular repair. Postgraduate Vascular Surgery, 2nd ed., Ch.26, pp.514-515 describes Loeys-Dietz syndrome and its arterial aneurysm/tortuosity phenotype.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "Threshold evidence is consensus-level and intentionally individualised by genotype and additional risk features.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-006", "number": 6, "internal_title": "Acute TBAD with renal malperfusion — dynamic obstruction", "exhibit": "Synthetic CTA arterial-phase coronal/MPR and axial renal-level slice showing acute TBAD from distal LSA to iliacs; proximal entry tear 20 mm distal to LSA; zone 3 landing length 28 mm; compressed true lumen through the visceral segment; right renal artery arising from the true lumen; mobile flap compromising the right renal origin; delayed right nephrogram; no fixed dissection flap extending into the renal artery itself; aortic diameter at proximal landing zone 30 mm.", "stem": "A 63-year-old man presents with acute type B aortic dissection and worsening right flank pain. His creatinine has risen from 92 to 178 µmol/L over 12 hours. Lactate is normal and there is no abdominal tenderness. CTA shows a proximal entry tear 20 mm distal to the left subclavian artery. The true lumen is compressed through the visceral aorta. The right renal artery arises from the true lumen, but its origin is intermittently compromised by the mobile dissection flap. There is a delayed right nephrogram. There is no dissection flap extending into the right renal artery itself.\n\nWhat is the most appropriate initial endovascular strategy?", "options": {"A": "Medical therapy alone", "B": "Proximal TEVAR", "C": "TEVAR with distal bare-metal dissection stent", "D": "Right renal artery stenting alone", "E": "Open right renal bypass"}, "answer": "B", "explanation": "This is renal malperfusion from dynamic obstruction. The right renal artery arises from the true lumen and there is no fixed renal artery dissection. The initial treatment is proximal TEVAR to cover the entry tear, depressurise the false lumen and restore true-lumen calibre. A distal bare-metal dissection stent may be considered if true-lumen collapse or malperfusion persists after proximal TEVAR, but it is not the initial default in this stem.", "why_not": "A ignores evolving renal malperfusion. C may be appropriate if malperfusion persists after proximal entry coverage or if there is extensive residual true-lumen collapse, but it is not required from the information given. D treats a branch as though this were fixed static renal obstruction. E is excessive as first-line when the aortic anatomy is suitable for TEVAR.", "editorial_trap": "Dynamic malperfusion is primarily treated by restoring true-lumen pressure. Do not jump straight to branch stenting or PETTICOAT unless the anatomy or response demands it.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.1.3.3, pp.203-204. Recommendation 40 (Class I, Level C): complicated acute TBAD with malperfusion should undergo immediate TEVAR to cover the primary entry tear. The text describes proximal TEVAR as the treatment for dynamic malperfusion by restoring true-lumen perfusion; Recommendation 42 (Class I, Level C) reserves immediate selective branch-vessel revascularisation for residual malperfusion after TEVAR.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "This question intentionally distinguishes dynamic malperfusion from fixed/static branch obstruction. The later real renal-stent case tests the complementary residual-static-malperfusion scenario.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-007", "number": 7, "internal_title": "Type A masquerading as type B", "exhibit": "Synthetic CTA arch/ascending axial and coronal panels showing dissection flap clearly visible in descending thoracic aorta; subtle crescent of intramural haematoma in ascending aorta; small pericardial effusion; descending thoracic true/false lumen extending distally.", "stem": "A 71-year-old woman is transferred as “acute type B dissection for TEVAR”. She has chest pain radiating to the back. Blood pressure is 105/60 mmHg after analgesia. CTA shows a descending thoracic dissection but also a crescent of high attenuation within the ascending aortic wall and a small pericardial effusion. There is no visceral malperfusion.\n\nWhat is the most appropriate next step?", "options": {"A": "Zone 3 TEVAR", "B": "IV heparin and repeat CTA in 24 hours", "C": "Immediate cardiac surgery referral", "D": "Left carotid-subclavian bypass", "E": "Discharge on beta-blocker therapy"}, "answer": "C", "explanation": "Ascending aortic intramural haematoma and pericardial effusion in the context of acute aortic symptoms should be treated as type A acute aortic syndrome until proven otherwise. This is not straightforward type B dissection for TEVAR.", "why_not": "A treats the descending thoracic component while missing the immediate ascending aortic threat. B is unsafe in suspected type A acute aortic syndrome. D does not address the ascending aorta. E is unsafe.", "editorial_trap": "The referral label is bait. The imaging overrides it.", "source_verification": "Postgraduate Vascular Surgery, 2nd ed., Ch.10 Aortic Dissection, pp.217-221: Stanford type A dissection involves the ascending aorta and requires early surgical treatment; pericardial involvement/tamponade is a recognised complication. ESVS 2026 §4.1, p.197 explicitly states that dissections involving the ascending aorta are cardiothoracic emergencies and are outside the DTA guideline scope.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "The management principle is secure, although definitive operative details belong to cardiothoracic/arch guidance rather than the ESVS DTA document.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-008", "number": 8, "internal_title": "Symptomatic PAU — anti-impulse control versus urgent repair", "exhibit": "Synthetic axial CTA descending thoracic aorta showing eccentric penetrating ulcer 18 mm deep and 22 mm wide; surrounding intramural haematoma; focal pseudoaneurysm/outward contour bulge; small left pleural effusion/haemothorax; descending aorta 41 mm; adequate proximal/distal landing zones.", "stem": "An 82-year-old woman presents with sudden severe interscapular pain. CTA shows a descending thoracic penetrating aortic ulcer measuring 18 mm deep and 22 mm wide, with surrounding intramural haematoma, focal pseudoaneurysm formation and a small left pleural effusion. Proximal and distal landing zones appear adequate.\n\nWhat is the most appropriate management?", "options": {"A": "Anti-impulse therapy alone", "B": "Repeat CTA in 48–72 hours", "C": "TEVAR during the index admission", "D": "Open descending thoracic replacement", "E": "Antiplatelet therapy and outpatient surveillance"}, "answer": "C", "explanation": "This is a symptomatic, complicated PAU with associated IMH, pseudoaneurysm morphology and pleural fluid. The indication for treatment is the combination of symptoms and adverse/complicating features rather than an invented absolute ulcer width or depth threshold. With suitable descending-thoracic landing zones, TEVAR is the preferred option offered.", "why_not": "A is inadequate for a symptomatic complicated PAU. B delays definitive treatment despite pseudoaneurysm/IMH and ongoing pain. D is inappropriate for unstable acute aortic syndrome. E is more invasive when suitable TEVAR anatomy is present.", "editorial_trap": "Anti-impulse therapy is not wrong — it is just not enough. The question asks management, not the first drug chart entry.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.2.1-4.2.3, pp.207-208, Recommendation 48 (Class IIa, Level C): complicated PAU/IMH should be considered for TEVAR. Complicating features include rupture, pseudoaneurysm, malperfusion, rapid expansion and refractory/recurrent pain. The guideline specifically states that no consensus cut-off exists for PAU width or depth. Full Vascular A Companion 2024, Ch.14, p.228 supports early endovascular intervention for instability, persistent pain/hypertension, rapid expansion, impending rupture or progressive peri-aortic haemorrhage.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "The 18 x 22 mm morphology adds concern but is not being taught as a formal ESVS threshold.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-009", "number": 9, "internal_title": "Blunt thoracic aortic injury — competing cerebral perfusion target", "exhibit": "Synthetic trauma CTA sagittal oblique panel showing aortic isthmus injury; small pseudoaneurysm 8 mm outpouching; minimal mediastinal haematoma; no active extravasation; no large haemothorax; adequate proximal and distal landing zones for TEVAR.", "stem": "A 29-year-old man is admitted after a high-speed road traffic collision. His injuries include multiple left rib fractures, pulmonary contusion, a small splenic laceration without active bleeding, severe traumatic brain injury with ICP monitoring, and blunt thoracic aortic injury.\n\nCTA shows an aortic isthmus injury with a small pseudoaneurysm and minimal mediastinal haematoma. There is no active extravasation and no large haemothorax. The proximal and distal landing zones are suitable for TEVAR.\n\nThe neurocritical care team advise that maintaining MAP above 85 mmHg is essential to preserve cerebral perfusion pressure. There is no ongoing uncontrolled torso haemorrhage.\n\nWhat is the most appropriate aortic management principle?", "options": {"A": "Anti-impulse therapy and interval CTA", "B": "Early TEVAR", "C": "Open descending thoracic repair", "D": "Delay aortic treatment until the brain injury has resolved", "E": "Permissive hypertension without aortic intervention"}, "answer": "B", "explanation": "The aortic injury is contained, but it includes a pseudoaneurysm. In some patients, selected contained injuries can be managed initially with anti-impulse therapy and surveillance. Here, however, the traumatic brain injury requires higher MAP targets to maintain cerebral perfusion. Leaving the aorta unsecured while deliberately maintaining hypertension increases rupture risk. If anatomy is suitable and there is no uncontrolled bleeding elsewhere, early TEVAR is the best answer.", "why_not": "A may be reasonable in selected patients where anti-impulse therapy can be maintained, but this patient needs higher MAP targets. C is not first-line if TEVAR anatomy is suitable. D leaves the aorta exposed during the period when hypertension is needed. E addresses the brain but ignores the aortic rupture risk.", "editorial_trap": "The associated injuries are not decoration. The TBI changes the haemodynamic target, which changes the threshold for securing the aorta.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §8.1-8.2, pp.224-225. Recommendation 91 (Class I, Level C): urgent TEVAR <24 h is recommended for ESVS grade 2 BTAI with high-risk features; associated traumatic brain injury is explicitly listed as a high-risk feature. Recommendation 89 (Class IIb, Level C) also recognises that even grade 1 BTAI with TBI may justify TEVAR when strict BP control conflicts with cerebral perfusion goals.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "Timing remains individualised in polytrauma; the stem supplies a guideline-listed high-risk feature that favours urgent repair.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-010", "number": 10, "internal_title": "TEVAR access — hostile iliofemoral anatomy and conduit planning", "exhibit": "CTA access reconstruction shows both external iliac arteries are small, heavily calcified and tortuous (approximately 6 mm minimum luminal diameter). The common iliac arteries are of adequate calibre for a retroperitoneal conduit. The intended thoracic device requires a 24 Fr delivery system.", "stem": "A 76-year-old woman is planned for elective TEVAR for a 64 mm descending thoracic aneurysm. The thoracic landing zones are suitable. CTA shows severe bilateral iliofemoral access disease as described in the exhibit. The intended thoracic device requires a 24 Fr delivery system.\n\nWhat is the most appropriate access strategy?", "options": {"A": "Percutaneous common femoral access without access preparation", "B": "Open common femoral exposure alone", "C": "Planned surgical iliac conduit for device delivery", "D": "Brachial artery delivery of the main thoracic endograft", "E": "Abandon endovascular repair solely because femoral access is hostile"}, "answer": "C", "explanation": "The iliofemoral route is too small, calcified and tortuous for safe passage of a large-bore thoracic delivery system. ESVS 2026 recommends pre-operative iliofemoral assessment and states that endovascular or open surgical optimisation should be considered when access is compromised by disease or small calibre. A planned retroperitoneal iliac conduit is an established solution when the common iliac artery is suitable.", "why_not": "A risks iliac rupture/dissection. B changes the puncture site but does not correct the narrow diseased iliac delivery route. D is not a routine route for delivery of the main thoracic endograft. E is unnecessary because hostile access can often be optimised by conduit/endoconduit or other access strategies.", "editorial_trap": "This tests access planning rather than a convention about which groin the main device is 'usually' introduced from.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §3.7, pp.196-197. Recommendation 32 (Class I, Level C): assess iliofemoral access before TEVAR. Recommendation 33 (Class IIa, Level C): endovascular or open surgical optimisation should be considered for diseased/small-calibre iliofemoral access. The text specifically describes retroperitoneal surgical iliac conduits and endoconduits.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "Choice between surgical conduit, endoconduit and other optimisation remains anatomy- and centre-dependent; the stem makes a surgical conduit technically feasible.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-011", "number": 11, "internal_title": "Chronic TBAD after TEVAR — distal seal failure", "exhibit": "Synthetic CTA centreline/MPR after previous TEVAR: prior TEVAR from zone 3 to mid descending thoracic aorta; proximal seal intact; no type Ia endoleak; distal end of thoracic stent graft lands in dissected aneurysmal aorta; contrast passes beyond distal end of graft into false lumen; distal descending thoracic/thoracoabdominal diameter increased from 52 mm to 61 mm; coeliac and SMA arise from true lumen; left renal artery arises from false lumen; distal seal would require extension into the visceral segment.", "stem": "A 64-year-old man underwent TEVAR 3 years ago for chronic type B dissection with aneurysmal degeneration. CTA now shows an intact proximal seal and good remodelling of the covered proximal descending thoracic aorta. The distal end of the stent graft lands in dissected aneurysmal aorta, with contrast filling the false lumen beyond the distal graft edge. The distal descending thoracic aorta has enlarged from 52 mm to 61 mm. The coeliac artery and SMA arise from the true lumen, while the left renal artery arises from the false lumen.\n\nWhat is the most appropriate diagnosis and treatment principle?", "options": {"A": "Type Ia endoleak; proximal arch extension", "B": "Type Ib endoleak; distal extension with fenestrated/branched repair", "C": "Type II endoleak; intercostal artery embolisation", "D": "Normal post-dissection remodelling; annual surveillance", "E": "Isolated left renal stenosis; renal artery stenting"}, "answer": "B", "explanation": "The proximal seal is intact, but the distal graft edge terminates in dissected aneurysmal aorta with ongoing false-lumen filling and aneurysm growth. This is best treated as distal seal failure/type Ib endoleak in the post-dissection TEVAR setting. Because the distal seal must extend into the visceral segment and branch anatomy is complex, treatment requires distal extension with fenestrated or branched repair rather than simple distal cuffing.", "why_not": "A is wrong because the proximal seal is intact. C undercalls the problem and treats it like a benign branch endoleak. D is contradicted by sac growth. E ignores the thoracoabdominal false-lumen pressurisation and would not treat the aneurysm.", "editorial_trap": "Post-dissection TEVAR failure can behave like an endoleak problem, but the solution may be complex visceral extension rather than a simple cuff.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §9.1, p.228, Recommendation 99 (Class IIa, Level C): direct type I and III endoleaks after thoracic/thoraco-abdominal endovascular repair should be considered for re-intervention. §5.3 describes endovascular treatment of chronic post-dissection aneurysmal disease and the need for adequate proximal/distal landing zones.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "In post-dissection anatomy, terminology can overlap with persistent distal false-lumen perfusion. The stem deliberately describes loss of distal seal with aneurysm growth so that the management principle is clear.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-012", "number": 12, "internal_title": "Arch aneurysm extending into proximal descending aorta — frozen elephant trunk", "exhibit": "CTA demonstrates aneurysmal disease involving the distal ascending aorta, the aortic arch and proximal descending thoracic aorta. There is no durable proximal endovascular landing zone in non-aneurysmal ascending aorta without full arch reconstruction.", "stem": "A 66-year-old man is referred with an enlarging aortic arch aneurysm extending into the proximal descending thoracic aorta. He is functionally independent, has no significant cardiopulmonary comorbidity and has not had previous sternotomy. CTA demonstrates involvement of the distal ascending aorta and arch, with no durable proximal endovascular seal zone that avoids aneurysmal aorta.\n\nWhat is the most appropriate definitive repair strategy?", "options": {"A": "Frozen elephant trunk with ascending aortic and arch reconstruction", "B": "Standard zone 3 TEVAR", "C": "Zone 1 branched TEVAR alone", "D": "Left carotid-subclavian bypass alone", "E": "Surveillance imaging only"}, "answer": "A", "explanation": "The pathology requires treatment of the ascending/arch segment as well as the proximal descending thoracic aorta. In a fit patient without a prohibitive sternotomy risk and without a durable endovascular proximal landing zone, a frozen elephant trunk provides conventional ascending/arch reconstruction combined with antegrade stent-grafting of the descending aorta.", "why_not": "B does not treat the arch/ascending component. C depends on a durable proximal endovascular landing zone, which the stem explicitly excludes. D creates no aneurysm exclusion. E is inappropriate for an enlarging aneurysm requiring definitive repair.", "editorial_trap": "This is intentionally the opposite of a high-risk redo-sternotomy case in which an endovascular arch strategy may be favoured. Fitness and proximal landing anatomy matter.", "source_verification": "Oxford Textbook of Vascular Surgery, Section 8.8, p.625 ('Hybrid surgical solutions'): the frozen elephant trunk combines conventional surgical repair of the ascending aorta and arch with open antegrade stent-grafting of the descending aorta during circulatory arrest. ESVS 2026 DTA/TAAA Guidelines, §4.1.4, p.204 also describes FET via median sternotomy with simultaneous ascending-aorta and arch reconstruction in selected complex pathology. The ESVS DTA guideline does not provide comprehensive arch-aneurysm recommendations.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "Arch treatment is incompletely covered by the ESVS DTA guideline. The stem is constructed so that FET is the anatomically coherent option, but this item should be rechecked when the dedicated approved arch guidance is added.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-013", "number": 13, "internal_title": "Shaggy aorta — pre-operative medical optimisation", "exhibit": "CTA shows extensive irregular friable atheroma and loosely adherent thrombotic material throughout the arch and descending thoracic aorta ('shaggy aorta'). The TEVAR landing zones are otherwise adequate.", "stem": "A 78-year-old man is being prepared for elective TEVAR for a 63 mm descending thoracic aneurysm. CTA shows extensive shaggy aorta. He is taking aspirin but is not currently prescribed a statin. He has had no stroke or TIA in the last 6 months and has no symptomatic carotid stenosis.\n\nWhich additional pre-operative measure should be considered specifically because of the shaggy aorta?", "options": {"A": "Therapeutic-dose anticoagulation", "B": "Dual antiplatelet therapy for 3 months before TEVAR", "C": "Prophylactic carotid endarterectomy", "D": "Intensified statin therapy", "E": "Routine prophylactic cerebral embolic protection device placement"}, "answer": "D", "explanation": "Shaggy aorta is associated with embolic complications during aortic instrumentation. ESVS 2026 specifically states that intensified statin therapy may be considered before aortic repair to stabilise extensive thrombotic shaggy-aorta lesions. This is an adjunct to careful procedural planning; it does not eliminate embolic risk.", "why_not": "A and B are not specifically recommended to stabilise shaggy aortic thrombus and may increase bleeding risk. C is not indicated without symptomatic carotid disease. E is not a routine guideline recommendation for TEVAR in shaggy aorta.", "editorial_trap": "The older version simply asked which complication to consent for. This version tests a new, specific 2026 guideline recommendation.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §3.2.4 and §3.2.8, pp.189-191, Recommendation 17 (Class IIb, Level C): extensive thrombosis/shaggy aorta may be considered for intensified statin therapy to stabilise thrombotic lesions before aortic repair.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "This is a weak (Class IIb, Level C) recommendation based on limited observational evidence; it should not be taught as proven elimination of embolic risk.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-014", "number": 14, "internal_title": "Active Takayasu arteritis — first-line medical treatment", "exhibit": "CTA demonstrates long, smooth, non-atherosclerotic stenotic disease affecting the left subclavian and other aortic arch branches, without a focal embolic lesion.", "stem": "A 29-year-old woman presents with left arm claudication, dizziness on arm use and unequal arm pressures. She reports fatigue, night sweats and 4 kg weight loss. CRP is 68 mg/L and ESR is 74 mm/hr. Right arm blood pressure is 148/82 mmHg and left arm pressure is 92/60 mmHg. CTA demonstrates long smooth arch-branch stenoses consistent with active Takayasu arteritis.\n\nWhat is the most appropriate initial management?", "options": {"A": "Immediate left subclavian stenting", "B": "Immediate carotid-subclavian bypass", "C": "High-dose glucocorticoids combined with a disease-modifying antirheumatic drug", "D": "Antiplatelet therapy alone", "E": "Carotid endarterectomy"}, "answer": "C", "explanation": "The priority is control of active vascular inflammation before elective revascularisation where possible. ESVS 2026 recommends high-dose glucocorticoids combined with a DMARD as first-line treatment for active inflammation of the aorta or its branches, within multidisciplinary care.", "why_not": "A and B may be required for fixed critical lesions once disease activity and indications are assessed, but immediate intervention into actively inflamed vessels is not the initial strategy in this stable patient. D does not treat the underlying vasculitis. E treats atherosclerotic carotid bifurcation disease, which is not the pathology shown.", "editorial_trap": "Steroid monotherapy is no longer the most complete contemporary answer in this source set.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §10.3, pp.233-236. Recommendation 114 (Class I, Level C): active inflammatory disease of the aorta/branches should be managed by an MDT. Recommendation 115 (Class I, Level C): high-dose glucocorticoids combined with a DMARD are recommended as first-line treatment. Postgraduate Vascular Surgery, 2nd ed., Ch.26, p.504 describes Takayasu arteritis and corticosteroid-based treatment; the 2026 ESVS guidance adds the explicit DMARD combination recommendation.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE and ANEURYSM - EMERGENCY; thoracic aneurysm/dissection stent grafts and acute aortic syndromes.", "evidence_note": "Choice of DMARD and timing of revascularisation require specialist rheumatology/aortic input.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-015", "number": 15, "internal_title": "Aortobronchial fistula after TEVAR — haemorrhage control as a bridge", "exhibit": "CTA demonstrates a previous thoracic endograft with suspicious peri-endograft inflammatory change adjacent to the left bronchial tree. There is no reliable active contrast extravasation on the acquired phase, but the clinical picture is highly suspicious for aortobronchial fistulation.", "stem": "A 69-year-old man presents with recurrent haemoptysis several years after TEVAR for a descending thoracic aneurysm. He had a smaller self-limiting bleed 48 hours earlier and is febrile. He then coughs approximately 150 mL of fresh blood in the emergency department.\n\nAfter initial resuscitation, HR is 112/min, BP 96/58 mmHg, RR 24/min, SpO2 94% on 15 L oxygen and temperature 38.4°C. Haemoglobin is 96 g/L and lactate 2.8 mmol/L. CTA shows suspicious peri-endograft change adjacent to the bronchial tree but no definite active extravasation.\n\nWhat is the most appropriate immediate aortic management?", "options": {"A": "IV antibiotics and observation alone", "B": "Bronchoscopy before any aortic intervention", "C": "Emergency TEVAR relining to control haemorrhage as a bridge to definitive treatment", "D": "Immediate radical open graft explant before haemorrhage control", "E": "PET-CT before deciding treatment"}, "answer": "C", "explanation": "The combination of herald haemoptysis, previous thoracic endografting, fever, recurrent major bleeding and suspicious graft-bronchial imaging should be treated as an aortobronchial fistula with imminent exsanguination. In a physiologically unstable bleeding patient, a further thoracic stent graft can be used immediately to obtain haemorrhage control and stabilise the patient. This is a bridge strategy: it does not eradicate graft infection or the fistula, and definitive multidisciplinary/open management remains necessary once the patient is stabilised.", "why_not": "A does not control potentially fatal arterial haemorrhage. B may delay haemorrhage control and bronchoscopy can be non-diagnostic when the fistula is peripheral. D may ultimately be required for definitive infection/fistula management but is a poor first manoeuvre in a patient actively bleeding and physiologically unstable. E is not an emergency haemorrhage-control investigation.", "editorial_trap": "A negative CTA for active extravasation does not exclude a fistula. The question asks for immediate haemorrhage control, not definitive eradication of infection.", "video": "images/thoracic/Q15_aortobronchialfistula_video.m4v", "source_verification": "Full Vascular A Companion 2024, Ch.7, 'Aortobronchial fistula', pp.101-102: herald minor bleeding may precede major haemoptysis; a new stent graft may serve as a bridge to stabilise the patient, while radical open reconstruction is more durable. The same chapter states that bronchoscopy may fail to identify a peripheral fistula. Companion Ch.14 key points also recognises TEVAR as a bridge to definitive treatment for thoracic fistulation. ESVS 2026 DTA/TAAA Guidelines refer endograft infection/fistulation to dedicated infection guidance rather than providing a competing emergency recommendation.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "TEVAR relining is a damage-control/bridge strategy in this scenario, not definitive treatment of an infected thoracic endograft.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-016", "number": 16, "internal_title": "Post-TEVAR chest pain — retrograde type A dissection", "exhibit": "Synthetic CTA chest/arch: recent thoracic stent graft from zone 2 to mid descending thoracic aorta; proximal graft edge just distal to LCCA; new dissection flap in ascending aorta; small pericardial effusion; thoracic stent graft patent; no distal access-vessel occlusion.", "stem": "A 68-year-old man undergoes TEVAR for complicated acute type B dissection. The proximal landing zone measured 30 mm and a 36 mm thoracic stent graft was deployed, giving 20% oversizing. Completion angiography was satisfactory.\n\nTwelve hours later he develops central chest pain and becomes clammy. Observations are HR 118 bpm, BP 94/58 mmHg, RR 24/min, SpO₂ 96% on 4 L oxygen. ECG shows no ST elevation. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate next step?", "options": {"A": "Extend the TEVAR proximally using a branched device", "B": "Repeat CTA in 24 hours", "C": "Immediate cardiac surgery referral", "D": "Left carotid-subclavian bypass", "E": "Systemic thrombolysis"}, "answer": "C", "explanation": "This is retrograde type A dissection after TEVAR and requires urgent cardiothoracic surgical assessment for open ascending-aortic repair. The 36 mm graft in a 30 mm proximal landing zone represents 20% oversizing. ESVS 2026 advises avoiding excessive oversizing in non-ruptured acute TBAD and notes that some studies suggest approximately 0-10%, while emphasising that no universal rule can be given. The Companion Guide similarly advises limiting oversizing to about 10% and avoiding balloon moulding in dissection.", "why_not": "A is the tempting endovascular answer, but it treats the wrong problem and may worsen proximal aortic injury. B delays treatment of a life-threatening type A complication. D does not address the ascending aorta. E would be dangerous.", "editorial_trap": "Do not respond to every post-TEVAR problem by adding more TEVAR. The complication has moved into the ascending aorta.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.1.3.3, pp.203-204: excessive proximal oversizing should be avoided in non-ruptured ATBAD; some studies suggest 0-10%, but no universal rule is given. Recommendation 44 advises against balloon moulding and/or excessive oversizing. The same section describes RTAAD as life-threatening and requiring urgent open repair of the ascending aorta. Full Vascular A Companion 2024, Ch.14, p.227: graft oversizing in dissection is limited to about 10% and balloon dilatation should be avoided.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "Do not teach >10% as a formal ESVS binary threshold. The 20% oversizing in this stem is deliberately excessive and is a risk/context clue, not the diagnostic criterion for RTAAD.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-017", "number": 17, "internal_title": "Kommerell diverticulum — symptomatic compression below prophylactic size threshold", "exhibit": "CTA demonstrates an aberrant right subclavian artery arising from a Kommerell diverticulum. The diverticulum measures below the ESVS suggested prophylactic treatment thresholds for an asymptomatic lesion. There is visible oesophageal compression and no rupture or dissection.", "stem": "A 57-year-old woman presents with progressive dysphagia to solids. CTA demonstrates an aberrant right subclavian artery arising from a Kommerell diverticulum with clear oesophageal compression. The diverticulum is below the suggested ESVS size thresholds for prophylactic treatment of an asymptomatic lesion. There is no rupture or dissection.\n\nWhat is the most appropriate management?", "options": {"A": "Continue surveillance because the diverticulum has not reached an asymptomatic size threshold", "B": "Oesophageal dilatation as definitive treatment", "C": "Refer for operative treatment of the symptomatic aberrant subclavian artery/Kommerell diverticulum in a specialist aortic centre", "D": "Anticoagulation and repeat CTA in 12 months", "E": "No treatment unless the diverticulum reaches 55 mm transverse diameter"}, "answer": "C", "explanation": "Symptoms attributable to compression of adjacent structures are themselves an indication to consider surgical treatment of an aberrant subclavian artery/Kommerell diverticulum. The asymptomatic prophylactic size thresholds do not override convincing dysphagia lusoria. The exact repair technique may be open, hybrid or endovascular and should be individualised to anatomy, risk and local expertise.", "why_not": "A incorrectly applies an asymptomatic threshold to a symptomatic patient. B treats the oesophageal consequence rather than the vascular cause. D does not address mechanical compression. E uses the wrong measurement concept and again ignores symptoms.", "editorial_trap": "This reconciles the apparent threshold problem: ESVS gives size criteria for considering prophylactic treatment in asymptomatic disease, but symptomatic compression is a separate treatment indication.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §10.6, pp.240-242. Recommendation 127 (Class IIa, Level C): surgical treatment should be considered when symptoms are attributable to compression of adjacent structures such as the oesophagus or trachea. Recommendation 128 (Class IIb, Level C) gives suggested thresholds for asymptomatic disease (transverse diameter ≥3.0 cm or combined diverticulum-to-adjacent-aorta distance ≥5.5 cm). Recommendation 129 states that open, hybrid or endovascular technique should be individualised.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "The source does not support a blanket statement that every Kommerell diverticulum requires treatment at any size solely because of rupture risk. Symptoms provide the stronger indication here.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-018", "number": 18, "internal_title": "Adult coarctation — haemodynamic indication and endovascular first-line treatment", "exhibit": "CTA demonstrates focal juxtaductal coarctation just distal to the left subclavian artery with post-stenotic dilatation and developed intercostal collaterals.", "stem": "A 26-year-old man is investigated for resistant hypertension. Right-arm blood pressure is 168/94 mmHg despite three agents. Femoral pulses are delayed and echocardiography shows mild left ventricular hypertrophy. The systolic blood pressure difference between the right arm and leg is 32 mmHg. CTA demonstrates focal native juxtaductal coarctation with anatomy suitable for stenting.\n\nWhat is the most appropriate management?", "options": {"A": "Continue antihypertensive therapy alone", "B": "Endovascular stenting", "C": "Ascending-to-descending aortic bypass", "D": "Balloon angioplasty alone", "E": "Surveillance because extensive collaterals indicate adequate compensation"}, "answer": "B", "explanation": "This adult has upper-limb hypertension/LVH and a systolic upper-to-lower-limb gradient well above 20 mmHg, satisfying the guideline indication for treatment. In anatomically suitable adults, endovascular stenting should be considered first-line therapy. Collaterals demonstrate chronicity but do not remove the haemodynamic indication for repair.", "why_not": "A leaves a haemodynamically significant lesion untreated. C is more invasive and is not first line for straightforward focal adult anatomy. D has higher recoil/recoarctation and aneurysm concerns than stenting in adults. E confuses collateral adaptation with physiological correction.", "editorial_trap": "The older stem implied significance from clinical features alone. The revised stem supplies the explicit haemodynamic criterion used by ESVS 2026.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §10.5, pp.238-240. Recommendation 123 (Class I, Level C): treat adults with upper-limb hypertension or LVH when a systolic upper-lower limb or catheter gradient ≥20 mmHg is present. Recommendation 124 (Class IIa, Level C): endovascular treatment should be considered first-line in adult coarctation, with stent type individualised.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "Stent design (covered vs bare; balloon-expandable vs self-expanding) is anatomy- and clinical-factor-dependent and is deliberately not tested here.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-019", "number": 19, "internal_title": "Acute uncomplicated TBAD — morphology and timing", "exhibit": "Synthetic CTA centreline/MPR: acute type B dissection starting 18 mm distal to LSA; no rupture; patent true lumen to visceral branches; maximum descending thoracic aortic diameter 43 mm; false lumen larger than true lumen proximally; primary entry tear 14 mm; partial false lumen thrombosis; zone 3 landing length 24 mm; proximal landing diameter 30 mm.", "stem": "A 59-year-old man presents with acute type B dissection. His pain settles with IV beta-blockade and analgesia. Systolic BP is controlled at 115 mmHg. Creatinine, lactate and limb perfusion are normal. CTA findings are shown in the exhibit. He is otherwise fit.\n\nWhat is the most appropriate management?", "options": {"A": "Best medical therapy and early surveillance", "B": "TEVAR during the acute admission", "C": "Open descending thoracic replacement", "D": "Discharge with annual CTA", "E": "Fenestrated thoracoabdominal repair"}, "answer": "A", "explanation": "He currently has uncomplicated acute TBAD: pain and blood pressure are controlled, with no rupture or malperfusion. ESVS 2026 recommends continued conservative management with anti-impulse therapy and structured serial cross-sectional imaging. Selected patients with early expansion or large initial diameter >4.0 cm may be considered for TEVAR, preferably in the subacute phase; this does not justify routine acute-admission TEVAR in an otherwise uncomplicated patient.", "why_not": "B may be considered in selected subacute/high-risk uncomplicated TBAD or if complications develop, but the stem does not justify acute intervention as the best answer. C is excessive for uncomplicated TBAD. D is too lax for the early risk period and adverse morphology. E is not appropriate for this acute uncomplicated descending thoracic presentation.", "editorial_trap": "The trap is overreacting to adverse morphology. It changes follow-up intensity and later planning, but it does not automatically convert a controlled uncomplicated acute TBAD into an acute TEVAR case.", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §4.1.3.1-4.1.3.2, pp.201-203. Recommendation 38 (Class IIa, Level C): uncomplicated acute TBAD should continue conservative management with anti-impulse therapy and serial imaging; suggested acute/subacute imaging includes 48 hours, one week, one month and three months. Recommendation 39 (Class IIb, Level C): selected uTBAD with early expansion or initial diameter >4.0 cm may be considered for TEVAR, preferably during the subacute phase.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - EMERGENCY; diagnosis and management of acute aortic dissection / acute aortic transection within a collaborative team.", "evidence_note": "High-risk morphology influences follow-up and possible subacute intervention; it does not convert every stable uTBAD into an indication for immediate acute TEVAR.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-020", "number": 20, "internal_title": "Descending thoracic aneurysm — TEVAR planning and spinal cord protection", "exhibit": "Annotated 3D CTA reconstruction. Use the measurements and branch-vessel relationships shown on the image to plan treatment.", "stem": "A 61-year-old man with a previous smoking history undergoes an urgent CT thorax because of persistent hoarseness. No thoracic malignancy is identified, but the scan demonstrates the thoracic aortic aneurysm shown in the exhibit as an incidental finding.\n\nHe has no previous medical or surgical history and is otherwise asymptomatic. He has a full complement of palpable upper- and lower-limb pulses bilaterally.\n\nHe is referred for urgent assessment for thoracic aortic repair.\n\nBased on the imaging, which is the most appropriate treatment strategy?", "options": {"A": "TEVAR with prophylactic cerebrospinal fluid drainage", "B": "TEVAR without prophylactic cerebrospinal fluid drainage", "C": "Zone 2 TEVAR with left carotid-subclavian bypass", "D": "TEVAR with planned coeliac artery coverage", "E": "Staged TEVAR followed by fenestrated visceral aortic repair"}, "answer": "B", "explanation": "The reconstruction demonstrates an aneurysm that clearly exceeds the guideline repair threshold, with usable proximal and distal descending-thoracic landing zones while preserving both the left subclavian artery and coeliac artery. The aneurysm itself is 175 mm long, so the actual covered segment will be extensive once adequate seal zones are included. However, ESVS 2026 does not mandate prophylactic CSF drainage on the basis of a single numerical coverage threshold and states that a reactive/rescue drainage strategy may be preferable to routine prophylactic drainage for extensive endovascular thoracic repair. In this real case, with no previous aortic repair and no additional obvious clinical evidence of compromised limb collateral territories, TEVAR was performed without a prophylactic drain.", "why_not": "A is a defensible strategy in some centres/high-risk anatomies, but routine prophylactic drainage is not mandated by ESVS 2026 and carries its own complications. C is unnecessary because the annotated image shows an adequate proximal landing zone distal to the LSA. D is unnecessary because there is ample distal landing length before the coeliac artery. E is unnecessary because the visceral segment does not need incorporation.", "editorial_trap": "The image must be interrogated. The candidate should recognise that the total covered length will exceed the aneurysm length once seal zones are added, but also that the LSA and visceral/pelvic collateral territories have not been deliberately sacrificed by the proposed repair.", "image": "images/thoracic/Q12 TAA TEVAR plan.jpg", "source_verification": "ESVS 2026 DTA/TAAA Guidelines, §6.2-6.3.1, pp.212-216: Recommendation 61 (Class IIa, Level C) supports repair of DTA/TAAA ≥6.0 cm; Recommendation 64 (Class I, Level B) recommends TEVAR as first-line surgical treatment for descending thoracic aneurysm. §3.5-3.5.4, pp.193-195: extensive coverage, hypotension and blood loss increase SCI risk; preservation of LSA and pelvic collaterals is important; Recommendation 26 (Class IIb, Level C) states that reactive/rescue CSF drainage may be considered preferable to routine prophylactic drainage in extensive thoracic endovascular repair. Full Vascular A Companion 2024, Ch.14, p.217 discusses extensive coverage, previous infrarenal aortic repair and LSA coverage as SCI risk factors and notes variation between prophylactic and selective CSF-drain strategies.", "curriculum_domain": "JCIE Vascular Surgery Curriculum (Aug 2021, v2 July 2023): ANEURYSM - ELECTIVE; thoracic aneurysm/dissection stent grafts within a collaborative team; knowledge of thoraco-abdominal and less common aneurysms.", "evidence_note": "This is the least absolute of the revised SBAs: prophylactic versus reactive CSF drainage remains centre-specific and supported by low-level evidence. ESVS 2026 does not define >200 mm as a mandatory drainage threshold. Retain as a real-case planning question with this uncertainty visible in the explanation.", "editorial_status": "Source-verified draft; pending human review."}, {"id": "THO-021", "number": 21, "internal_title": "TBAD with limb malperfusion — static iliac obstruction", "exhibit": "Synthetic CTA centreline/MPR with pelvic axial reconstruction: acute type B dissection beginning 22 mm distal to LSA; proximal descending landing zone suitable; visceral branches perfused; right common iliac artery narrowed by extension of dissection flap into the iliac origin; re-entry at right common iliac bifurcation; right external iliac true lumen markedly compressed; left iliac system patent.", "stem": "A 61-year-old man presents with acute type B dissection and right leg pain. BP is controlled with IV beta-blockade. Lactate is 2.8 mmol/L. The right foot is cool with reduced motor power in the toes; the left leg is well perfused. CTA findings are shown in the exhibit. The coeliac artery, SMA and both renal arteries are patent.\n\nWhat is the most appropriate endovascular strategy?", "options": {"A": "Proximal TEVAR alone", "B": "Right iliac stenting alone", "C": "TEVAR and right iliac stent", "D": "TEVAR and femoro-femoral crossover graft", "E": "Medical therapy and repeat CTA in 24 hours"}, "answer": "C", "explanation": "This is complicated acute TBAD with limb malperfusion. The proximal entry tear is suitable for TEVAR, but the right iliac obstruction has a static component from extension of the dissection flap into the iliac system. Proximal TEVAR treats the dissection pressurisation, while a right iliac stent directly treats the fixed iliac obstruction. TEVAR with femoro-femoral crossover graft is a valid option and an important backup if iliac stenting fails or cannot be performed, but it is not the preferred first choice here because extra-anatomical bypass adds wound and infection risk and usually involves a longer anaesthetic.", "why_not": "A may not relieve fixed iliac obstruction. B treats the limb vessel but leaves the proximal dissection pressurisation untreated. D is a valid fallback strategy, but is less attractive than endovascular iliac correction when the iliac lesion is stentable. E is unsafe with neurological deficit in the limb.", "editorial_trap": "Do not treat all malperfusion as purely dynamic. The branch anatomy determines whether TEVAR alone is enough."}, {"id": "THO-022", "number": 22, "internal_title": "Minimal blunt thoracic aortic injury", "exhibit": "Synthetic trauma CTA sagittal oblique image: small intimal flap at aortic isthmus; no pseudoaneurysm; no contour abnormality; no mediastinal haematoma; no active extravasation; aortic diameter otherwise normal.", "stem": "A 34-year-old woman is admitted after a high-speed road traffic collision. Her injuries include rib fractures, pulmonary contusions and a stable pelvic fracture. CTA findings are shown in the exhibit. She is haemodynamically stable after initial resuscitation. There is no intracranial haemorrhage and no ongoing blood loss.\n\nWhat is the most appropriate management of the aortic injury?", "options": {"A": "TEVAR during this admission", "B": "Open isthmus repair", "C": "Anti-impulse therapy and interval CTA", "D": "Systemic anticoagulation", "E": "Thoracic endograft plus left carotid-subclavian bypass"}, "answer": "C", "explanation": "This is a minimal blunt thoracic aortic injury: a small intimal flap without pseudoaneurysm, external contour abnormality, mediastinal haematoma or active extravasation. These injuries are commonly managed non-operatively with blood pressure/impulse control and surveillance imaging.", "why_not": "A is overtreatment for the lesion described. B is disproportionate and carries higher morbidity. D does not treat the injury and may be harmful in trauma. E is unnecessary without a TEVAR indication or zone 2 requirement.", "editorial_trap": "Not every traumatic aortic injury is a TEVAR. The key is distinguishing minimal intimal injury from pseudoaneurysm or contained rupture."}, {"id": "THO-023", "number": 23, "internal_title": "Distal landing after TEVAR for descending thoracic aneurysm", "exhibit": "Synthetic CTA centreline/MPR: fusiform descending thoracic aneurysm, maximum 66 mm; proximal landing zone adequate in zone 3; distal thoracic aorta tapers progressively towards the visceral segment; coeliac artery, SMA and renal arteries patent; visceral aortic segment suitable for fenestrated repair; iliac access suitable.", "stem": "A 72-year-old man is being evaluated for endovascular repair of a 66 mm descending thoracic aneurysm. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate treatment strategy?", "options": {"A": "TEVAR", "B": "TEVAR + FEVAR", "C": "TEVAR + FEVAR (staged)", "D": "Open descending thoracic replacement", "E": "Best medical therapy with surveillance imaging"}, "answer": "C", "explanation": "The aneurysm approaches the visceral segment, so TEVAR alone is unlikely to provide a durable distal repair. In suitable anatomy, a combined thoracic and fenestrated strategy is appropriate. Staging the TEVAR and FEVAR components is preferred where feasible to reduce spinal cord ischaemia risk, rather than excluding a long thoracoabdominal segment in a single sitting.", "why_not": "A does not provide a durable distal seal. B may be technically feasible, but a single-stage extensive thoracoabdominal endovascular repair carries greater spinal cord ischaemia risk. D is a reasonable alternative in selected patients, but the question asks for the preferred endovascular strategy in suitable anatomy. E is inappropriate for a 66 mm aneurysm being evaluated for repair.", "editorial_trap": "The key issue is not whether the proximal landing zone is adequate. The distal extent means TEVAR alone is insufficient, and the staging decision matters because of spinal cord risk."}, {"id": "THO-024", "number": 24, "internal_title": "Favourable remodelling after TEVAR for chronic TBAD", "exhibit": "Synthetic CTA centreline/MPR: previous TEVAR from zone 3 to mid-descending thoracic aorta; proximal and distal graft seal intact; covered thoracic false lumen thrombosed; true lumen expanded in treated segment; descending thoracic diameter reduced from 58 mm to 49 mm; distal dissected abdominal aorta 34 mm and unchanged; coeliac, SMA and renal arteries patent; no endoleak or stent-induced new entry.", "stem": "A 69-year-old man underwent TEVAR 4 years ago for chronic type B dissection with descending thoracic aneurysmal degeneration. He remains well. Surveillance CTA findings are shown in the exhibit. The covered thoracic false lumen is thrombosed, the true lumen has expanded and the treated thoracic aorta has reduced in diameter. The distal dissected abdominal aorta is stable at 34 mm.\n\nWhat is the most appropriate management?", "options": {"A": "Continue structured lifelong surveillance", "B": "Extend with fenestrated endovascular repair", "C": "Relining of the thoracic endograft", "D": "False lumen embolisation", "E": "Open thoracoabdominal replacement"}, "answer": "A", "explanation": "This is favourable remodelling after TEVAR for chronic type B dissection. The treated thoracic false lumen is thrombosed, true lumen calibre has improved and the aortic diameter has reduced. The distal dissected aorta is not aneurysmal and is stable. This requires continued lifelong surveillance of the whole aorta, but not secondary intervention at this stage.", "why_not": "B would be appropriate if there were progressive distal thoracoabdominal aneurysmal degeneration or inadequate distal seal, but that is not present. C is not indicated because there is no endoleak, migration or device failure. D is not indicated because there is no persistent false-lumen perfusion driving expansion. E is disproportionate in a stable, remodelled aorta.", "editorial_trap": "Not every post-dissection TEVAR patient with residual dissection needs further repair. False lumen thrombosis and aortic shrinkage are favourable findings; the correct response is surveillance, not intervention."}, {"id": "THO-025", "number": 25, "internal_title": "TEVAR implantation syndrome", "exhibit": "Synthetic CTA chest: TEVAR in good position; no endoleak; no sac expansion; mild peri-aortic inflammatory change; no perigraft gas; no fluid collection; no oesophageal or bronchial abnormality.", "stem": "A 70-year-old man is reviewed 48 hours after uncomplicated TEVAR for a descending thoracic aneurysm. He reports mild malaise and low-grade fever. Temperature is 37.7°C, HR 88 bpm and BP 128/72 mmHg. WCC is 10.8 × 10⁹/L and CRP is 58 mg/L. Initial blood cultures are negative. CTA findings are shown in the exhibit.\n\nWhat is the most likely diagnosis?", "options": {"A": "Thoracic endograft infection", "B": "Aortobronchial fistula", "C": "TEVAR implantation syndrome", "D": "Type Ia endoleak", "E": "Acute type A dissection"}, "answer": "C", "explanation": "TEVAR implantation syndrome is a recognised inflammatory response following endograft placement. Patients may develop low-grade fever, mild leucocytosis and a rise in inflammatory markers despite negative cultures and reassuring imaging. In high-risk aortic procedures, it is still reasonable to perform a septic screen to exclude other causes. If no infective source is found and imaging is reassuring, the most likely cause is TEVAR implantation syndrome.", "why_not": "A is not supported by the imaging findings or negative cultures. B would usually present with haemoptysis or imaging evidence of fistulation. D is excluded by the CTA findings. E is not suggested by the clinical presentation or imaging.", "editorial_trap": "Early fever after TEVAR is not synonymous with graft infection. Interpretation requires correlation of timing, imaging and microbiological findings."}, {"id": "THO-026", "number": 26, "internal_title": "Post-TEVAR distal stent-induced new entry", "exhibit": "Synthetic CTA centreline/MPR:\n\n- Previous TEVAR from zone 3 to distal descending thoracic aorta\n- Proximal seal intact\n- Covered thoracic false lumen thrombosed proximally\n- New contrast entry at the distal stent edge\n- False lumen reperfusion below the distal stent edge\n- Distal descending thoracic aorta enlarged from 46 mm to 57 mm\n- Coeliac artery, SMA and renal arteries patent", "stem": "A 63-year-old man underwent TEVAR 3 years ago for complicated type B dissection. Surveillance imaging had previously shown favourable remodelling of the proximal descending thoracic aorta. He now reports recurrent interscapular discomfort. CTA findings are shown in the exhibit. The proximal seal remains intact.\n\nWhat is the most appropriate interpretation?", "options": {"A": "Type Ia endoleak", "B": "Type II endoleak", "C": "Expected post-dissection remodelling", "D": "Distal stent-induced new entry", "E": "Thoracic graft infection"}, "answer": "D", "explanation": "The key finding is new contrast entry at the distal stent edge with reperfusion of the false lumen and distal aortic enlargement. This is consistent with distal stent-induced new entry rather than proximal seal failure. It can re-pressurise the false lumen and drive aneurysmal degeneration.", "why_not": "A would imply proximal seal failure, but the proximal seal is intact. B undercalls the mechanism and implies a branch-flow endoleak rather than a new entry at the stent edge. C is contradicted by recurrent false lumen perfusion and aortic growth. E would need clinica
