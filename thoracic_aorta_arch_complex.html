<script>
const S_COMP="Full Vascular: A Companion to Specialist Surgical Practice (2024), Ch 14, pp 224-227 (PDF pp 273-276)";
const S_CURR="Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, document pp 59-60 (PDF pp 16-17)";
const D="Draft pending full source verification and human review.";
const Q=(id,title,stem,options,answer,explanation,why_not,extra={})=>({id:`THO-${String(id).padStart(3,"0")}`,number:id,internal_title:title,stem,options,answer,explanation,why_not,source:extra.source||"Approved source set - exact section/page verification pending",curriculum_domain:extra.domain||"Aneurysm - thoracic aortic disease and endovascular management",uncertainty:extra.uncertainty||D,...extra});
const QUESTIONS=[
Q(1,"Real case 1 - acute TBAD, LSCA occlusion and zone 2 strategy",`A 59-year-old man who smokes, with hypertension and hypercholesterolaemia, presents with a 2-day history of severe left-sided chest and interscapular back pain radiating down his left arm. ACS investigations are negative. BP is 181/99 mmHg, pulse 92/min, respiratory rate 22/min, SpO2 96% on air and temperature 36.2 C.\n\nThe left brachial and radial pulses are absent. The hand remains warm and reasonably perfused, with mild paraesthesia but no motor deficit. CTA shows an acute type B aortic dissection extending immediately proximal to the left subclavian artery (LSCA), with LSCA occlusion by the dissection. An adequate proximal TEVAR seal requires coverage of the LSCA origin.\n\nWhat is the most appropriate management strategy?`,{A:"Continue anti-impulse therapy and repeat CTA in 24 hours",B:"Left carotid-subclavian bypass alone",C:"Emergency zone 2 TEVAR without LSCA revascularisation",D:"Left carotid-subclavian bypass followed by emergency zone 2 TEVAR",E:"Open descending thoracic aortic replacement"},"D","Upper-limb malperfusion makes this a complicated acute type B dissection. Proximal entry coverage is required, and the planned zone 2 repair will cover an already compromised LSCA; in this real-case anatomy, carotid-subclavian bypass preserves left-arm and collateral perfusion before emergency TEVAR.","A does not treat malperfusion. B treats the branch consequence but not the dissection. C sacrifices LSCA inflow without revascularisation. E carries greater acute morbidity when endovascular anatomy is suitable.",{video:"images/thoracic/Q20 cTBAD.m4v",exhibit:"Initial CTA: acute type B dissection extends immediately proximal to the LSCA; the LSCA is occluded by the dissection and must be covered to obtain a proximal seal.",source:`${S_COMP}; ${S_CURR}`,domain:"Acute aortic syndrome; complicated type B dissection; acute upper-limb ischaemia; thoracic endovascular planning",uncertainty:"The need and timing of LSCA revascularisation are anatomy- and urgency-dependent; this answer reflects the supplied real case and requires final expert review."}),
Q(2,"Real case 2 - persistent static renal malperfusion after TEVAR",`A 59-year-old man undergoes left carotid-subclavian bypass and emergency zone 2 TEVAR for acute complicated type B dissection. Completion angiography after stent-graft deployment and ballooning shows improved aortic true-lumen expansion, but poor left renal perfusion persists. Selective angiography demonstrates a fixed dissection flap extending into the left renal artery, consistent with static branch-vessel obstruction.\n\nWhat is the most appropriate next intervention?`,{A:"Observation after successful proximal TEVAR",B:"Further balloon dilatation of the thoracic stent-graft",C:"Covered stenting of the left renal artery",D:"Distal bare-metal aortic dissection stenting alone",E:"Open left renal artery bypass"},"C","Persistent static branch-vessel obstruction is not reliably corrected by proximal entry coverage alone. Direct branch-vessel rescue is required; in this case a covered left renal artery stent restores renal perfusion.","A leaves ongoing renal malperfusion untreated. B does not correct a fixed renal-artery flap and may add aortic injury. D addresses aortic true-lumen support rather than the fixed branch lesion. E is more invasive when endovascular branch rescue is feasible.",{video:"images/thoracic/Q20 Persistent left renal malperfusion.m4v",exhibit:"Completion angiography after TEVAR and ballooning: persistent static dissection of the left renal artery with impaired renal perfusion.",source:`${S_COMP} (dynamic versus static malperfusion at p 225; visceral stenting may be required at p 227); ${S_CURR}`,domain:"Acute aortic syndrome; malperfusion; adjunctive visceral intervention",uncertainty:"The approved text supports visceral stenting for persistent malperfusion but does not unambiguously specify a covered rather than bare renal stent. The device choice is case-led and requires human verification."}),
Q(3,"Real case 3 - distal failure and persistent false-lumen pressurisation",`Six months after emergency TEVAR for acute type B dissection, surveillance CTA shows a satisfactory proximal seal but distal contrast entry with persistent false-lumen pressurisation (type Ib distal failure). The false lumen markedly compresses the thoracic endograft and aortic true lumen. The coeliac artery, SMA and both renal arteries arise from the compressed true lumen, and the dissection extends into both iliac arteries.\n\nWhat is the most appropriate treatment principle?`,{A:"Proximal relining of the thoracic endograft",B:"Embolisation of intercostal branch vessels",C:"Standard TEVAR extension across the visceral segment without branch preservation",D:"Endovascular exclusion of distal false-lumen inflow while preserving visceral perfusion",E:"Continue surveillance because the proximal seal is satisfactory"},"D","Treatment must address the mechanism: ongoing distal false-lumen inflow and pressurisation are compressing the true lumen and endograft. The repair should exclude or occlude that inflow while maintaining all visceral branches arising from the true lumen. A false-lumen occlusion device (a candy plug in the actual case) is one possible technique; the examinable point is the principle.","A does not address distal inflow. B targets collateral branches rather than the distal failure described. C threatens all visceral vessels. E accepts ongoing pressurisation and severe compression.",{video:"images/thoracic/Q20 T1bEL 1.m4v",exhibit:"Six-month CTA: distal false-lumen filling/type Ib failure, compressed thoracic endograft and true lumen, visceral branches from the true lumen, and dissection into both iliacs.",source:`${S_COMP} (false-lumen pressurisation and true-lumen compression at pp 224-225); ${S_CURR} (endoleak recognition and endovascular treatment principles)`,domain:"Post-TEVAR surveillance; endoleak/distal failure; chronic dissection reintervention",uncertainty:"The approved source set does not prescribe one unambiguous device or technique for this anatomy. The answer deliberately tests the treatment principle; the candy-plug technique remains a case-specific draft detail."}),
Q(4,"Incidental low-risk penetrating aortic ulcer","A 79-year-old man has an incidental shallow descending thoracic ulcer on CTA. He has no pain, intramural haematoma, pleural effusion or periaortic change; the aorta is 34 mm and the crater is 3 mm deep. What is the most appropriate next step?",{A:"TEVAR this admission",B:"Short-interval outpatient CTA surveillance",C:"Emergency open repair",D:"Therapeutic anticoagulation",E:"No aortic follow-up"},"B","An asymptomatic low-risk lesion is managed medically with surveillance rather than urgent repair.","A and C overtreat; D is not treatment for PAU; E omits surveillance.",{image:"images/thoracic/Small PAU.jpg",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - penetrating aortic ulcer; surveillance of low-risk thoracic aortic pathology",uncertainty:"Draft pending verification that the supplied image matches the low-risk morphology described in the stem."}),
Q(5,"Visceral protection during open extent II TAAA repair",`A fit 63-year-old man undergoes open repair of a 68 mm Crawford extent II thoracoabdominal aortic aneurysm. Partial left-heart bypass has been established with return through the femoral artery.

The proximal graft anastomosis has been completed. The distal clamp is moved below the renal arteries, and the coeliac, superior mesenteric and renal artery ostia are exposed while the visceral reconstruction is performed.

Which perfusion strategy most directly limits renal and mesenteric ischaemia during this phase?`,{A:"Continue retrograde distal aortic perfusion without selectively cannulating the visceral arteries",B:"Selectively perfuse the coeliac, superior mesenteric and renal arteries using balloon catheters connected to the bypass circuit",C:"Perfuse both renal arteries with cold crystalloid while leaving the coeliac and superior mesenteric arteries unperfused",D:"Release the proximal thoracic clamp intermittently to perfuse the visceral arteries",E:"Discontinue left-heart bypass and institute profound hypothermic circulatory arrest"},"B","Once the visceral artery ostia are exposed and excluded from effective distal aortic perfusion, selective catheter perfusion from the left-heart bypass circuit provides continuous oxygenated blood to the coeliac, superior mesenteric and renal arteries while their reconstruction is completed. This directly limits renal and mesenteric ischaemia.","A does not reliably perfuse the exposed visceral ostia during this phase. C protects the kidneys but leaves the mesenteric circulation ischaemic. D produces uncontrolled, intermittent perfusion and disrupts the reconstruction. E adds the morbidity of profound hypothermic circulatory arrest when selective perfusion is available.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 220 (PDF p 269); Postgraduate Vascular Surgery, 2e, Chapter 9, printed p 215 (PDF p 233)",domain:"Aneurysm - open thoracoabdominal aortic aneurysm repair; renal and visceral organ protection",uncertainty:"The precise bypass circuit and perfusion protocol vary between specialist aortic centres. The question tests the supported principle of selective visceral and renal perfusion during open extent II repair."}),
Q(6,"Extent II TAAA - staged endovascular strategy","A fit 62-year-old has a 67 mm aneurysm from just distal to the LSCA to the aortic bifurcation, incorporating all visceral arteries. A total endovascular repair is planned. Which strategy is most appropriate?",{A:"Single-stage TEVAR",B:"Staged TEVAR followed by fenestrated/branched repair",C:"Infrarenal EVAR",D:"Open infrarenal repair",E:"Surveillance"},"B","This is extensive thoracoabdominal disease; staged coverage reduces the physiological and spinal-cord burden where feasible.","A is incomplete; C and D do not treat the thoracic/visceral segment; E is inappropriate at this size."),
Q(7,"Heritable thoracic aortic disease before pregnancy","A 31-year-old planning pregnancy has a 44 mm aortic root and two first-degree relatives who died from young aortic dissection. What is the most appropriate advice?",{A:"Use a 55 mm degenerative threshold",B:"Aspirin and imaging in five years",C:"Proceed with pregnancy without specialist review",D:"Genetic assessment and consideration of prophylactic root surgery",E:"Descending TEVAR"},"D","The family history suggests heritable thoracic aortic disease; pregnancy and operative thresholds require specialist genetic and aortic assessment.","A-C underestimate inherited/pregnancy risk; E does not treat the root."),
Q(8,"Type A acute aortic syndrome masquerading as type B","CTA shows a descending dissection plus ascending aortic intramural haematoma and a small pericardial effusion. What is the next step?",{A:"Zone 3 TEVAR",B:"Heparin",C:"Immediate cardiac surgery referral",D:"Carotid-subclavian bypass",E:"Discharge"},"C","Ascending involvement makes this a type A acute aortic syndrome requiring emergency cardiac surgical assessment.","A misses the ascending threat; B and E are unsafe; D is irrelevant.",{image:"images/thoracic/9F1497E9-538A-484A-A206-5C8CA74F6113.jpeg"}),
Q(9,"Symptomatic high-risk penetrating aortic ulcer","A patient has persistent chest pain with a deep descending thoracic PAU, associated IMH and increasing pleural effusion despite blood-pressure control. What is the best management?",{A:"Discharge",B:"Annual CTA",C:"TEVAR during the index admission",D:"Anticoagulation",E:"Exercise testing"},"C","Symptoms and high-risk imaging features warrant repair when anatomy is suitable.","A, B and E delay definitive treatment; D does not treat the lesion."),
Q(10,"Blunt thoracic aortic injury with competing haemorrhage",`A 32-year-old man is admitted after a high-speed road traffic collision. He remains hypotensive despite blood-product resuscitation. CTA demonstrates a grade III blunt thoracic aortic injury with a contained isthmus pseudoaneurysm and no active aortic extravasation.

There is also a large haemoperitoneum with active splenic arterial bleeding. The trauma team considers the abdominal haemorrhage to be the immediate source of his instability.

What is the most appropriate management sequence?`,{A:"Perform TEVAR before treating the abdominal haemorrhage",B:"Control the active abdominal haemorrhage first, then undertake TEVAR after physiological stabilisation",C:"Perform immediate open isthmus repair followed by damage-control laparotomy",D:"Manage both injuries non-operatively and repeat CTA after 24 hours",E:"Perform damage-control laparotomy but manage the aortic pseudoaneurysm with outpatient surveillance alone"},"B","The contained grade III aortic injury requires definitive repair, preferably by TEVAR, but it is not the source of the current haemodynamic instability. The immediately life-threatening splenic haemorrhage should be controlled first. Anti-impulse therapy and close monitoring are used as physiology permits, followed by TEVAR once the patient has been resuscitated and stabilised.","A delays control of the active source of shock. C exposes an unstable polytrauma patient to open thoracic repair and still delays abdominal haemorrhage control. D leaves active haemorrhage and a grade III aortic injury untreated. E correctly prioritises abdominal haemorrhage but omits the planned definitive treatment required for the pseudoaneurysm.",{source:"Oxford Textbook of Vascular Surgery, Chapter 3.3, printed pp 195-199 (PDF pp 220-224); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 228 (PDF p 277)",domain:"Vascular trauma - blunt thoracic aortic injury; prioritisation and sequencing in polytrauma",uncertainty:"The exact timing of TEVAR after haemorrhage control depends on physiological recovery and associated injuries. The supported principle is to control the immediate source of instability before scheduled repair of a contained grade III injury."}),
Q(11,"Hostile iliac access for TEVAR","The planned main-device side is the right groin. The right external iliac artery is severely calcified and too small for the delivery system; the left is also unsuitable. What is the best access strategy?",{A:"Force femoral passage",B:"Right iliac conduit",C:"Brachial delivery",D:"Carotid delivery",E:"Abandon repair"},"B","A surgical iliac conduit provides controlled large-bore access when femoral/iliac anatomy is unsuitable.","A risks rupture; C and D are unsuitable for the main device; E is unnecessary if a conduit is feasible.",{image:"images/thoracic/IMG_3554C82B-964A-4DE7-A037-B87424A5796C.jpeg"}),
Q(12,"Arch aneurysm - redo sternotomy risk versus endovascular arch strategy",`A 78-year-old man has a symptomatic arch aneurysm extending into the proximal descending thoracic aorta. CTA measurements are shown in the exhibit. He is independent, but has had previous CABG with anterior grafts close to the sternum and patchy calcification of the distal ascending aorta.\n\nWhat is the most appropriate repair strategy?`,{A:"Frozen elephant trunk",B:"Standard zone 3 TEVAR",C:"Zone 1 branched TEVAR with carotid-carotid bypass",D:"Left carotid-subclavian bypass alone",E:"Surveillance imaging in 12 months"},"C","The aneurysm is symptomatic and requires treatment if feasible. Zone 3 and zone 2 seal are inadequate, while zone 1 seal is adequate. Prior CABG with anterior grafts and calcified distal ascending aorta make open arch/FET less attractive, without making him unfit for general anaesthesia. A zone 1 branched TEVAR strategy with carotid-carotid bypass is therefore the best option offered. A carotid-carotid bypass can be tunnelled anteriorly, where it is relatively exposed and potentially vulnerable to trauma or infection, or retro-oesophageally, where it may produce dysphagia-lusoria-type symptoms. These issues should be considered when planning zone 1 arch strategies.","A may be appropriate in a different patient, but redo sternotomy and ascending aortic features make it less attractive here. B does not provide a proximal seal. D does not treat the arch aneurysm. E is inappropriate for a symptomatic arch aneurysm.",{video:"images/thoracic/Q12archaneurysm.m4v",image:"images/thoracic/F591305C-CC2A-48E0-A853-B6457D6BF11F.png",exhibit:"Arch CTA with centreline measurements: arch aneurysm involving the distal arch and proximal descending thoracic aorta; LSA origin involved; zone 3 landing inadequate; zone 2 landing 7 mm; zone 1 landing 31 mm; ascending aorta diameter 34 mm; distal landing beyond the aneurysm and iliofemoral access are suitable.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - aortic arch aneurysm; supra-aortic debranching; branched TEVAR; redo sternotomy risk",uncertainty:"Real-world case draft pending full approved-source verification and human review."}),
Q(13,"Measurement of a tortuous descending thoracic aortic aneurysm",`A 74-year-old man undergoes CTA surveillance of an asymptomatic descending thoracic aortic aneurysm. The reporting workstation shows a maximum diameter of 61 mm on a conventional axial image. The aorta is markedly tortuous, and the axial measurement crosses it obliquely.

Multiplanar centreline reconstruction gives a maximum diameter of 55 mm when measured perpendicular to the direction of aortic flow.

Which measurement method should be used as the reference maximum aortic diameter for management planning?`,{A:"The largest diameter visible on any conventional axial image",B:"The maximum diameter measured perpendicular to the centreline of flow",C:"The maximum diameter of the contrast-opacified lumen alone",D:"The anteroposterior diameter measured on a sagittal reconstruction",E:"The diameter of the nearest normal proximal landing zone"},"B","Thoracic aortic diameters should be measured on multiplanar reconstructions perpendicular to the centreline of flow. An oblique axial image can overestimate the true diameter in a tortuous aorta and should not determine whether an intervention threshold has been reached.","A accepts the known obliquity and resulting overmeasurement. C excludes mural thrombus and the aneurysm wall. D remains dependent on the orientation of the aorta rather than its flow axis. E is required for device planning but is not a substitute for the maximum aneurysm diameter.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 214 and 216 (PDF pp 263 and 265); Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 586 (PDF p 611)",domain:"Aneurysm - thoracic aortic imaging; centreline measurement and endovascular planning",uncertainty:"The item tests measurement technique rather than a universal intervention threshold. Treatment still depends on symptoms, pathology, growth, physiological fitness and contemporary specialist guidance."}),
Q(14,"Takayasu arteritis with arch-branch stenosis","A young woman has upper-limb claudication, raised inflammatory markers and long smooth stenoses of arch branches. What is the best initial principle?",{A:"Immediate stenting during active inflammation",B:"Control inflammation before elective revascularisation",C:"Thrombolysis",D:"No follow-up",E:"TEVAR of normal descending aorta"},"B","Revascularisation is more durable after disease activity is controlled unless an emergency mandates otherwise.","A risks restenosis in active disease; C, D and E do not address the process.",{image:"images/thoracic/IMG_C42C2939-2B78-4219-94DF-DAB3FB7BFF4C.jpeg"}),
Q(15,"Suspected aortobronchial fistula after TEVAR","A patient with previous TEVAR presents with recurrent haemoptysis. CTA shows perigraft change, loss of the fat plane to an adjacent bronchus and focal lung consolidation. What is the best next step?",{A:"Routine clinic review",B:"Treat as suspected aortobronchial fistula with urgent aortic MDT management",C:"Anticoagulate",D:"Bronchoscopy biopsy as the first step",E:"Discharge with antibiotics"},"B","The presentation is a life-threatening aorto-airway fistula until proven otherwise and needs urgent specialist planning and source control.","A and E delay care; C may worsen bleeding; D may be hazardous and does not secure the aorta.",{video:"images/thoracic/Q15_aortobronchialfistula_video.m4v",image:"images/thoracic/7C2C94E8-D9E5-4340-ADF7-DD33B997AC6B.png"}),
Q(16,"Retrograde type A dissection after TEVAR","Soon after TEVAR a patient develops new central chest pain. CTA shows a new ascending aortic dissection. What is the next step?",{A:"Distal TEVAR extension",B:"Immediate cardiac surgery referral",C:"Observe overnight",D:"Heparin",E:"Renal stenting"},"B","Retrograde type A dissection is a surgical emergency.","A treats the wrong direction; C and D are unsafe; E is unrelated.",{image:"images/thoracic/B8DC18D5-DF63-4FDF-9A62-257EBB17A879.png"}),
Q(17,"Symptomatic Kommerell diverticulum","A patient with an aberrant right subclavian artery has dysphagia and an enlarging Kommerell diverticulum. What is the treatment principle?",{A:"No follow-up",B:"Exclude the diverticulum and preserve/revascularise the subclavian circulation",C:"Carotid endarterectomy",D:"Infrarenal EVAR",E:"Anticoagulation alone"},"B","Symptomatic enlarging pathology requires exclusion with an arch/subclavian strategy tailored to anatomy.","A ignores symptoms/growth; C-E do not treat the lesion."),
Q(18,"Adult aortic coarctation","An adult has resistant hypertension, radiofemoral delay and a focal native coarctation suitable for endovascular repair. What is preferred?",{A:"Covered stent",B:"TEVAR across the visceral aorta",C:"Carotid bypass",D:"No treatment",E:"Thrombolysis"},"A","A covered stent treats the focal obstruction and provides protection against wall injury in suitable anatomy.","B and C are anatomically inappropriate; D ignores significant disease; E has no thrombotic target."),
Q(19,"Descending aortic aneurysm in Marfan syndrome",`A 42-year-old man with genetically confirmed Marfan syndrome previously underwent valve-sparing aortic-root replacement. He remains physically active and has good cardiac, pulmonary and renal function.

Surveillance demonstrates chronic post-dissection aneurysmal degeneration of the native descending thoracic aorta, now measuring 58 mm and having enlarged by 8 mm over 12 months. Intervention is considered necessary. Although endovascular access is satisfactory, the available proximal and distal sealing zones are both within native, genetically abnormal aorta.

What is the most appropriate definitive treatment strategy?`,{A:"Continue annual surveillance until the diameter reaches 65 mm",B:"Standard TEVAR using the native proximal and distal sealing zones",C:"Open aortic replacement in a specialist multidisciplinary aortic centre",D:"Embolisation of the false lumen without aortic replacement",E:"Branched endovascular repair with both sealing zones in native aorta"},"C","This is a young, physiologically fit patient with progressive post-dissection aneurysmal disease caused by a heritable connective-tissue disorder. First-line TEVAR is discouraged when both sealing zones would lie in native genetically abnormal aorta because of continuing degeneration, treatment failure and reintervention. Specialist open replacement offers the most durable definitive strategy in the circumstances described.","A applies an inappropriately high degenerative threshold despite established progression and Marfan syndrome. B and E place radial force and both sealing zones in native genetically abnormal aorta; endovascular treatment is better reserved for selected circumstances such as prohibitive open risk, emergency bridging or sealing within existing prosthetic grafts. D does not replace the progressively aneurysmal diseased segment.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 223 (PDF p 272); Oxford Textbook of Vascular Surgery, Chapter 8.1, printed p 576 (PDF p 601)",domain:"Aneurysm - heritable connective-tissue aortopathy; chronic dissection; open versus endovascular repair",uncertainty:"Endovascular intervention may be appropriate in selected connective-tissue patients, particularly when a prosthetic landing zone is available or open surgery is unsuitable. Those circumstances are deliberately excluded from this stem."}),
Q(20,"Spinal-cord collateral preservation during extensive TEVAR",`A 73-year-old man is being assessed for total endovascular repair of an extensive thoracoabdominal aortic aneurysm. He has previously undergone infrarenal EVAR, and the right internal iliac artery is chronically occluded.

The proposed repair would cover 26 cm of thoracic aorta, beginning in zone 2. The left subclavian artery is patent, and the left internal iliac artery provides the remaining direct pelvic collateral inflow.

Which operative plan most appropriately reduces his risk of spinal-cord ischaemia?`,{A:"Perform the repair in one stage and cover the left subclavian artery without revascularisation",B:"Stage the aortic coverage, revascularise the left subclavian artery and preserve left internal iliac perfusion",C:"Perform the repair in one stage with a prophylactic CSF drain as the only protective measure",D:"Embolise the left internal iliac artery before staged aortic coverage",E:"Perform single-stage repair followed by permissive postoperative hypotension"},"B","This patient has several major threats to the spinal collateral network: long-segment thoracic coverage, previous infrarenal aortic repair, planned LSCA coverage and loss of one internal iliac artery. Staging the coverage while preserving or restoring the remaining supra-aortic and pelvic collateral inflow reduces the spinal ischaemic burden. Adequate perfusion pressure and oxygen delivery remain essential throughout.","A removes LSCA inflow and undertakes all coverage in one stage. C treats CSF drainage as a substitute for collateral preservation and staged repair; drain use should form part of a wider risk-based protocol. D sacrifices the remaining pelvic collateral inflow. E combines extensive single-stage coverage with hypotension, further reducing spinal cord perfusion.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 217 and 221 (PDF pp 266 and 270); Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 588 (PDF p 613)",domain:"Aneurysm - extensive TEVAR; spinal-cord ischaemia prevention; collateral-network preservation",uncertainty:"Prophylactic CSF-drain practice varies between centres. The question therefore tests staging and preservation of collateral inflow rather than asserting that every high-risk patient requires a drain."}),
Q(21,"Initial anti-impulse therapy for acute type B dissection",`A 66-year-old woman presents with sudden severe interscapular pain. CTA confirms an acute type B aortic dissection beginning distal to the left subclavian artery. There is no rupture or branch-vessel malperfusion.

Her BP is 212/118 mmHg and pulse is 112/min. Peripheral perfusion and urine output are satisfactory. She has no contraindication to beta-blockade.

Which is the most appropriate initial pharmacological strategy?`,{A:"Commence an intravenous vasodilator alone and accept any reflex tachycardia while the blood pressure falls",B:"Titrate intravenous beta-blockade to reduce heart rate and left-ventricular ejection impulse, adding an intravenous vasodilator if hypertension persists",C:"Commence oral beta-blockade and reassess the blood pressure the following day",D:"Lower the systolic blood pressure with an intravenous vasodilator before introducing beta-blockade",E:"Treat the pain but withhold antihypertensive therapy until repeat imaging has confirmed stability"},"B","Initial treatment should rapidly reduce both heart rate and left-ventricular ejection impulse. Intravenous beta-blockade is therefore established first, with an intravenous vasodilator added only if adequate blood-pressure control has not been achieved. This reduces aortic wall shear stress while avoiding vasodilator-induced reflex tachycardia.","A and D introduce a vasodilator before impulse control and may provoke reflex tachycardia. C is too slow for severe hypertension in an acute dissection. E leaves dangerous hypertension and shear stress untreated.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 226 (PDF p 275); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, printed pp 59-60 (PDF pp 16-17)",domain:"Aneurysm - acute aortic dissection; initial anti-impulse therapy and emergency management",uncertainty:"Drug selection and haemodynamic targets must be individualised to organ perfusion and contraindications. Draft pending human review."}),
Q(22,"Minimal blunt thoracic aortic injury",`A 34-year-old woman is admitted after a high-speed road traffic collision. Her injuries include rib fractures, pulmonary contusions and a stable pelvic fracture. CTA findings are shown in the exhibit. She is haemodynamically stable after initial resuscitation. There is no intracranial haemorrhage and no ongoing blood loss.\n\nWhat is the most appropriate management of the aortic injury?`,{A:"TEVAR during this admission",B:"Open isthmus repair",C:"Anti-impulse therapy and interval CTA",D:"Systemic anticoagulation",E:"Thoracic endograft plus left carotid-subclavian bypass"},"C","This is a minimal blunt thoracic aortic injury: a small intimal flap without pseudoaneurysm, external contour abnormality, mediastinal haematoma or active extravasation. These injuries are commonly managed non-operatively with blood pressure/impulse control and surveillance imaging.","A is overtreatment for the lesion described. B is disproportionate and carries higher morbidity. D does not treat the injury and may be harmful in trauma. E is unnecessary without a TEVAR indication or zone 2 requirement.",{image:"images/thoracic/A97E7A80-BFFC-4DE5-85DB-A7C3B674C547.png",exhibit:"Synthetic trauma CTA sagittal oblique image: small intimal flap at aortic isthmus; no pseudoaneurysm; no contour abnormality; no mediastinal haematoma; no active extravasation; aortic diameter otherwise normal.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - blunt thoracic aortic injury; non-operative management and surveillance",uncertainty:"Draft pending approved-source verification and human review."}),
Q(23,"Real case 2 - complicated TBAD requiring a zone 2 branched strategy",`A 70-year-old man presents with sudden-onset retrosternal chest pain that began at 06:00 and has persisted. At onset he experienced 10 minutes of left-leg coolness, paraesthesia and pain, which then resolved. He has hypertension but no other medical problems, takes no regular medication and has no allergies. He has never smoked and cycles daily.\n\nPulse is 48/min, BP 164/105 mmHg, SpO2 97% on air and temperature 36.5 C. WCC is 11.4 x10^9/L, haemoglobin 114 g/L, platelets 273 x10^9/L, MCV 85 fL, sodium 139 mmol/L, potassium 3.7 mmol/L, eGFR 45 mL/min/1.73 m2 (usual approximately 70) and INR 1.1.\n\nCTA demonstrates acute type B aortic dissection with impaired left renal and left iliac perfusion. The proximal entry tear is too close to the left subclavian artery (LSCA) to obtain an adequate standard proximal seal without entering zone 2. The LSCA anatomy is suitable for preservation with a dedicated branched thoracic device.\n\nWhat is the most appropriate initial aortic treatment strategy?`,{A:"Anti-impulse therapy alone with interval CTA",B:"Standard zone 3 TEVAR",C:"Zone 2 TEVAR with intentional LSCA coverage and no revascularisation",D:"Branched zone 2 TEVAR preserving LSCA perfusion",E:"Open descending thoracic aortic replacement"},"D","Renal and limb malperfusion make this a complicated acute type B dissection requiring intervention. The entry tear requires a zone 2 proximal seal, and the supplied anatomy permits endovascular preservation of LSCA perfusion. In the real case, this principle was delivered with a GORE TBE branched thoracic endograft.","A does not correct organ malperfusion. B cannot obtain the required proximal seal. C sacrifices LSCA perfusion when a suitable preservation strategy is available. E is more invasive when the supplied anatomy permits branched endovascular repair.",{video:"images/thoracic/Q22 cTBAD.m4v",exhibit:"Initial CTA: acute type B aortic dissection with a proximal entry tear requiring a zone 2 seal, together with left renal and left iliac malperfusion.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - acute aortic syndrome; complicated type B dissection; thoracic endovascular planning; malperfusion",uncertainty:"Draft based on the supplied real case. Device-specific suitability and the management recommendation require approved-source verification and human review."}),
Q(24,"Real case 2 - persistent static left renal malperfusion after branched TEVAR",`A 70-year-old man undergoes branched zone 2 TEVAR for acute type B aortic dissection with renal and limb malperfusion. Completion angiography shows satisfactory endograft deployment and improved aortic true-lumen expansion, but the left renal artery does not enhance. Selective angiography demonstrates persistent fixed compromise of the left renal artery from the dissection.\n\nWhat is the most appropriate next intervention?`,{A:"Further balloon dilatation of the thoracic endograft",B:"Balloon fenestration of the aortic dissection flap",C:"Bare-metal stenting of the left renal artery",D:"Covered stenting of the superior mesenteric artery",E:"Open left renal artery bypass"},"C","Persistent static compromise of a renal branch is not reliably corrected by proximal entry coverage alone and requires direct branch-vessel treatment. In this real case, renal perfusion was restored with a balloon-mounted Palmaz bare-metal stent.","A does not correct the fixed renal branch lesion. B is principally used to address dynamic pressure-related malperfusion rather than the demonstrated static branch compromise. D treats a normally perfused different vessel. E is unnecessarily invasive when the lesion can be crossed and stented endovascularly.",{video:"images/thoracic/Q22 cTBAD post TEVAR.m4v",exhibit:"Completion angiography after branched TEVAR: non-enhancement of the left renal artery due to persistent static branch-vessel compromise.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - type B dissection; static branch-vessel malperfusion; adjunctive renal intervention",uncertainty:"Draft based on the supplied angiographic sequence and real-case treatment. Exact source and device-choice verification remain pending human review."}),
Q(25,"Real case 2 - persistent left iliac malperfusion after renal rescue",`After branched TEVAR and successful stenting of a persistently compromised left renal artery, completion angiography shows no flow through the left iliac system. The left leg remains cool and pulseless. The fixed iliac obstruction related to the dissection can be crossed endovascularly.\n\nWhat is the most appropriate next intervention?`,{A:"Balloon fenestration of the aortic dissection flap alone",B:"Covered stenting of the right common iliac artery",C:"Self-expanding bare-metal stenting of the left iliac artery",D:"Catheter-directed thrombolysis of the left iliac artery",E:"Femoro-femoral crossover bypass"},"C","The persistently cool, pulseless leg and absent iliac flow demonstrate ongoing static limb malperfusion despite proximal aortic repair. Direct stenting of the affected left iliac segment is appropriate when it can be crossed. A self-expanding bare-metal stent was used in the real case.","A is less appropriate for the demonstrated fixed iliac obstruction. B treats the wrong side. D does not address the dissection-related mechanical obstruction. E may be an alternative if endovascular recanalisation fails, but is not the best next step when the lesion is crossable.",{video:"images/thoracic/Q22 cTBAD left iliac.m4v",exhibit:"Angiography after renal artery rescue: absent left iliac flow with a persistently cool, pulseless left leg.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - type B dissection; static iliac malperfusion; acute limb ischaemia; adjunctive iliac intervention",uncertainty:"Draft based on the supplied angiographic sequence and real-case treatment. Exact source verification remains pending human review."}),
Q(26,"Real case 2 - spinal cord ischaemia rescue after extensive TEVAR",`On postoperative day 1 after branched TEVAR and branch-vessel rescue, a 70-year-old man develops loss of temperature sensation in both legs, followed shortly by loss of movement. A lumbar CSF drain is in situ but has been clamped. BP is 134/72 mmHg, haemoglobin is 91 g/L and he is receiving no supplemental oxygen. There is no new limb pulse deficit.\n\nWhat is the most appropriate immediate management?`,{A:"Urgent MRI of the spinal cord before treatment",B:"Systemic anticoagulation and neurological observation",C:"Emergency spinal cord rescue with CSF drainage and optimisation of perfusion and oxygen delivery",D:"Immediate repeat left iliac angiography",E:"Emergency decompressive laminectomy"},"C","This is acute spinal cord ischaemia after extensive thoracic aortic intervention. Treatment must be immediate and should restore spinal cord perfusion pressure and oxygen delivery, including reopening the CSF drain according to the local protocol, augmenting arterial pressure, correcting anaemia and optimising oxygenation. The real patient was treated successfully using the COPS protocol and recovered.","A delays time-critical rescue. B does not restore spinal cord perfusion. D is not supported when there is no new pulse deficit and the neurological syndrome is bilateral. E does not treat the perfusion mechanism.",{source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - complications of TEVAR; spinal cord ischaemia; emergency rescue",uncertainty:"Draft based on the supplied postoperative course. The components and targets of any named COPS protocol must be checked against the approved source set and local practice before publication."}),
Q(27,"Real case 2 - late type Ia endoleak after branched TEVAR",`A 70-year-old man has recovered well after branched TEVAR for complicated type B aortic dissection and is asymptomatic at follow-up. Six-month surveillance CTA demonstrates a type Ia endoleak with persistent proximal pressurisation. The descending thoracic aorta measures 51 mm.\n\nWhat is the most appropriate management principle?`,{A:"Continue annual CTA surveillance because he is asymptomatic",B:"Embolise thoracic intercostal arteries supplying the excluded segment",C:"Undertake definitive correction of the proximal seal failure after complex aortic multidisciplinary assessment",D:"Extend the existing thoracic endograft distally",E:"Commence long-term antimicrobial therapy and arrange PET-CT"},"C","A type Ia endoleak is failure of the proximal seal and maintains pressurisation of the treated aortic pathology. The patient therefore requires specialist multidisciplinary assessment and a definitive strategy to restore a durable proximal seal. In this real case, the eventual treatment was a frozen elephant trunk after the necessary multidisciplinary reviews; the stem does not provide enough arch anatomy to make that one technique uniquely correct.","A is unsafe because absence of symptoms does not remove the risk from persistent proximal pressurisation. B does not address a proximal type I seal failure. D treats the wrong end of the repair. E would be appropriate only if infection were suspected, which the stem does not suggest.",{video:"images/thoracic/Q22 T1AEL.m4v",exhibit:"Six-month CTA: type Ia endoleak after branched TEVAR, with the descending thoracic aorta measuring 51 mm.",source:"Approved source set - exact section/page verification pending",domain:"Aneurysm - surveillance after TEVAR; type I endoleak; complex aortic reintervention; multidisciplinary decision-making",uncertainty:"Draft based on the supplied real case. Frozen elephant trunk was the actual treatment, but the available stem anatomy supports only a principle-driven answer. Exact source verification and human review are required."}),
Q(28,"Motor-evoked potential deterioration during open TAAA repair",`A fit 59-year-old man undergoes open repair of a Crawford extent II thoracoabdominal aortic aneurysm using partial left-heart bypass and cerebrospinal-fluid drainage. Mean arterial pressure is maintained above 80 mmHg.

During sequential reconstruction, temporary occlusion of several large intercostal arteries arising between T9 and T11 produces a reproducible bilateral loss of lower-limb motor-evoked potentials. The signals recover when these arteries are reperfused.

What is the most appropriate operative response?`,{A:"Oversew the affected intercostal arteries and increase distal bypass flow",B:"Sacrifice the affected intercostal arteries and rely on postoperative cerebrospinal-fluid drainage",C:"Lower the mean arterial pressure to reduce bleeding from the intercostal origins",D:"Reimplant the implicated intercostal arteries into the aortic graft",E:"Complete the repair without reimplantation and assess lower-limb movement after extubation"},"D","The reproducible motor-evoked potential loss during occlusion identifies these segmental arteries as important contributors to spinal-cord perfusion. Reimplanting the implicated intercostal arteries restores their contribution to the collateral network and directly addresses the intraoperative evidence of spinal-cord ischaemia.","A and B permanently sacrifice vessels shown to be functionally important. C would further reduce spinal-cord perfusion pressure. E delays action until potentially irreversible neurological injury has occurred.",{source:"Postgraduate Vascular Surgery, 2e, Chapter 9, printed p 214 (PDF p 232); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - open thoracoabdominal aortic aneurysm repair; spinal-cord protection and neuromonitoring",uncertainty:"Intercostal reimplantation strategy varies between specialist centres and is integrated with other spinal-protection measures. Draft pending human review."}),
Q(29,"Acute TBAD with refractory hypertension","A patient with acute TBAD remains severely hypertensive despite multi-agent IV therapy and has recurrent pain. What is the best classification/management principle?",{A:"Uncomplicated; discharge",B:"Complicated/high-risk; urgent specialist consideration of TEVAR",C:"Start anticoagulation",D:"Elective review in one year",E:"Open infrarenal repair"},"B","Refractory hypertension and recurrent pain indicate failure of medical control and prompt intervention assessment.","A and D delay care; C and E are inappropriate."),
Q(30,"Definitive treatment of an infected native descending thoracic aneurysm",`A 58-year-old man presents with fever and persistent thoracic back pain. Blood cultures repeatedly grow Staphylococcus aureus. CTA demonstrates a rapidly enlarging irregular saccular aneurysm of the descending thoracic aorta with surrounding inflammatory change.

There is no free rupture. He has good physiological reserve and has been transferred to a specialist aortic centre where open reconstruction is technically feasible.

Which is the most appropriate definitive treatment plan?`,{A:"Culture-directed antibiotic therapy with imaging surveillance alone",B:"Definitive TEVAR followed by a short course of antibiotics",C:"Open resection of the infected aorta, wide debridement and arterial reconstruction, combined with culture-directed antibiotic therapy",D:"Percutaneous drainage of the periaortic inflammatory tissue without aortic reconstruction",E:"High-dose glucocorticoid therapy followed by interval CTA"},"C","In a physiologically fit patient with a technically resectable infected native aortic aneurysm, definitive source control requires removal of the infected aorta, wide debridement and arterial reconstruction, together with prolonged culture-directed antimicrobial therapy.","A does not provide source control. B places prosthetic material into an infected field without debridement and is more appropriately considered for selected high-risk patients or as a bridge in an emergency. D leaves the infected aortic wall untreated. E treats an inflammatory disorder rather than the demonstrated bacterial infection.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 13, printed pp 209-210 (PDF pp 255-256); Oxford Textbook of Vascular Surgery, Chapter 8.2, printed p 582 (PDF p 607); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed pp 58-59 (PDF pp 15-16)",domain:"Aneurysm - infected native thoracic aortic aneurysm; antimicrobial therapy and definitive source control",uncertainty:"Endovascular treatment may be definitive or a bridge in selected high-risk or emergency cases. The stem deliberately specifies a stable, fit patient in whom open source control is feasible. Draft pending human review."}),
Q(31,"Real case - infective native aortic arch aneurysm in a patient unfit for intervention",`An 88-year-old woman is diagnosed with an infective native aortic arch aneurysm. CTA demonstrates a markedly irregular saccular arch aneurysm with surrounding inflammatory change. There is no active extravasation, and she is haemodynamically stable.\n\nShe is severely frail. Following review by the complex aortic multidisciplinary team, including cardiac surgery, vascular surgery, anaesthesia, microbiology and radiology, she is considered unfit for open arch replacement, hybrid repair or endovascular intervention. The anticipated procedural burden is judged to outweigh any realistic benefit.\n\nWhat is the most appropriate management strategy?`,{A:"Emergency open arch replacement with in-situ reconstruction",B:"Hybrid supra-aortic debranching followed by TEVAR",C:"TEVAR alone as definitive source control",D:"Microbiology-directed antimicrobial therapy with symptom control and advance care planning",E:"No antimicrobial treatment and routine annual CTA surveillance"},"D","Definitive treatment of an infective native aortic aneurysm ordinarily combines antimicrobial therapy with aortic source control. In this patient, however, specialist multidisciplinary assessment has established that every open, hybrid and endovascular option carries prohibitive risk and no realistic net benefit. The best achievable plan is therefore culture- and microbiology-directed antimicrobial treatment together with symptom control, explicit discussion of prognosis and goals of care, and an individualised follow-up plan. This is conservative or palliative management rather than curative treatment.","A and B contradict the multidisciplinary conclusion that she cannot tolerate major repair. C does not remove infected tissue and has also been judged unsuitable in this anatomy and clinical context. E omits treatment of the infection and offers surveillance that is too passive for a life-threatening infective process.",{video:"images/thoracic/Mycotic DTAA.m4v",exhibit:"CTA: markedly irregular saccular infective aneurysm of the aortic arch with surrounding inflammatory change and no active contrast extravasation.",source:"ESVS/EACTS Consensus Document for the Management of Aortic Arch Pathologies (2019), section 8.4, printed p 188 (merged ESVS guideline PDF p 419): diagnosis should integrate clinical, radiological and laboratory data; conservative treatment may be considered in selected cases",domain:"Aneurysm - infective native aortic aneurysm; aortic arch pathology; multidisciplinary and palliative decision-making",uncertainty:"Conservative management is not definitive source control and prognosis remains poor. The precise antimicrobial regimen and duration must be individualised with microbiology. Draft pending visual verification of the supplied CTA and human review."}),
Q(32,"Additional imaging for suspected aortitis",`A 72-year-old woman reports fatigue, weight loss and thoracic discomfort. Her C-reactive protein is persistently elevated, but repeated blood cultures are negative.

CTA demonstrates smooth circumferential thickening of the thoracic aortic wall extending into the proximal supra-aortic branches. There is no focal saccular aneurysm, periaortic gas or contained rupture. Active large-vessel aortitis is suspected.

Which additional imaging investigation is most useful for confirming the suspected aortic inflammatory process?`,{A:"Fluorodeoxyglucose PET-CT",B:"CT coronary angiography",C:"Catheter aortography",D:"Transthoracic echocardiography",E:"Upper-limb arterial duplex ultrasonography"},"A","Fluorodeoxyglucose PET-CT demonstrates metabolically active inflammation in the aortic wall and is the most useful listed investigation for confirming suspected aortitis and assessing the distribution of active large-vessel inflammation.","B assesses the coronary arteries rather than aortic-wall inflammatory activity. C defines the lumen but not mural metabolic activity. D does not adequately assess the descending thoracic aortic wall or the distribution described. E is limited to accessible peripheral vessels and cannot evaluate the full thoracic process.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 586 (PDF p 611); Vascular Surgery Curriculum (2021, v2 July 2023), Vasospastic Disorders and Vasculitis, printed p 57 (PDF p 14), and Aneurysm - Elective, printed pp 58-59 (PDF pp 15-16)",domain:"Vasospastic disorders and vasculitis; inflammatory and vasculitic aortic pathology",uncertainty:"PET-CT findings must be interpreted alongside clinical, biochemical and anatomical imaging findings. Draft pending human review."}),
Q(33,"Residual distal dissection after type A repair","After repaired type A dissection, surveillance shows enlarging residual dissected descending aorta with a patent false lumen. What is the best principle?",{A:"Stop surveillance",B:"Expert aortic assessment for staged distal intervention",C:"Carotid endarterectomy",D:"Anticoagulation alone",E:"Infrarenal ligation"},"B","Progressive residual dissection needs multidisciplinary planning for open, hybrid or endovascular treatment.","A delays; C-E do not address the pathology."),
Q(34,"SMA branch instability after branched TAAA repair","Completion imaging after branched repair shows a kinked SMA bridging stent with pressure damping. What is the best next step?",{A:"Ignore it",B:"Correct/reline the unstable branch before completion",C:"Occlude the SMA",D:"Remove the whole graft",E:"Anticoagulation only"},"B","A threatened visceral bridging component should be corrected before it thromboses.","A and E leave mechanical failure; C causes mesenteric ischaemia; D is disproportionate."),
Q(35,"ACTA2-related heritable thoracic aortic disease",`A 39-year-old woman is referred after genetic testing identifies a pathogenic ACTA2 variant. Her mother sustained a type A aortic dissection at a relatively small aortic diameter, and a younger sibling has premature coronary artery disease. The patient has livedo reticularis and iris flocculi. Her aortic root measures 43 mm.\n\nWhat is the most appropriate management principle?`,{A:"Manage as a degenerative aneurysm and defer specialist review until the root reaches 55 mm",B:"Arrange annual echocardiography but do not offer assessment to relatives",C:"Plan ascending aortic TEVAR when the root reaches 50 mm",D:"Refer to a specialist heritable-aortic-disease team for gene- and family-history-specific intervention planning and cascade screening of first-degree relatives",E:"Discharge because the aortic root is below 50 mm"},"D","ACTA2-related disease is an autosomal-dominant heritable thoracic aortopathy associated with aortic aneurysm/dissection and may also be associated with premature coronary disease, stroke, livedo reticularis and iris flocculi. Dissection can occur at diameters below conventional degenerative thresholds. Management should therefore be individualised by a specialist heritable-aortic team using the causative gene, family history, diameter and growth, while first-degree relatives are offered targeted genetic assessment and serial aortic imaging.","A and E apply inappropriate conventional diameter reassurance despite a pathogenic variant and adverse family history. B provides surveillance to the proband but omits cascade assessment of relatives. C proposes an unsuitable ascending-aortic endovascular strategy and still reduces management to a single diameter.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 571-576 (PDF pp 596-601), including ACTA2 phenotype, lower dissection diameters and family screening; Vascular Surgery Curriculum (2021, v2 July 2023), Vascular Pathology and Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Vascular pathology - congenital and acquired disease; aneurysm - heritable thoracic aortic disease and elective management",uncertainty:"The approved source supports a lower gene- and family-specific threshold but does not justify one unqualified operative diameter for every ACTA2 variant. Specialist and current guideline verification remain necessary."}),
Q(36,"Component separation after modular TEVAR",`A 71-year-old man undergoes surveillance four years after modular TEVAR for a descending thoracic aortic aneurysm. The excluded aneurysm has enlarged from 58 mm to 66 mm.

CTA demonstrates direct contrast entry into the sac through separation of two overlapping thoracic endograft components. The proximal and distal attachment sites remain sealed. There is sufficient graft length on either side of the separation to bridge the defect endovascularly.

What is the most appropriate treatment?`,{A:"Repeat CTA in six months without intervention",B:"Embolise the thoracic intercostal arteries supplying the aneurysm sac",C:"Insert a proximal thoracic extension cuff without crossing the component separation",D:"Proceed directly to open removal of the entire thoracic endograft",E:"Reline the separated components with an additional bridging stent-graft"},"E","Component separation produces a high-pressure type III endoleak and continued sac pressurisation. An additional stent-graft should bridge the separated components with adequate overlap, restoring continuity of the endograft and excluding the aneurysm sac.","A leaves a high-pressure endoleak and an enlarging sac untreated. B is a treatment for selected type II endoleaks and does not repair component separation. C does not bridge the mechanical defect. D is unnecessarily invasive when the defect can be relined endovascularly.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.5, printed p 603 (PDF p 628); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - post-TEVAR surveillance; type III endoleak and endovascular relining",uncertainty:"Open conversion remains an alternative when endovascular relining is not technically possible or fails. Draft pending human review."}),
Q(37,"Endograft sizing in acute type B dissection",`A 70-year-old man requires TEVAR for an acute complicated type B aortic dissection. The non-dissected proximal landing zone measures 31 mm on centreline CTA measurements.

The initial procedural plan specifies a 39 mm thoracic endograft and routine balloon moulding after deployment.

Which modification most appropriately reduces the risk of further aortic-wall injury and retrograde dissection?`,{A:"Use the 39 mm graft and perform routine balloon moulding throughout the landing zone",B:"Select a graft of approximately 34 mm and avoid routine balloon dilatation",C:"Select a graft of approximately 37 mm and balloon only its proximal edge",D:"Increase the graft diameter to approximately 40 mm but omit balloon moulding",E:"Select a graft of approximately 34 mm and perform aggressive balloon moulding throughout its length"},"B","In acute dissection, the aortic wall is fragile. Endograft oversizing should be limited to approximately 10%, and routine balloon dilatation should be avoided to reduce the risk of further wall injury and retrograde type A dissection. A graft of approximately 34 mm provides about 10% oversizing for a 31 mm landing zone.","A, C and D use excessive oversizing for acute dissection. A, C and E also introduce balloon-related wall stress. E uses an appropriate approximate diameter but negates this advantage with aggressive routine ballooning.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 227 (PDF p 276); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, printed pp 59-60 (PDF pp 16-17)",domain:"Aneurysm - thoracic endovascular planning; acute complicated type B dissection",uncertainty:"Final device selection must use the manufacturer's sizing instructions and patient-specific centreline measurements. Draft pending human review."}),
Q(38,"Real case - CTA recognition of an incidental arteria lusoria",`A 47-year-old woman is referred with longstanding neck and left arm pain accompanied by occasional mild paraesthesia. Both arms are warm and well perfused, with normal and symmetrical brachial and radial pulses. There is no blood-pressure differential, digital ischaemia or history of embolic symptoms. She has no focal neurological deficit or history of transient cerebral or retinal ischaemia. She has no dysphagia, dyspnoea, cough or recurrent respiratory infection.\n\nThe CTA cine-loop is shown. The left internal carotid artery does not enhance, but this is a longstanding finding with established collateral cerebral perfusion.\n\nWhich interpretation of the arch anatomy and management plan is most appropriate?`,{A:"Right-sided aortic arch with an aberrant left subclavian artery and no aneurysmal degeneration - conservative management and assessment of the symptoms for a non-vascular cause",B:"Symptomatic aberrant left subclavian artery causing dysphagia lusoria - left carotid-subclavian bypass with ligation of the aberrant artery",C:"Kommerell diverticulum at the aberrant subclavian origin - endovascular exclusion with left subclavian revascularisation",D:"Flow-limiting left subclavian occlusive disease - left carotid-subclavian bypass",E:"Arterial embolisation arising from the chronically occluded left internal carotid artery - therapeutic anticoagulation"},"A","The CTA demonstrates a right-sided aortic arch with an aberrant left subclavian artery: a left-sided arteria lusoria. There is no Kommerell diverticulum, aneurysmal degeneration, subclavian thrombosis or flow-limiting stenosis. In the absence of dysphagia, respiratory compression or upper-limb ischaemia, the anomaly is incidental and can be managed conservatively. The longstanding, well-collateralised left internal carotid non-enhancement is a separate finding and does not explain the arch branch anatomy or make the aberrant subclavian artery symptomatic. The neck and arm symptoms should therefore be assessed independently.","B is contradicted by the absence of dysphagia or another compressive syndrome. C requires a Kommerell diverticulum or aneurysmal origin, which is not present. D is inconsistent with symmetrical pulses, no pressure differential and no flow-limiting subclavian lesion. E is unsupported because there is no acute cerebral, retinal or peripheral embolic syndrome.",{video:"images/thoracic/Arteria Lusoria.m4v",exhibit:"CTA cine-loop through the aortic arch and supra-aortic branch origins.",source:"ESVS/EACTS Consensus Document for the Management of Aortic Arch Pathologies (2019), section 8.2, printed p 188 (merged ESVS guideline PDF p 419): asymptomatic patients with an aberrant subclavian artery can be managed conservatively",domain:"Aneurysm - congenital aortic arch and supra-aortic branch anomalies; recognition and management of an aberrant subclavian artery",uncertainty:"The approved source supports conservative management but does not specify a surveillance interval for this non-aneurysmal asymptomatic variant. The cine-loop was not available in the local mirror and must be visually checked against the stem before final publication."}),
Q(39,"Symptomatic descending thoracic aneurysm with contained leak",`A 76-year-old man has a known 54 mm descending thoracic aortic aneurysm. He develops new, severe and persistent interscapular pain.

CTA demonstrates a small periaortic haematoma consistent with a contained leak. He is haemodynamically stable, has no connective-tissue disorder and has anatomy suitable for standard TEVAR.

What is the most appropriate management?`,{A:"Provide analgesia and repeat CTA in six weeks",B:"Continue annual surveillance because the aneurysm remains below 60 mm",C:"Arrange elective open repair after the symptoms have settled",D:"Undertake urgent TEVAR following immediate specialist assessment",E:"Commence therapeutic anticoagulation and observe his symptoms"},"D","New persistent pain and a contained leak make this a symptomatic, unstable aneurysm regardless of its diameter. A haemodynamically stable patient should undergo early repair, and standard TEVAR is the appropriate urgent strategy for the supplied descending aortic anatomy.","A and B delay treatment of a leaking aneurysm. C inappropriately delays repair and does not use the suitable endovascular anatomy. E does not treat the aneurysm and may worsen haemorrhage.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 586 (PDF p 611); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 214-217 (PDF pp 263-266); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Emergency, printed p 60 (PDF p 17)",domain:"Aneurysm - emergency management of symptomatic and leaking descending thoracic aneurysms",uncertainty:"The precise urgency and repair method depend on haemodynamic status, anatomy and local aortic expertise. Draft pending human review."}),
Q(40,"Descending thoracic aortic aneurysm - TEVAR and spinal cord protection",`A 61-year-old man is referred for an urgent CT thorax because of persistent hoarseness. The scan demonstrates the thoracic aortic aneurysm shown in the exhibit as an incidental finding.\n\nHe has no previous medical or surgical history. Examination demonstrates a full complement of palpable upper- and lower-limb pulses bilaterally.\n\nHe is otherwise asymptomatic and is referred for urgent assessment for thoracic aortic repair.\n\nBased on the imaging, which is the most appropriate treatment strategy?`,{A:"TEVAR with prophylactic cerebrospinal fluid drainage",B:"TEVAR without prophylactic cerebrospinal fluid drainage",C:"Zone 2 TEVAR with left carotid-subclavian bypass",D:"TEVAR with planned coeliac artery coverage",E:"Staged TEVAR followed by fenestrated visceral aortic repair"},"B","The supplied history contains no previous infrarenal aortic repair or other stated major non-anatomical risk factor for spinal cord ischaemia. If the displayed anatomy confirms a focal descending thoracic aneurysm with adequate proximal and distal landing zones, limited planned aortic coverage, no need for LSCA coverage and a distal seal above the coeliac artery, standard TEVAR using a selective rather than routine prophylactic CSF-drainage strategy is the best answer. The Companion text identifies coverage length, previous infrarenal repair and unrevascularised LSCA coverage among the important risk factors, while acknowledging variation between prophylactic and selective CSF-drain practice.","A may be appropriate for extensive coverage or other high-risk anatomy, which is not stated in the stem. C is required only if a durable proximal seal necessitates zone 2 deployment and LSCA revascularisation. D is appropriate only when distal seal requires planned coeliac coverage. E is reserved for disease extending into the visceral aorta without an adequate standard distal landing zone.",{image:"images/thoracic/Q12 TAA TEVAR plan.jpg",exhibit:"CTA of a thoracic aortic aneurysm for assessment of proximal and distal landing zones, planned length of aortic coverage and relationship to the left subclavian and coeliac arteries.",source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 217 (PDF p 266), neurological complications following endovascular thoracic procedures",domain:"Aneurysm - descending thoracic aortic aneurysm; TEVAR planning; spinal cord ischaemia prevention",uncertainty:"The image itself was not available in the local approved source set. Answer B is provisional and is unambiguous only if the image confirms limited descending-thoracic coverage with suitable landing zones and no LSCA or coeliac coverage. Otherwise: Insufficient or conflicting evidence in the approved source set."}),
Q(41,"Distal TEVAR planning adjacent to the coeliac artery",`A 72-year-old man is being considered for TEVAR of a descending thoracic aortic aneurysm. The aneurysm extends close to the coeliac artery, and obtaining an adequate distal seal with a standard endograft would require coverage of the coeliac origin.

The superior mesenteric artery is patent, but CTA does not demonstrate a robust gastroduodenal collateral pathway between the superior mesenteric and coeliac circulations.

Which is the most appropriate endovascular planning principle?`,{A:"Cover the coeliac artery without revascularisation because the superior mesenteric artery is patent",B:"Perform transient balloon occlusion of the coeliac artery and proceed with coverage if no immediate physiological change occurs",C:"Use a scalloped, fenestrated or branched strategy that preserves coeliac perfusion",D:"Embolise the coeliac artery before covering its origin with the thoracic endograft",E:"Extend the thoracic endograft across both the coeliac and superior mesenteric arteries"},"C","Intentional coeliac coverage may cause hepatic or mesenteric ischaemia when coeliac-SMA collateral circulation is inadequate. The repair should therefore preserve coeliac perfusion using a scallop, fenestration or branch rather than relying on the absent collateral pathway.","A assumes that SMA patency alone guarantees adequate collateral perfusion. B relies on a transient balloon-occlusion test that may be misleading. D deliberately removes coeliac inflow without solving the collateral deficit. E sacrifices both principal mesenteric inflow vessels.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.5, printed pp 597-598 (PDF pp 622-623); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - complex thoracic endovascular planning; distal landing zones and visceral perfusion",uncertainty:"The definitive strategy is anatomy- and device-dependent and should be planned by a specialist complex aortic team. Draft pending human review."}),
Q(42,"Radiation-sparing surveillance after TEVAR for BTAI",`A 27-year-old man underwent TEVAR two years ago for a grade III blunt thoracic aortic injury. The repair remains satisfactory, but continued cross-sectional surveillance is required because of his young age and expected duration of follow-up.

His thoracic endograft is compatible with magnetic resonance imaging, and there are no other contraindications.

Which surveillance modality best reduces cumulative exposure to ionising radiation while retaining cross-sectional assessment of the thoracic aorta?`,{A:"Contrast-enhanced CTA",B:"Non-contrast CT",C:"Catheter aortography",D:"Plain chest radiography",E:"Magnetic resonance aortography"},"E","Magnetic resonance aortography provides cross-sectional assessment without ionising radiation. It is therefore an appropriate radiation-sparing surveillance modality for a young patient when the implanted device is compatible and there are no contraindications.","A and B both use ionising radiation. C is invasive and also uses ionising radiation. D may show gross device configuration but does not provide adequate cross-sectional assessment of the aortic wall, lumen and excluded injury.",{source:"Oxford Textbook of Vascular Surgery, Chapter 3.3, printed p 197 (PDF p 222); Vascular Surgery Curriculum (2021, v2 July 2023), Vascular Trauma, printed pp 53-54 (PDF pp 10-11)",domain:"Vascular trauma - blunt thoracic aortic injury; surveillance after endovascular repair",uncertainty:"Surveillance intervals and modality selection should be individualised according to device characteristics, image quality and local protocol. Draft pending human review."}),
Q(43,"Uncomplicated acute TBAD","A stable patient with acute type B dissection has controlled pain/BP, no rupture, no malperfusion and no high-risk imaging feature. What is initial management?",{A:"Best medical therapy and surveillance",B:"Emergency open repair",C:"Thrombolysis",D:"Renal stent",E:"No follow-up"},"A","Uncomplicated disease begins with anti-impulse therapy and structured imaging follow-up.","B-D are not indicated; E is unsafe."),
Q(44,"MYH11-related familial thoracic aortic disease",`A 42-year-old man with no syndromic physical features had a patent ductus arteriosus repaired in childhood. His father and sister have both been treated for thoracic aortic aneurysm or dissection. Genetic testing identifies a pathogenic MYH11 variant. His asymptomatic 18-year-old daughter asks whether she needs assessment.\n\nWhat is the most appropriate approach for his daughter?`,{A:"No assessment unless she develops chest or back pain",B:"Offer targeted genetic testing and lifelong serial aortic imaging if she carries the familial variant or remains clinically at risk",C:"Perform one normal echocardiogram and discharge her permanently",D:"Offer genetic testing alone because imaging is unnecessary before symptoms",E:"Defer all assessment until she reaches the age at which her father presented"},"B","MYH11 variants cause autosomal-dominant familial thoracic aortic aneurysm/dissection and are associated with patent ductus arteriosus. Age of onset and penetrance vary, so first-degree relatives should be offered cascade genetic assessment and appropriate serial aortic imaging rather than waiting for symptoms or the proband's age of presentation.","A waits for a potentially catastrophic presentation. C treats one normal study as lifelong exclusion of a variably penetrant disorder. D omits phenotypic imaging surveillance. E ignores the recommendation that screening begins before the earliest familial presentation and should not depend solely on the proband's age.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 573-576 (PDF pp 598-601), and Chapter 8.2, printed pp 579-580 (PDF pp 604-605): MYH11 association with PDA and lifelong first-degree-relative screening; Vascular Surgery Curriculum (2021, v2 July 2023), Vascular Pathology and Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Vascular pathology - congenital and acquired disease; aneurysm - familial thoracic aortic disease, genetic counselling and surveillance",uncertainty:"The precise modality and interval of surveillance should be individualised according to genotype, age, baseline anatomy and specialist advice. Draft pending current guideline and human review."}),
Q(45,"Zone 2 TEVAR in a patient with a LIMA graft","A patient needs zone 2 TEVAR and has a patent LIMA-to-LAD graft. What is essential before covering the LSCA?",{A:"Preserve/revascularise LSCA inflow",B:"Occlude the LIMA",C:"Renal stenting",D:"No coronary assessment",E:"Stop antiplatelet therapy permanently"},"A","LSCA coverage can jeopardise a LIMA coronary graft; inflow must be protected.","B risks myocardial ischaemia; C-E do not solve the problem."),
Q(46,"Loeys-Dietz syndrome - surveillance and intervention principle",`A 28-year-old woman has hypertelorism, a bifid uvula and marked arterial tortuosity but no ectopia lentis. Genetic testing identifies a pathogenic TGFBR2 variant. Her aortic root measures 44 mm.\n\nWhat is the most appropriate management principle?`,{A:"Apply a routine 55 mm degenerative threshold and image only the aortic root",B:"Repeat root echocardiography in five years because she is asymptomatic",C:"Arrange early expert assessment for prophylactic root surgery using a lower gene-specific threshold, with lifelong surveillance of the whole aorta",D:"Undertake descending TEVAR despite the absence of descending aortic pathology",E:"Reassure her that the absence of ectopia lentis excludes a clinically important aortopathy"},"C","The craniofacial features, arterial tortuosity and pathogenic TGFBR2 variant are characteristic of Loeys-Dietz syndrome. Dissection can occur at a young age and at smaller aortic diameters than in degenerative disease. She therefore requires early assessment in an expert heritable-aortic service for prophylactic root intervention using a gene- and patient-specific threshold, together with lifelong imaging surveillance beyond the root.","A applies an unsafe degenerative threshold and restricts imaging to one segment. B provides inadequate surveillance for an aggressive heritable aortopathy. D treats a normal aortic segment and does not address the root. E confuses Loeys-Dietz syndrome with Marfan syndrome; ectopia lentis is not required for this diagnosis.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 573-576 (PDF pp 598-601): Loeys-Dietz phenotype, dissection at smaller diameters, early surgical assessment and lifelong whole-aorta surveillance; Vascular Surgery Curriculum (2021, v2 July 2023), Vascular Pathology and Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Vascular pathology - congenital and acquired disease; aneurysm - syndromic heritable thoracic aortopathy and elective management",uncertainty:"The exact operative threshold in Loeys-Dietz syndrome depends on the causal variant, family history, growth and contemporary specialist guidance. This item deliberately tests the management principle rather than a universal number."}),
Q(47,"Stable type II endoleak after TEVAR",`An asymptomatic 74-year-old woman undergoes surveillance 18 months after TEVAR for a descending thoracic aortic aneurysm.

CTA demonstrates a small focus of delayed retrograde filling of the excluded sac from an intercostal artery. The aneurysm sac has remained unchanged at 62 mm on three consecutive examinations. There is no leak at either attachment site and no separation of the endograft components.

What is the most appropriate management?`,{A:"Continue imaging surveillance without immediate intervention",B:"Insert a proximal thoracic extension cuff",C:"Embolise the intercostal feeder immediately",D:"Completely reline the thoracic endograft",E:"Convert to open descending thoracic aortic repair"},"A","This is a type II endoleak without aneurysm-sac expansion. Conservative management with continued imaging surveillance is appropriate because there is no evidence that the sac remains under progressively harmful pressure or that immediate intervention is required.","B treats proximal seal failure, which is absent. C is generally reserved for a persistent type II endoleak associated with sac enlargement. D treats component or fabric failure, neither of which is present. E is disproportionate without sac expansion or failure of less invasive management.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.5, printed p 603 (PDF p 628); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - post-TEVAR surveillance; type II endoleak management",uncertainty:"Intervention thresholds and surveillance intervals vary between specialist centres. Draft pending human review."}),
Q(48,"High-risk IMH with ulcer-like projection","A patient with descending aortic IMH develops recurrent pain and an enlarging ulcer-like projection. What is the best management?",{A:"Discharge",B:"TEVAR if anatomically suitable",C:"Anticoagulation",D:"No repeat imaging",E:"Infrarenal EVAR"},"B","Recurrent symptoms and progressive focal disruption are high-risk features favouring intervention.","A and D delay; C may worsen bleeding; E treats the wrong segment."),
Q(49,"Access-vessel rupture during TEVAR","During large-bore sheath withdrawal, angiography shows external iliac rupture with hypotension. What is the immediate endovascular action?",{A:"Balloon tamponade followed by covered-stent control",B:"Observe",C:"Thrombolysis",D:"Remove all access and wait",E:"Carotid-subclavian bypass"},"A","Immediate balloon control limits haemorrhage while definitive covered-stent or open repair is performed.","B and D permit exsanguination; C worsens bleeding; E is unrelated."),
Q(50,"Upper GI bleeding after TEVAR","A patient with previous TEVAR presents with haematemesis, sepsis and CT changes suspicious for aorto-oesophageal fistula. What is the best next step?",{A:"Routine outpatient endoscopy",B:"Urgent aortic/upper-GI MDT management as a suspected fistula",C:"Anticoagulation",D:"Discharge on a proton-pump inhibitor",E:"Colonoscopy"},"B","Aorto-oesophageal fistula is a catastrophic vascular infection/bleeding emergency requiring resuscitation and urgent specialist source-control planning.","A may be hazardous if pursued routinely before vascular planning; C worsens bleeding; D and E delay care.",{uncertainty:"The diagnostic sequence, including endoscopy, is context-dependent; this item deliberately tests recognition and urgent escalation rather than a single invasive test."})
];

let mode="study",marked=false;
const root=document.getElementById("questions"),scoreBox=document.getElementById("scoreBox"),modeNote=document.getElementById("modeNote");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){root.innerHTML=QUESTIONS.map((q,i)=>`<article class="question-card" id="${q.id}"><div class="q-head"><div class="q-num">Question ${i+1}</div><div class="q-id">${q.id}</div></div>${q.video?`<div class="exhibit-image"><video controls loop muted playsinline preload="metadata"><source src="${esc(q.video)}" type="video/mp4">Your browser does not support embedded video.</video></div>`:q.image?`<div class="exhibit-image"><img src="${esc(q.image)}" alt="Question ${i+1} imaging"></div>`:""}${q.exhibit?`<div class="exhibit"><strong>Exhibit</strong><br>${esc(q.exhibit)}</div>`:""}<div class="stem">${esc(q.stem)}</div><div class="options">${Object.entries(q.options).map(([k,v])=>`<label class="option" data-letter="${k}"><input type="radio" name="${q.id}" value="${k}"><span><span class="letter">${k}.</span> ${esc(v)}</span></label>`).join("")}</div><div class="feedback" id="fb-${q.id}"><div class="result"></div><h4>Explanation</h4><div>${esc(q.explanation)}</div><div class="why-not"><strong>Why the alternatives are less appropriate:</strong> ${esc(q.why_not)}</div><div class="metadata"><strong>Supporting source:</strong> ${esc(q.source)}<br><strong>Curriculum domain:</strong> ${esc(q.curriculum_domain)}<br><strong>Uncertainty/editorial status:</strong> ${esc(q.uncertainty)}</div></div></article>`).join("");bind();updateScore()}
function bind(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.addEventListener("change",()=>{if(mode==="study")reveal(x.name);updateScore()}))}
function reveal(id,force=false){const q=QUESTIONS.find(x=>x.id===id),picked=document.querySelector(`input[name="${id}"]:checked`),fb=document.getElementById(`fb-${id}`);if(!picked&&!force)return;document.querySelectorAll(`input[name="${id}"]`).forEach(x=>{const l=x.closest("label");l.classList.toggle("correct",x.value===q.answer);l.classList.toggle("incorrect",picked&&x.checked&&x.value!==q.answer)});const r=fb.querySelector(".result");if(picked){const ok=picked.value===q.answer;r.textContent=ok?`Correct - ${q.answer}`:`Incorrect - correct answer: ${q.answer}`;r.className=`result ${ok?"good":"bad"}`}else{r.textContent=`Correct answer: ${q.answer}`;r.className="result"}fb.classList.add("show")}
function updateScore(){let done=0,correct=0;QUESTIONS.forEach(q=>{const x=document.querySelector(`input[name="${q.id}"]:checked`);if(x){done++;if(x.value===q.answer)correct++}});scoreBox.textContent=`Score: ${correct} / ${done}`}
function setMode(m){mode=m;marked=false;document.getElementById("studyBtn").classList.toggle("active",m==="study");document.getElementById("examBtn").classList.toggle("active",m==="exam");modeNote.textContent=m==="study"?"Study mode: explanations appear after you select an answer.":"Exam mode: answers remain hidden until you mark the exam.";document.querySelectorAll(".feedback").forEach(x=>x.classList.remove("show"));document.querySelectorAll("label.option").forEach(x=>x.classList.remove("correct","incorrect"));if(m==="study")document.querySelectorAll('input[type="radio"]:checked').forEach(x=>reveal(x.name))}
document.getElementById("studyBtn").onclick=()=>setMode("study");document.getElementById("examBtn").onclick=()=>setMode("exam");document.getElementById("markBtn").onclick=()=>{marked=true;QUESTIONS.forEach(q=>reveal(q.id));updateScore()};document.getElementById("showBtn").onclick=()=>QUESTIONS.forEach(q=>reveal(q.id,true));document.getElementById("resetBtn").onclick=()=>{document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll(".feedback").forEach(x=>x.classList.remove("show"));document.querySelectorAll("label.option").forEach(x=>x.classList.remove("correct","incorrect"));updateScore();scrollTo({top:0,behavior:"smooth"})};
render();
</script>
</body>
</html>
