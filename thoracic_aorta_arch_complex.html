<script>
const S_COMP="Full Vascular: A Companion to Specialist Surgical Practice (2024), Ch 14, pp 224-227 (PDF pp 273-276)";
const S_CURR="Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, document pp 59-60 (PDF pp 16-17)";
const D="Draft pending full source verification and human review.";
const Q=(id,title,stem,options,answer,explanation,why_not,extra={})=>({id:`THO-${String(id).padStart(3,"0")}`,number:id,internal_title:title,stem,options,answer,explanation,why_not,source:extra.source||"Approved source set - exact section/page verification pending",curriculum_domain:extra.domain||"Aneurysm - thoracic aortic disease and endovascular management",uncertainty:extra.uncertainty||D,...extra});
const QUESTIONS=[
Q(1,"Real case 1 - acute TBAD, LSCA occlusion and zone 2 strategy",`A 59-year-old man who smokes, with hypertension and hypercholesterolaemia, presents with a 2-day history of severe left-sided chest and interscapular back pain radiating down his left arm. ACS investigations are negative. BP is 181/99 mmHg, pulse 92/min, respiratory rate 22/min, SpO2 96% on air and temperature 36.2 C.\n\nThe left brachial and radial pulses are absent. The hand remains warm and reasonably perfused, with mild paraesthesia but no motor deficit. CTA shows an acute type B aortic dissection extending immediately proximal to the left subclavian artery (LSCA), with LSCA occlusion by the dissection. An adequate proximal TEVAR seal requires coverage of the LSCA origin.\n\nWhat is the most appropriate management strategy?`,{A:"Continue anti-impulse therapy and repeat CTA in 24 hours",B:"Left carotid-subclavian bypass alone",C:"Emergency zone 2 TEVAR without LSCA revascularisation",D:"Left carotid-subclavian bypass followed by emergency zone 2 TEVAR",E:"Open descending thoracic aortic replacement"},"D","Upper-limb malperfusion makes this a complicated acute type B dissection. Proximal entry coverage is required, and the planned zone 2 repair will cover an already compromised LSCA; in this real-case anatomy, carotid-subclavian bypass preserves left-arm and collateral perfusion before emergency TEVAR.","A does not treat malperfusion. B treats the branch consequence but not the dissection. C sacrifices LSCA inflow without revascularisation. E carries greater acute morbidity when endovascular anatomy is suitable.",{video:"images/thoracic/Q20 cTBAD.m4v",exhibit:"Initial CTA: acute type B dissection extends immediately proximal to the LSCA; the LSCA is occluded by the dissection and must be covered to obtain a proximal seal.",source:`${S_COMP}; ${S_CURR}`,domain:"Acute aortic syndrome; complicated type B dissection; acute upper-limb ischaemia; thoracic endovascular planning",uncertainty:"The need and timing of LSCA revascularisation are anatomy- and urgency-dependent; this answer reflects the supplied real case and requires final expert review."}),
Q(2,"Real case 2 - persistent static renal malperfusion after TEVAR",`A 59-year-old man undergoes left carotid-subclavian bypass and emergency zone 2 TEVAR for acute complicated type B dissection. Completion angiography after stent-graft deployment and ballooning shows improved aortic true-lumen expansion, but poor left renal perfusion persists. Selective angiography demonstrates a fixed dissection flap extending into the left renal artery, consistent with static branch-vessel obstruction.\n\nWhat is the most appropriate next intervention?`,{A:"Observation after successful proximal TEVAR",B:"Further balloon dilatation of the thoracic stent-graft",C:"Direct stenting of the left renal artery",D:"Distal bare-metal aortic dissection stenting alone",E:"Open left renal artery bypass"},"C","Persistent static branch-vessel obstruction is not reliably corrected by proximal entry coverage alone. Direct stenting of the malperfused renal artery is required. In the actual case, a covered left renal artery stent restored renal perfusion.","A leaves ongoing renal malperfusion untreated. B does not correct a fixed renal-artery flap and may add aortic injury. D addresses aortic true-lumen support rather than the fixed branch lesion. E is more invasive when endovascular branch rescue is feasible.",{video:"images/thoracic/Q20 Persistent left renal malperfusion.m4v",exhibit:"Completion angiography after TEVAR and ballooning: persistent static dissection of the left renal artery with impaired renal perfusion.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, section 3.1.1.2.2, printed p 16 (merged PDF p 1211): static obstruction or ostial disruption should be treated by stenting the malperfused branch vessel; Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 225 and 227 (PDF pp 274 and 276)",domain:"Acute aortic syndrome; malperfusion; adjunctive visceral intervention",uncertainty:"The approved sources support direct renal branch stenting but do not specify covered rather than bare stent selection. The covered stent is retained only as a factual detail of the supplied real case."}),
Q(3,"Real case 3 - distal failure and persistent false-lumen pressurisation",`Six months after emergency TEVAR for acute type B dissection, surveillance CTA shows a satisfactory proximal seal but distal contrast entry with persistent false-lumen pressurisation (type Ib distal failure). The false lumen markedly compresses the thoracic endograft and aortic true lumen. The coeliac artery, SMA and both renal arteries arise from the compressed true lumen, and the dissection extends into both iliac arteries.\n\nWhat is the most appropriate treatment principle?`,{A:"Proximal relining of the thoracic endograft",B:"Embolisation of intercostal branch vessels",C:"Standard TEVAR extension across the visceral segment without branch preservation",D:"Endovascular exclusion of distal false-lumen inflow while preserving visceral perfusion",E:"Continue surveillance because the proximal seal is satisfactory"},"D","Treatment must address the mechanism: ongoing distal false-lumen inflow and pressurisation are compressing the true lumen and endograft. The repair should exclude or occlude that inflow while maintaining all visceral branches arising from the true lumen. A false-lumen occlusion device (a candy plug in the actual case) is one possible technique; the examinable point is the principle.","A does not address distal inflow. B targets collateral branches rather than the distal failure described. C threatens all visceral vessels. E accepts ongoing pressurisation and severe compression.",{video:"images/thoracic/Q20 T1bEL 1.m4v",exhibit:"Six-month CTA: distal false-lumen filling/type Ib failure, compressed thoracic endograft and true lumen, visceral branches from the true lumen, and dissection into both iliacs.",source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 224-225 (PDF pp 273-274), false-lumen pressurisation and true-lumen compression; ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, Recommendation 79, printed p 40 (merged PDF p 1235): type I endoleak requires prompt intervention; Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Post-TEVAR surveillance; endoleak/distal failure; chronic dissection reintervention",uncertainty:"The approved sources support prompt correction of the distal seal failure but do not prescribe one device for this anatomy. The answer tests the treatment principle; the candy-plug technique remains a case-specific detail."}),
Q(4,"Incidental low-risk penetrating aortic ulcer","A 79-year-old man has an incidental shallow descending thoracic ulcer on CTA. He has no pain, intramural haematoma, pleural effusion or periaortic change; the aorta is 34 mm and the crater is 3 mm deep. What is the most appropriate next step?",{A:"TEVAR this admission",B:"Best medical therapy with serial cross-sectional imaging surveillance",C:"Emergency open repair",D:"Therapeutic anticoagulation",E:"No aortic follow-up"},"B","An asymptomatic uncomplicated penetrating aortic ulcer should be managed medically with serial imaging surveillance rather than urgent repair.","A and C overtreat an uncomplicated lesion. D is not treatment for a penetrating aortic ulcer. E omits the required surveillance.",{image:"images/thoracic/Small PAU.jpg",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, Recommendations 20-22, printed p 18 (merged PDF p 1213); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 228 (PDF p 277)",domain:"Aneurysm - Elective; penetrating aortic ulcer; medical treatment and surveillance",uncertainty:"The approved sources support serial surveillance but do not prescribe one universal imaging interval. The supplied image must still be checked against the low-risk morphology described in the stem."}),
Q(5,"Visceral protection during open extent II TAAA repair",`A fit 63-year-old man undergoes open repair of a 68 mm Crawford extent II thoracoabdominal aortic aneurysm. Partial left-heart bypass has been established with return through the femoral artery.

The proximal graft anastomosis has been completed. The distal clamp is moved below the renal arteries, and the coeliac, superior mesenteric and renal artery ostia are exposed while the visceral reconstruction is performed.

Which perfusion strategy most directly limits renal and mesenteric ischaemia during this phase?`,{A:"Continue retrograde distal aortic perfusion without selectively cannulating the visceral arteries",B:"Selectively perfuse the coeliac, superior mesenteric and renal arteries using balloon catheters connected to the bypass circuit",C:"Perfuse both renal arteries with cold crystalloid while leaving the coeliac and superior mesenteric arteries unperfused",D:"Release the proximal thoracic clamp intermittently to perfuse the visceral arteries",E:"Discontinue left-heart bypass and institute profound hypothermic circulatory arrest"},"B","Once the visceral artery ostia are exposed and excluded from effective distal aortic perfusion, selective catheter perfusion from the left-heart bypass circuit provides continuous oxygenated blood to the coeliac, superior mesenteric and renal arteries while their reconstruction is completed. This directly limits renal and mesenteric ischaemia.","A does not reliably perfuse the exposed visceral ostia during this phase. C protects the kidneys but leaves the mesenteric circulation ischaemic. D produces uncontrolled, intermittent perfusion and disrupts the reconstruction. E adds the morbidity of profound hypothermic circulatory arrest when selective perfusion is available.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 220 (PDF p 269); Postgraduate Vascular Surgery, 2e, Chapter 9, printed p 215 (PDF p 233)",domain:"Aneurysm - open thoracoabdominal aortic aneurysm repair; renal and visceral organ protection",uncertainty:"The precise bypass circuit and perfusion protocol vary between specialist aortic centres. The question tests the supported principle of selective visceral and renal perfusion during open extent II repair."}),
Q(6,"Extent II TAAA - staged endovascular strategy",`A 68-year-old man is being considered for elective repair of a 68 mm extent II thoracoabdominal aortic aneurysm extending from immediately distal to the left subclavian artery to the aortic bifurcation.

He is functionally independent and has no symptoms attributable to the aneurysm. CTA demonstrates patent coeliac, superior mesenteric, renal and internal iliac arteries. The anatomy is suitable for a total endovascular repair.

Which operative strategy most directly reduces the risk associated with extensive aortic coverage while still permitting complete aneurysm exclusion?`,{A:"Single-session branched endovascular repair with complete thoracoabdominal coverage",B:"Staged endovascular repair with proximal TEVAR followed by delayed fenestrated or branched completion",C:"Open extent II repair using routine left-heart bypass",D:"Hybrid visceral debranching followed immediately by complete thoracic endograft coverage",E:"Proximal TEVAR alone, leaving the visceral segment untreated"},"B","Staging the repair limits the extent of aorta covered in one procedure and permits collateral adaptation, reducing the spinal-cord burden of extensive thoracoabdominal exclusion.","A and D produce extensive coverage in one session. C is a different definitive strategy rather than the staged endovascular approach asked about. E leaves a substantial aneurysmal segment untreated.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 221 (PDF p 270)",domain:"Aneurysm - elective extent II thoracoabdominal aneurysm; complex endovascular planning; spinal-cord protection",uncertainty:"The timing and components of staged repair vary between specialist centres. Draft pending human review."}),
Q(7,"Heritable aortopathy before pregnancy",`A 31-year-old woman with a pathogenic FBN1 variant is planning her first pregnancy. Her aortic root measures 44 mm on reproducible echocardiographic assessment. Left ventricular function is normal and there is mild aortic regurgitation.

Her sister sustained an acute aortic dissection during pregnancy.

What is the most appropriate next step?`,{A:"Proceed with conception and arrange annual echocardiography",B:"Commence an angiotensin-receptor blocker and continue it throughout pregnancy",C:"Advise that pregnancy is permanently contraindicated without further assessment",D:"Defer conception and refer her for specialist heritable-aortic, cardiac-surgical and high-risk obstetric assessment",E:"Arrange elective thoracic endovascular repair of the aortic root"},"D","Heritable aortopathy, a 44 mm root, planned pregnancy and a family history of pregnancy-associated dissection require specialist pre-pregnancy assessment. Prophylactic root surgery should be considered within that assessment rather than applying a degenerative threshold.","A underestimates her pregnancy-associated risk. B is inappropriate during pregnancy. C pre-empts individualised specialist assessment. E does not provide a suitable repair of the aortic root.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 574-575 and 580 (PDF pp 599-600 and 605)",domain:"Vascular Pathology and Aneurysm - Elective; heritable aortopathy, pregnancy counselling and prophylactic aortic-root surgery",uncertainty:"The approved source directly supports specialist pre-pregnancy assessment, but it predates contemporary gene-specific guidance. The exact operative threshold remains gene-, diameter-, growth- and family-history-dependent and requires confirmation against a newer approved HTAD/pregnancy guideline when one is added."}),
Q(8,"Acute aortic syndrome - image interpretation",`A 71-year-old woman presents with sudden central chest pain radiating between her shoulder blades. Her blood pressure is 105/60 mmHg following analgesia.

She is transferred with a provisional diagnosis of acute type B aortic dissection for consideration of TEVAR.

The CTA is shown.

What is the most appropriate management?`,{A:"Emergency zone 3 TEVAR",B:"Intravenous heparin and repeat CTA after 24 hours",C:"Emergency open ascending aortic repair",D:"Left carotid-subclavian bypass",E:"Anti-impulse therapy and outpatient surveillance"},"C","The CTA demonstrates ascending aortic involvement, making this a type A acute aortic syndrome rather than an isolated type B dissection. Emergency open ascending aortic repair is required.","A treats the descending component but leaves the ascending aortic emergency untreated. B risks worsening bleeding and delays repair. D does not treat the ascending pathology. E is inappropriate for a type A acute aortic syndrome.",{image:"images/thoracic/9F1497E9-538A-484A-A206-5C8CA74F6113.jpeg",source:"Oxford Textbook of Vascular Surgery, Chapter 8.6, printed p 611 (PDF p 636): acute type A dissection should undergo surgical repair as early as possible",domain:"Aneurysm - Emergency; acute aortic syndrome; interpretation of thoracic CTA and ascending aortic involvement",uncertainty:"The management principle is directly supported, but the answer requires the supplied image to demonstrate ascending aortic involvement. The image must be visually checked before final publication."}),
Q(9,"Symptomatic penetrating aortic ulcer",`A 78-year-old man presents with acute interscapular pain. CTA demonstrates a penetrating atherosclerotic ulcer in the mid-descending thoracic aorta without free rupture.

Intravenous anti-impulse therapy is commenced. Despite adequate reduction of his heart rate and blood pressure, he continues to experience severe pain. Repeat CTA 24 hours later demonstrates an increasing left pleural effusion adjacent to the ulcer. The anatomy is suitable for endovascular repair.

What is the most appropriate management?`,{A:"Discharge with oral antihypertensive treatment and repeat CTA in six weeks",B:"Continue inpatient medical treatment until the pain resolves",C:"Undertake urgent TEVAR during this admission",D:"Undertake urgent open replacement of the descending thoracic aorta",E:"Perform endovascular coeliac artery embolisation"},"C","Persistent pain and an increasing adjacent pleural effusion indicate an unstable penetrating aortic ulcer. When the anatomy is suitable, urgent TEVAR is the preferred repair.","A and B delay treatment of progressive symptomatic disease. D is more invasive when suitable endovascular anatomy is available. E does not treat the ulcer.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 228 (PDF p 277); Oxford Textbook of Vascular Surgery, Chapter 8.7, printed p 616 (PDF p 641)",domain:"Acute aortic syndrome - symptomatic penetrating aortic ulcer; emergency thoracic endovascular repair",uncertainty:"The precise timing of repair depends on stability and anatomy. Draft pending human review."}),
Q(10,"Blunt thoracic aortic injury with competing haemorrhage",`A 32-year-old man is admitted after a high-speed road traffic collision. He remains hypotensive despite blood-product resuscitation. CTA demonstrates a grade III blunt thoracic aortic injury with a contained isthmus pseudoaneurysm and no active aortic extravasation.

There is also a large haemoperitoneum with active splenic arterial bleeding. The trauma team considers the abdominal haemorrhage to be the immediate source of his instability.

What is the most appropriate management sequence?`,{A:"Perform TEVAR before treating the abdominal haemorrhage",B:"Control the active abdominal haemorrhage first, then undertake TEVAR after physiological stabilisation",C:"Perform immediate open isthmus repair followed by damage-control laparotomy",D:"Manage both injuries non-operatively and repeat CTA after 24 hours",E:"Perform damage-control laparotomy but manage the aortic pseudoaneurysm with outpatient surveillance alone"},"B","The contained grade III aortic injury requires definitive repair, preferably by TEVAR, but it is not the source of the current haemodynamic instability. The immediately life-threatening splenic haemorrhage should be controlled first. Anti-impulse therapy and close monitoring are used as physiology permits, followed by TEVAR once the patient has been resuscitated and stabilised.","A delays control of the active source of shock. C exposes an unstable polytrauma patient to open thoracic repair and still delays abdominal haemorrhage control. D leaves active haemorrhage and a grade III aortic injury untreated. E correctly prioritises abdominal haemorrhage but omits the planned definitive treatment required for the pseudoaneurysm.",{source:"Oxford Textbook of Vascular Surgery, Chapter 3.3, printed pp 195-199 (PDF pp 220-224); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 228 (PDF p 277)",domain:"Vascular trauma - blunt thoracic aortic injury; prioritisation and sequencing in polytrauma",uncertainty:"The exact timing of TEVAR after haemorrhage control depends on physiological recovery and associated injuries. The supported principle is to control the immediate source of instability before scheduled repair of a contained grade III injury."}),
Q(11,"Large-bore access planning for TEVAR",`A 72-year-old woman is being assessed for TEVAR of a 66 mm descending thoracic aortic aneurysm. The proximal and distal landing zones are suitable.

CTA demonstrates heavily calcified external iliac arteries measuring 4.5 mm on the right and 4.8 mm on the left. Both are smaller than the minimum diameter required for the delivery system. The right common iliac artery is of adequate calibre and can be approached retroperitoneally.

What is the most appropriate access strategy?`,{A:"Force the delivery sheath through the right external iliac artery after serial dilatation",B:"Construct a right iliac conduit for introduction of the delivery system",C:"Introduce the thoracic endograft through the brachial artery",D:"Introduce the thoracic endograft through the common carotid artery",E:"Abandon repair and continue aneurysm surveillance"},"B","A surgically constructed iliac conduit provides controlled large-bore access when neither external iliac artery can safely accept the delivery system and an accessible common iliac artery is suitable.","A risks iliac rupture. Brachial and carotid arteries are not appropriate routine access vessels for delivery of the main thoracic device. E leaves a repairable 66 mm aneurysm untreated.",{image:"images/thoracic/IMG_3554C82B-964A-4DE7-A037-B87424A5796C.jpeg",source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 216 and 229 (PDF pp 265 and 278); ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, printed p 25 (merged PDF p 1220)",domain:"Aneurysm - thoracic endovascular planning; hostile iliofemoral access; surgical iliac conduit",uncertainty:"Alternative access strategies depend on anatomy and device profile. The stem establishes a suitable common iliac artery for a surgical conduit. Draft pending human review."}),
Q(12,"Arch aneurysm - redo sternotomy risk versus endovascular arch strategy",`A 78-year-old man has a symptomatic arch aneurysm extending into the proximal descending thoracic aorta. CTA measurements are shown in the exhibit. He is independent, but has had previous CABG with anterior grafts close to the sternum and patchy calcification of the distal ascending aorta.\n\nWhat is the most appropriate repair strategy?`,{A:"Frozen elephant trunk",B:"Standard zone 3 TEVAR",C:"Zone 1 branched TEVAR with carotid-carotid bypass",D:"Left carotid-subclavian bypass alone",E:"Surveillance imaging in 12 months"},"C","The aneurysm is symptomatic and requires treatment if feasible. Zone 3 and zone 2 seal are inadequate, while zone 1 seal is adequate. Prior CABG with anterior grafts and calcified distal ascending aorta make open arch/FET less attractive, without making him unfit for general anaesthesia. A zone 1 branched TEVAR strategy with carotid-carotid bypass is therefore the best option offered. A carotid-carotid bypass can be tunnelled anteriorly, where it is relatively exposed and potentially vulnerable to trauma or infection, or retro-oesophageally, where it may produce dysphagia-lusoria-type symptoms. These issues should be considered when planning zone 1 arch strategies.","A may be appropriate in a different patient, but redo sternotomy and ascending aortic features make it less attractive here. B does not provide a proximal seal. D does not treat the arch aneurysm. E is inappropriate for a symptomatic arch aneurysm.",{video:"images/thoracic/Q12archaneurysm.m4v",image:"images/thoracic/F591305C-CC2A-48E0-A853-B6457D6BF11F.png",exhibit:"Arch CTA with centreline measurements: arch aneurysm involving the distal arch and proximal descending thoracic aorta; LSA origin involved; zone 3 landing inadequate; zone 2 landing 7 mm; zone 1 landing 31 mm; ascending aorta diameter 34 mm; distal landing beyond the aneurysm and iliofemoral access are suitable.",source:"ESVS/EACTS Consensus Document for the Management of Aortic Arch Pathologies (2019), sections 6.3-6.4 and Recommendations 24-28, printed pp 183-185 (merged PDF pp 414-416), and treatment-selection factors, printed p 187 (merged PDF p 418); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 216 (PDF p 265)",domain:"Aneurysm - Elective; aortic arch aneurysm; supra-aortic debranching and endovascular arch repair",uncertainty:"The sources support zones 1-2 TEVAR in suitable anatomy, arch-vessel revascularisation and selection of endovascular repair when redo CABG increases sternotomy risk. The exact branched configuration remains dependent on verification of the supplied CTA and device-specific planning."}),
Q(13,"Measurement of a tortuous descending thoracic aortic aneurysm",`A 74-year-old man undergoes CTA surveillance of an asymptomatic descending thoracic aortic aneurysm. The reporting workstation shows a maximum diameter of 61 mm on a conventional axial image. The aorta is markedly tortuous, and the axial measurement crosses it obliquely.

Multiplanar centreline reconstruction gives a maximum diameter of 55 mm when measured perpendicular to the direction of aortic flow.

Which measurement method should be used as the reference maximum aortic diameter for management planning?`,{A:"The largest diameter visible on any conventional axial image",B:"The maximum diameter measured perpendicular to the centreline of flow",C:"The maximum diameter of the contrast-opacified lumen alone",D:"The anteroposterior diameter measured on a sagittal reconstruction",E:"The diameter of the nearest normal proximal landing zone"},"B","Thoracic aortic diameters should be measured on multiplanar reconstructions perpendicular to the centreline of flow. An oblique axial image can overestimate the true diameter in a tortuous aorta and should not determine whether an intervention threshold has been reached.","A accepts the known obliquity and resulting overmeasurement. C excludes mural thrombus and the aneurysm wall. D remains dependent on the orientation of the aorta rather than its flow axis. E is required for device planning but is not a substitute for the maximum aneurysm diameter.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 214 and 216 (PDF pp 263 and 265); Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 586 (PDF p 611)",domain:"Aneurysm - thoracic aortic imaging; centreline measurement and endovascular planning",uncertainty:"The item tests measurement technique rather than a universal intervention threshold. Treatment still depends on symptoms, pathology, growth, physiological fitness and contemporary specialist guidance."}),
Q(14,"Active Takayasu arteritis with arch-branch stenosis",`A 26-year-old woman reports progressive left-arm fatigue when working above shoulder height. Examination demonstrates a reduced left radial pulse and a systolic blood-pressure difference of 35 mmHg between her arms. The hand remains warm and neurologically intact.

CTA demonstrates long, smooth stenoses affecting the left subclavian and left common carotid arteries. Inflammatory markers are elevated, and FDG-PET demonstrates metabolically active arterial inflammation.

What is the most appropriate initial management?`,{A:"Commence specialist-led immunosuppressive treatment and defer elective revascularisation until the disease is controlled",B:"Perform immediate left subclavian artery stenting before commencing immunosuppression",C:"Perform immediate carotid-subclavian bypass before commencing immunosuppression",D:"Prescribe dual-antiplatelet therapy as the sole treatment",E:"Commence systemic anticoagulation and arrange catheter-directed thrombolysis"},"A","This is active Takayasu arteritis without threatened limb or cerebral perfusion. Initial treatment should control arterial inflammation; elective revascularisation is more durable when performed during remission.","B and C intervene during active inflammation without an urgent perfusion indication. D does not treat the active disease. E treats acute thrombosis rather than inflammatory stenosis.",{image:"images/thoracic/IMG_C42C2939-2B78-4219-94DF-DAB3FB7BFF4C.jpeg",source:"Postgraduate Vascular Surgery, 2nd edition, Chapter 26, printed pp 505-506 (PDF pp 523-524)",domain:"Vasospastic disorders and vasculitis - Takayasu arteritis; timing of revascularisation",uncertainty:"Urgent revascularisation may be necessary when active disease causes threatened end-organ perfusion; that circumstance is excluded here. Draft pending human review."}),
Q(15,"Haemoptysis after TEVAR",`A 69-year-old man presents with haemoptysis eight years after TEVAR for a descending thoracic aortic aneurysm. He had a smaller self-limiting bleed 48 hours earlier and has now coughed up approximately 150 mL of fresh blood.

Following initial resuscitation:

Heart rate: 112 beats/min
Blood pressure: 96/58 mmHg
Respiratory rate: 24/min
SpO2: 94% on 15 L oxygen
Temperature: 38.4 C
Haemoglobin: 96 g/L
Lactate: 2.8 mmol/L

The CTA is shown.

Based on the clinical presentation and CTA findings, what is the most appropriate immediate management?`,{A:"Intravenous antibiotics",B:"Bronchoscopy",C:"Emergency TEVAR",D:"Emergency open graft explantation",E:"PET-CT"},"C","The presentation and CTA are consistent with an aortobronchial fistula. Emergency TEVAR provides rapid haemorrhage control; infection and definitive source control must be addressed after stabilisation.","A is necessary but does not control haemorrhage. B may precipitate bleeding and does not secure the aorta. D is not the preferred first manoeuvre in an unstable bleeding patient when endovascular control is feasible. E delays treatment.",{video:"images/thoracic/Q15_aortobronchialfistula_video.m4v",source:"ESVS 2020 Clinical Practice Guidelines on Vascular Graft and Endograft Infection, section 6.4 and Recommendation 34, printed p 362 (merged PDF p 453): an aortic endograft should be considered for emergency control of active bleeding from an aortobronchial or aortopulmonary fistula",domain:"Aneurysm - Emergency; aortobronchial fistula and haemorrhage control after thoracic aortic repair",uncertainty:"The evidence supports emergency TEVAR as haemorrhage control rather than definitive eradication of infection. The supplied CTA must demonstrate the proposed fistula, and subsequent source-control management depends on anatomy and physiological fitness."}),
Q(16,"Retrograde type A dissection after TEVAR",`A 65-year-old man develops sudden central chest pain and hypotension six hours after zone 2 TEVAR. Examination demonstrates a new early diastolic murmur.

ECG-gated CTA demonstrates a new dissection involving the ascending aorta and aortic root, with haemopericardium. There is no adequate proximal landing zone for further endovascular extension.

What is the most appropriate treatment?`,{A:"Continue anti-impulse treatment and repeat CTA in 24 hours",B:"Extend the endograft proximally across the supra-aortic branches without revascularisation",C:"Arrange emergency open ascending aortic and arch repair",D:"Extend the endograft distally to the coeliac origin",E:"Perform pericardial drainage as definitive treatment"},"C","This is retrograde type A dissection complicated by haemopericardium after TEVAR. With no endovascular landing zone, emergency open ascending aortic and arch repair is required.","A delays treatment of a surgical emergency. B has no safe landing zone and would compromise the arch branches. D treats the wrong segment. E does not repair the dissection.",{image:"images/thoracic/B8DC18D5-DF63-4FDF-9A62-257EBB17A879.png",source:"Oxford Textbook of Vascular Surgery, Chapters 8.5 and 8.6, printed pp 603 and 611 (PDF pp 628 and 636); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 227 (PDF p 276)",domain:"Acute aortic syndrome - retrograde type A dissection after TEVAR",uncertainty:"The exact extent of open repair is determined by the entry tear, root and arch anatomy. Draft pending human review."}),
Q(17,"Symptomatic congenital arch anomaly",`A 58-year-old woman reports progressive dysphagia and coughing after meals.

CTA demonstrates a right-sided aortic arch with an aberrant left subclavian artery passing behind the oesophagus. The artery arises from a 58 mm aneurysmal diverticulum, which measured 50 mm one year previously. Both upper limbs are normally perfused.

What is the most appropriate treatment principle?`,{A:"Continue surveillance because upper-limb perfusion is preserved",B:"Treat the dysphagia with oesophageal dilatation",C:"Ligate the aberrant left subclavian artery without treating the diverticulum",D:"Exclude or replace the aneurysmal diverticulum while preserving or revascularising left subclavian perfusion",E:"Perform left carotid endarterectomy"},"D","This is a symptomatic, enlarging Kommerell diverticulum associated with an aberrant left subclavian artery. Treatment must address the aneurysmal diverticulum and the compressive anatomy while maintaining left-arm perfusion.","A ignores symptoms, interval growth and aneurysmal size. B does not treat the vascular compression. C leaves the diverticulum untreated and sacrifices left-arm inflow. E does not address the arch anomaly.",{source:"ESVS/EACTS 2019 Consensus Document for the Management of Aortic Arch Pathologies, section 8.2 and Recommendations 38-39, printed p 188 (merged PDF p 419)",domain:"Aneurysm - congenital aortic arch anomaly; aberrant subclavian artery; Kommerell diverticulum",uncertainty:"The definitive open, hybrid or endovascular configuration depends on arch anatomy. The item tests the supported treatment principle. Draft pending human review."}),
Q(18,"Spontaneous arterial disease in a young woman",`A 34-year-old woman develops an extracranial internal carotid artery dissection following a minor neck movement.

She has thin translucent skin, extensive spontaneous bruising and characteristic thin facial features. She previously required surgery for a spontaneous sigmoid-colon perforation. Her mother died following rupture of an iliac artery aneurysm at the age of 41.

Which underlying diagnosis best explains this presentation?`,{A:"Vascular Ehlers-Danlos syndrome caused by a COL3A1 variant",B:"Marfan syndrome caused by an FBN1 variant",C:"Loeys-Dietz syndrome caused by a TGFBR2 variant",D:"Familial thoracic aortic disease caused by an ACTA2 variant",E:"Turner syndrome"},"A","Arterial dissection or rupture, translucent skin, easy bruising, characteristic facial features and spontaneous bowel perforation are characteristic of vascular Ehlers-Danlos syndrome caused by pathogenic COL3A1 variants.","Marfan syndrome is associated with ectopia lentis and skeletal features rather than bowel and diffuse arterial fragility. Loeys-Dietz syndrome is associated with arterial tortuosity and characteristic craniofacial findings. ACTA2 disease has different vascular and systemic associations. Turner syndrome is associated with congenital cardiac and aortic abnormalities but not this tissue-fragility phenotype.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 573-574 (PDF pp 598-599)",domain:"Vascular pathology - congenital and heritable aortopathy; vascular Ehlers-Danlos syndrome",uncertainty:"This replaces the previous adult coarctation item because the approved source set does not support one unambiguous preferred intervention for native adult coarctation. Draft pending human review."}),
Q(19,"Descending aortic aneurysm in Marfan syndrome",`A 42-year-old man with genetically confirmed Marfan syndrome previously underwent valve-sparing aortic-root replacement. He remains physically active and has good cardiac, pulmonary and renal function.

Surveillance demonstrates chronic post-dissection aneurysmal degeneration of the native descending thoracic aorta, now measuring 58 mm and having enlarged by 8 mm over 12 months. Intervention is considered necessary. Although endovascular access is satisfactory, the available proximal and distal sealing zones are both within native, genetically abnormal aorta.

What is the most appropriate definitive treatment strategy?`,{A:"Continue annual surveillance until the diameter reaches 65 mm",B:"Standard TEVAR using the native proximal and distal sealing zones",C:"Open aortic replacement in a specialist multidisciplinary aortic centre",D:"Embolisation of the false lumen without aortic replacement",E:"Branched endovascular repair with both sealing zones in native aorta"},"C","This is a young, physiologically fit patient with progressive post-dissection aneurysmal disease caused by a heritable connective-tissue disorder. First-line TEVAR is discouraged when both sealing zones would lie in native genetically abnormal aorta because of continuing degeneration, treatment failure and reintervention. Specialist open replacement offers the most durable definitive strategy in the circumstances described.","A applies an inappropriately high degenerative threshold despite established progression and Marfan syndrome. B and E place radial force and both sealing zones in native genetically abnormal aorta; endovascular treatment is better reserved for selected circumstances such as prohibitive open risk, emergency bridging or sealing within existing prosthetic grafts. D does not replace the progressively aneurysmal diseased segment.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 223 (PDF p 272); Oxford Textbook of Vascular Surgery, Chapter 8.1, printed p 576 (PDF p 601)",domain:"Aneurysm - heritable connective-tissue aortopathy; chronic dissection; open versus endovascular repair",uncertainty:"Endovascular intervention may be appropriate in selected connective-tissue patients, particularly when a prosthetic landing zone is available or open surgery is unsuitable. Those circumstances are deliberately excluded from this stem."}),
Q(20,"Spinal-cord collateral preservation during extensive TEVAR",`A 73-year-old man is being assessed for total endovascular repair of an extensive thoracoabdominal aortic aneurysm. He has previously undergone infrarenal EVAR, and the right internal iliac artery is chronically occluded.

The proposed repair would cover 26 cm of thoracic aorta, beginning in zone 2. The left subclavian artery is patent, and the left internal iliac artery provides the remaining direct pelvic collateral inflow.

Which operative plan most appropriately reduces his risk of spinal-cord ischaemia?`,{A:"Perform the repair in one stage and cover the left subclavian artery without revascularisation",B:"Stage the aortic coverage, revascularise the left subclavian artery and preserve left internal iliac perfusion",C:"Perform the repair in one stage with a prophylactic CSF drain as the only protective measure",D:"Embolise the left internal iliac artery before staged aortic coverage",E:"Perform single-stage repair followed by permissive postoperative hypotension"},"B","This patient has several major threats to the spinal collateral network: long-segment thoracic coverage, previous infrarenal aortic repair, planned LSCA coverage and loss of one internal iliac artery. Staging the coverage while preserving or restoring the remaining supra-aortic and pelvic collateral inflow reduces the spinal ischaemic burden. Adequate perfusion pressure and oxygen delivery remain essential throughout.","A removes LSCA inflow and undertakes all coverage in one stage. C treats CSF drainage as a substitute for collateral preservation and staged repair; drain use should form part of a wider risk-based protocol. D sacrifices the remaining pelvic collateral inflow. E combines extensive single-stage coverage with hypotension, further reducing spinal cord perfusion.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 217 and 221 (PDF pp 266 and 270); Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 588 (PDF p 613)",domain:"Aneurysm - extensive TEVAR; spinal-cord ischaemia prevention; collateral-network preservation",uncertainty:"Prophylactic CSF-drain practice varies between centres. The question therefore tests staging and preservation of collateral inflow rather than asserting that every high-risk patient requires a drain."}),
Q(21,"Initial anti-impulse therapy for acute type B dissection",`A 66-year-old woman presents with sudden severe interscapular pain. CTA confirms an acute type B aortic dissection beginning distal to the left subclavian artery. There is no rupture or branch-vessel malperfusion.

Her BP is 212/118 mmHg and pulse is 112/min. Peripheral perfusion and urine output are satisfactory. She has no contraindication to beta-blockade.

Which is the most appropriate initial pharmacological strategy?`,{A:"Commence an intravenous vasodilator alone and accept any reflex tachycardia while the blood pressure falls",B:"Titrate intravenous beta-blockade to reduce heart rate and left-ventricular ejection impulse, adding an intravenous vasodilator if hypertension persists",C:"Commence oral beta-blockade and reassess the blood pressure the following day",D:"Lower the systolic blood pressure with an intravenous vasodilator before introducing beta-blockade",E:"Treat the pain but withhold antihypertensive therapy until repeat imaging has confirmed stability"},"B","Initial treatment should rapidly reduce both heart rate and left-ventricular ejection impulse. Intravenous beta-blockade is therefore established first, with an intravenous vasodilator added only if adequate blood-pressure control has not been achieved. This reduces aortic wall shear stress while avoiding vasodilator-induced reflex tachycardia.","A and D introduce a vasodilator before impulse control and may provoke reflex tachycardia. C is too slow for severe hypertension in an acute dissection. E leaves dangerous hypertension and shear stress untreated.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 226 (PDF p 275); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, printed pp 59-60 (PDF pp 16-17)",domain:"Aneurysm - acute aortic dissection; initial anti-impulse therapy and emergency management",uncertainty:"Drug selection and haemodynamic targets must be individualised to organ perfusion and contraindications. Draft pending human review."}),
Q(22,"Minimal blunt thoracic aortic injury",`A 34-year-old woman is admitted after a high-speed road traffic collision. Her injuries include rib fractures, pulmonary contusions and a stable pelvic fracture. CTA findings are shown in the exhibit. She is haemodynamically stable after initial resuscitation. There is no intracranial haemorrhage and no ongoing blood loss.\n\nWhat is the most appropriate management of the aortic injury?`,{A:"TEVAR during this admission",B:"Open isthmus repair",C:"Anti-impulse therapy and interval CTA",D:"Systemic anticoagulation",E:"Thoracic endograft plus left carotid-subclavian bypass"},"C","This is a minimal blunt thoracic aortic injury: a small intimal flap without pseudoaneurysm, external contour abnormality, mediastinal haematoma or active extravasation. These injuries are commonly managed non-operatively with blood pressure/impulse control and surveillance imaging.","A is overtreatment for the lesion described. B is disproportionate and carries higher morbidity. D does not treat the injury and may be harmful in trauma. E is unnecessary without a TEVAR indication or zone 2 requirement.",{image:"images/thoracic/A97E7A80-BFFC-4DE5-85DB-A7C3B674C547.png",exhibit:"Synthetic trauma CTA sagittal oblique image: small intimal flap at aortic isthmus; no pseudoaneurysm; no contour abnormality; no mediastinal haematoma; no active extravasation; aortic diameter otherwise normal.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, section 3.1.4.2, printed p 20 (merged PDF p 1215): minimal intimal injuries may be managed expectantly with serial imaging; Oxford Textbook of Vascular Surgery, Chapter 3.3, printed p 196 (PDF p 221)",domain:"Vascular Trauma - minimal blunt thoracic aortic injury; non-operative management and surveillance",uncertainty:"The management principle is directly supported. The supplied image must still be visually checked to confirm that it shows only the minimal injury described."}),
Q(23,"Real case 2 - complicated TBAD requiring a zone 2 branched strategy",`A 70-year-old man presents with sudden-onset retrosternal chest pain that began at 06:00 and has persisted. At onset he experienced 10 minutes of left-leg coolness, paraesthesia and pain, which then resolved. He also reports new paraesthesia affecting his left hand. He has hypertension but no other medical problems, takes no regular medication and has no allergies. He has never smoked and cycles daily.\n\nPulse is 48/min, BP 164/105 mmHg, SpO2 97% on air and temperature 36.5 C. WCC is 11.4 x10^9/L, haemoglobin 114 g/L, platelets 273 x10^9/L, MCV 85 fL, sodium 139 mmol/L, potassium 3.7 mmol/L, eGFR 45 mL/min/1.73 m2 (usual approximately 70) and INR 1.1.\n\nCTA demonstrates acute type B aortic dissection with impaired left renal and left iliac perfusion. The proximal entry tear is too close to the left subclavian artery (LSCA) to obtain an adequate standard proximal seal without entering zone 2. The LSCA anatomy is suitable for preservation with a dedicated branched thoracic device.\n\nWhat is the most appropriate initial aortic treatment strategy?`,{A:"Anti-impulse therapy alone with interval CTA",B:"Standard zone 3 TEVAR",C:"Zone 2 TEVAR with intentional LSCA coverage and no revascularisation",D:"Branched zone 2 TEVAR preserving LSCA perfusion",E:"Open descending thoracic aortic replacement"},"D","Renal and lower-limb malperfusion make this a complicated acute type B dissection requiring intervention. The left-hand paraesthesia also raises concern about compromised LSCA perfusion. The entry tear requires a zone 2 proximal seal, and the supplied anatomy permits LSCA preservation. In the real case, this was achieved with a GORE TBE branched thoracic endograft.","A does not correct organ malperfusion. B cannot obtain the required proximal seal. C would sacrifice LSCA perfusion despite left-hand symptoms and suitable preservation anatomy. E is more invasive when the supplied anatomy permits endovascular repair.",{video:"images/thoracic/Q22 cTBAD.m4v",exhibit:"Initial CTA: acute type B aortic dissection with a proximal entry tear requiring a zone 2 seal, together with left renal and left iliac malperfusion.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, Recommendation 16 and discussion of arm ischaemia after LSCA occlusion, printed p 16 (merged PDF p 1211); ESVS/EACTS Consensus Document for the Management of Aortic Arch Pathologies (2019), section 6.4, printed p 185 (merged PDF p 416), describing single-side-branch devices designed to preserve the LSCA during zone 2 TEVAR; Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 217 and 227 (PDF pp 266 and 276)",domain:"Aneurysm - Emergency; complicated acute type B dissection; malperfusion and zone 2 endovascular planning",uncertainty:"The approved sources support emergency TEVAR, revascularisation when LSCA occlusion causes arm ischaemia and the principle of branched LSCA preservation. They do not mandate one named device. GORE TBE is retained as the factual treatment used in the supplied real case."}),
Q(24,"Real case 2 - persistent static left renal malperfusion after branched TEVAR",`A 70-year-old man undergoes branched zone 2 TEVAR for acute type B aortic dissection with renal and limb malperfusion. Completion angiography shows satisfactory endograft deployment and improved aortic true-lumen expansion, but the left renal artery does not enhance. Selective angiography demonstrates persistent fixed compromise of the left renal artery from the dissection.\n\nWhat is the most appropriate next intervention?`,{A:"Further balloon dilatation of the thoracic endograft",B:"Balloon fenestration of the aortic dissection flap",C:"Direct stenting of the left renal artery",D:"Covered stenting of the superior mesenteric artery",E:"Open left renal artery bypass"},"C","Persistent static compromise of a renal branch is not reliably corrected by proximal entry coverage alone and requires direct branch-vessel stenting. In this real case, renal perfusion was restored with a balloon-mounted Palmaz bare-metal stent.","A does not correct the fixed renal branch lesion. B is principally used to address dynamic pressure-related malperfusion rather than the demonstrated static branch compromise. D treats a normally perfused different vessel. E is unnecessarily invasive when the lesion can be crossed and stented endovascularly.",{video:"images/thoracic/Q22 cTBAD post TEVAR.m4v",exhibit:"Completion angiography after branched TEVAR: non-enhancement of the left renal artery due to persistent static branch-vessel compromise.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, section 3.1.1.2.2, printed p 16 (merged PDF p 1211): static obstruction or ostial disruption should be treated by stenting the malperfused branch vessel; Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 227 (PDF p 276)",domain:"Aneurysm - Emergency; type B dissection; static branch-vessel malperfusion and adjunctive renal intervention",uncertainty:"The sources support direct renal branch stenting but do not specify bare-metal, covered or balloon-mounted stent selection. The Palmaz stent is retained only as the actual treatment used in this case."}),
Q(25,"Real case 2 - persistent left iliac malperfusion after renal rescue",`After branched TEVAR and successful stenting of a persistently compromised left renal artery, completion angiography shows no flow through the left iliac system. The left leg remains cool and pulseless. The fixed iliac obstruction related to the dissection can be crossed endovascularly.\n\nWhat is the most appropriate next intervention?`,{A:"Balloon fenestration of the aortic dissection flap alone",B:"Covered stenting of the right common iliac artery",C:"Direct endovascular stenting of the affected left iliac segment",D:"Catheter-directed thrombolysis of the left iliac artery",E:"Femoro-femoral crossover bypass"},"C","The persistently cool, pulseless leg and absent iliac flow demonstrate ongoing static limb malperfusion despite proximal aortic repair. Direct stenting of the affected left iliac segment is appropriate when it can be crossed. A self-expanding bare-metal stent was used in the real case.","A is less appropriate for the demonstrated fixed iliac obstruction. B treats the wrong side. D does not address the dissection-related mechanical obstruction. E may be an alternative if endovascular recanalisation fails, but is not the best next step when the lesion is crossable.",{video:"images/thoracic/Q22 cTBAD left iliac.m4v",exhibit:"Angiography after renal artery rescue: absent left iliac flow with a persistently cool, pulseless left leg.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, section 3.1.1.2.2, printed p 16 (merged PDF p 1211): static obstruction should be treated by stenting the malperfused branch vessel; Oxford Textbook of Vascular Surgery, Chapter 8.7, printed p 616 (PDF p 641): lower-limb malperfusion is an indication for prompt intervention",domain:"Aneurysm - Emergency; type B dissection; static iliac malperfusion and acute lower-limb ischaemia",uncertainty:"The sources support direct stenting of a crossable static branch obstruction but do not specify bare-metal or self-expanding stent selection. The self-expanding bare-metal stent is retained only as the actual treatment used in this case."}),
Q(26,"Real case 2 - spinal cord ischaemia rescue after extensive TEVAR",`On postoperative day 1 after branched TEVAR and branch-vessel rescue, a 70-year-old man develops loss of temperature sensation in both legs, followed shortly by loss of movement. A lumbar CSF drain is in situ but has been clamped. BP is 134/72 mmHg, haemoglobin is 91 g/L and he is receiving no supplemental oxygen. There is no new limb pulse deficit.\n\nWhat is the most appropriate immediate management?`,{A:"Urgent MRI of the spinal cord before treatment",B:"Systemic anticoagulation and neurological observation",C:"Emergency spinal cord rescue with CSF drainage and optimisation of perfusion and oxygen delivery",D:"Immediate repeat left iliac angiography",E:"Emergency decompressive laminectomy"},"C","This is acute spinal cord ischaemia after extensive thoracic aortic intervention. Treatment must be immediate and should restore spinal cord perfusion pressure and oxygen delivery, including reopening the CSF drain according to the local protocol, augmenting arterial pressure, correcting anaemia and optimising oxygenation. The real patient was treated successfully using the COPS protocol and recovered.","A delays time-critical rescue. B does not restore spinal cord perfusion. D is not supported when there is no new pulse deficit and the neurological syndrome is bilateral. E does not treat the perfusion mechanism.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 217 (PDF p 266): spinal-cord rescue requires reduction of CSF pressure, augmentation of mean arterial pressure and optimisation of oxygen delivery and haemoglobin",domain:"Aneurysm - postoperative complications; spinal cord ischaemia after TEVAR and emergency rescue",uncertainty:"The rescue components are directly supported. COPS is retained as the name of the local protocol used successfully in the real case; its precise targets should follow the treating centre's protocol."}),
Q(27,"Real case 2 - late type Ia endoleak after branched TEVAR",`A 70-year-old man has recovered well after branched TEVAR for complicated type B aortic dissection and is asymptomatic at follow-up. Six-month surveillance CTA demonstrates a type Ia endoleak with persistent proximal pressurisation. The descending thoracic aorta measures 51 mm.\n\nWhat is the most appropriate management principle?`,{A:"Continue annual CTA surveillance because he is asymptomatic",B:"Embolise thoracic intercostal arteries supplying the excluded segment",C:"Undertake definitive correction of the proximal seal failure after complex aortic multidisciplinary assessment",D:"Extend the existing thoracic endograft distally",E:"Commence long-term antimicrobial therapy and arrange PET-CT"},"C","A type Ia endoleak is failure of the proximal seal and maintains pressurisation of the treated aortic pathology. The patient therefore requires specialist multidisciplinary assessment and a definitive strategy to restore a durable proximal seal. In this real case, the eventual treatment was a frozen elephant trunk after the necessary multidisciplinary reviews; the stem does not provide enough arch anatomy to make that one technique uniquely correct.","A is unsafe because absence of symptoms does not remove the risk from persistent proximal pressurisation. B does not address a proximal type I seal failure. D treats the wrong end of the repair. E would be appropriate only if infection were suspected, which the stem does not suggest.",{video:"images/thoracic/Q22 T1AEL.m4v",exhibit:"Six-month CTA: type Ia endoleak after branched TEVAR, with the descending thoracic aorta measuring 51 mm.",source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, Recommendation 79, printed p 40 (merged PDF p 1235): any early or late type I endoleak after descending thoracic endovascular repair should undergo prompt intervention; Oxford Textbook of Vascular Surgery, Chapter 8.5, printed p 603 (PDF p 628)",domain:"Aneurysm - postoperative surveillance; type I endoleak and complex aortic reintervention",uncertainty:"Frozen elephant trunk was the actual treatment, but the supplied stem supports only the evidence-based principle of prompt definitive correction of the proximal seal. The final open, hybrid or endovascular strategy remains anatomy-dependent."}),
Q(28,"Motor-evoked potential deterioration during open TAAA repair",`A fit 59-year-old man undergoes open repair of a Crawford extent II thoracoabdominal aortic aneurysm using partial left-heart bypass and cerebrospinal-fluid drainage. Mean arterial pressure is maintained above 80 mmHg.

During sequential reconstruction, temporary occlusion of several large intercostal arteries arising between T9 and T11 produces a reproducible bilateral loss of lower-limb motor-evoked potentials. The signals recover when these arteries are reperfused.

What is the most appropriate operative response?`,{A:"Oversew the affected intercostal arteries and increase distal bypass flow",B:"Sacrifice the affected intercostal arteries and rely on postoperative cerebrospinal-fluid drainage",C:"Lower the mean arterial pressure to reduce bleeding from the intercostal origins",D:"Reimplant the implicated intercostal arteries into the aortic graft",E:"Complete the repair without reimplantation and assess lower-limb movement after extubation"},"D","The reproducible motor-evoked potential loss during occlusion identifies these segmental arteries as important contributors to spinal-cord perfusion. Reimplanting the implicated intercostal arteries restores their contribution to the collateral network and directly addresses the intraoperative evidence of spinal-cord ischaemia.","A and B permanently sacrifice vessels shown to be functionally important. C would further reduce spinal-cord perfusion pressure. E delays action until potentially irreversible neurological injury has occurred.",{source:"Postgraduate Vascular Surgery, 2e, Chapter 9, printed p 214 (PDF p 232); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - open thoracoabdominal aortic aneurysm repair; spinal-cord protection and neuromonitoring",uncertainty:"Intercostal reimplantation strategy varies between specialist centres and is integrated with other spinal-protection measures. Draft pending human review."}),
Q(29,"Acute TBAD with refractory hypertension and pain",`A 63-year-old man presents with an acute type B aortic dissection. Intravenous beta-blockade and vasodilator therapy are commenced.

Twelve hours later, his heart rate is 60 beats/min, but his systolic blood pressure remains between 175 and 190 mmHg despite escalating treatment. He continues to experience severe interscapular pain. CTA shows no rupture or established organ infarction, and the anatomy is suitable for endovascular repair.

What is the most appropriate management?`,{A:"Continue medical therapy",B:"Perform emergency open replacement of the descending thoracic aorta",C:"Perform emergency TEVAR",D:"Commence therapeutic anticoagulation",E:"Discharge with outpatient surveillance"},"C","Refractory hypertension and persistent severe pain despite intravenous therapy make this a complicated acute type B dissection. Emergency TEVAR is preferred when the anatomy is suitable.","A and E delay treatment despite failure of medical control. B is more invasive when suitable endovascular anatomy is available. D does not treat the dissection and may increase bleeding risk.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 226-227 (PDF pp 275-276); Oxford Textbook of Vascular Surgery, Chapter 8.7, printed p 616 (PDF p 641)",domain:"Acute aortic syndrome - complicated type B dissection; refractory hypertension and pain",uncertainty:"Emergency timing depends on clinical stability and local capability, but the stem establishes failure of medical therapy and suitable TEVAR anatomy. Draft pending human review."}),
Q(30,"Definitive treatment of an infected native descending thoracic aneurysm",`A 58-year-old man presents with fever and persistent thoracic back pain. Blood cultures repeatedly grow Staphylococcus aureus. CTA demonstrates a rapidly enlarging irregular saccular aneurysm of the descending thoracic aorta with surrounding inflammatory change.

There is no free rupture. He has good physiological reserve and has been transferred to a specialist aortic centre where open reconstruction is technically feasible.

Which is the most appropriate definitive treatment plan?`,{A:"Culture-directed antibiotic therapy with imaging surveillance alone",B:"Definitive TEVAR followed by a short course of antibiotics",C:"Open resection of the infected aorta, wide debridement and arterial reconstruction, combined with culture-directed antibiotic therapy",D:"Percutaneous drainage of the periaortic inflammatory tissue without aortic reconstruction",E:"High-dose glucocorticoid therapy followed by interval CTA"},"C","In a physiologically fit patient with a technically resectable infected native aortic aneurysm, definitive source control requires removal of the infected aorta, wide debridement and arterial reconstruction, together with prolonged culture-directed antimicrobial therapy.","A does not provide source control. B places prosthetic material into an infected field without debridement and is more appropriately considered for selected high-risk patients or as a bridge in an emergency. D leaves the infected aortic wall untreated. E treats an inflammatory disorder rather than the demonstrated bacterial infection.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 13, printed pp 209-210 (PDF pp 255-256); Oxford Textbook of Vascular Surgery, Chapter 8.2, printed p 582 (PDF p 607); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed pp 58-59 (PDF pp 15-16)",domain:"Aneurysm - infected native thoracic aortic aneurysm; antimicrobial therapy and definitive source control",uncertainty:"Endovascular treatment may be definitive or a bridge in selected high-risk or emergency cases. The stem deliberately specifies a stable, fit patient in whom open source control is feasible. Draft pending human review."}),
Q(31,"Real case - infective native aortic arch aneurysm in a patient unfit for intervention",`An 88-year-old woman is diagnosed with an infective native aortic arch aneurysm. CTA demonstrates a markedly irregular saccular arch aneurysm with surrounding inflammatory change. There is no active extravasation, and she is haemodynamically stable.\n\nShe is severely frail. Following review by the complex aortic multidisciplinary team, including cardiac surgery, vascular surgery, anaesthesia, microbiology and radiology, she is considered unfit for open arch replacement, hybrid repair or endovascular intervention. The anticipated procedural burden is judged to outweigh any realistic benefit.\n\nWhat is the most appropriate management strategy?`,{A:"Emergency open arch replacement with in-situ reconstruction",B:"Hybrid supra-aortic debranching followed by TEVAR",C:"TEVAR alone as definitive source control",D:"Microbiology-directed antimicrobial therapy with symptom control and advance care planning",E:"No antimicrobial treatment and routine annual CTA surveillance"},"D","Definitive treatment of an infective native aortic aneurysm ordinarily combines antimicrobial therapy with aortic source control. In this patient, however, specialist multidisciplinary assessment has established that every open, hybrid and endovascular option carries prohibitive risk and no realistic net benefit. The best achievable plan is therefore culture- and microbiology-directed antimicrobial treatment together with symptom control, explicit discussion of prognosis and goals of care, and an individualised follow-up plan. This is conservative or palliative management rather than curative treatment.","A and B contradict the multidisciplinary conclusion that she cannot tolerate major repair. C does not remove infected tissue and has also been judged unsuitable in this anatomy and clinical context. E omits treatment of the infection and offers surveillance that is too passive for a life-threatening infective process.",{video:"images/thoracic/Mycotic DTAA.m4v",exhibit:"CTA: markedly irregular saccular infective aneurysm of the aortic arch with surrounding inflammatory change and no active contrast extravasation.",source:"ESVS/EACTS Consensus Document for the Management of Aortic Arch Pathologies (2019), section 8.4, printed p 188 (merged PDF p 419): conservative treatment may be considered in selected cases; Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 13, printed pp 209-210 (PDF pp 255-256): infected aneurysms require appropriate antimicrobial therapy and definitive source control when feasible",domain:"Aneurysm - infective native aortic aneurysm; aortic arch pathology; conservative and palliative management",uncertainty:"This is explicitly non-curative management after all source-control options have been judged disproportionate. The approved sources do not prescribe a single palliative regimen; antimicrobial duration, symptom control and follow-up must be individualised. The supplied CTA still requires human visual review."}),
Q(32,"Additional imaging for suspected aortitis",`A 72-year-old woman reports fatigue, weight loss and thoracic discomfort. Her C-reactive protein is persistently elevated, but repeated blood cultures are negative.

CTA demonstrates smooth circumferential thickening of the thoracic aortic wall extending into the proximal supra-aortic branches. There is no focal saccular aneurysm, periaortic gas or contained rupture. Active large-vessel aortitis is suspected.

Which additional imaging investigation is most useful for confirming the suspected aortic inflammatory process?`,{A:"Fluorodeoxyglucose PET-CT",B:"CT coronary angiography",C:"Catheter aortography",D:"Transthoracic echocardiography",E:"Upper-limb arterial duplex ultrasonography"},"A","Fluorodeoxyglucose PET-CT demonstrates metabolically active inflammation in the aortic wall and is the most useful listed investigation for confirming suspected aortitis and assessing the distribution of active large-vessel inflammation.","B assesses the coronary arteries rather than aortic-wall inflammatory activity. C defines the lumen but not mural metabolic activity. D does not adequately assess the descending thoracic aortic wall or the distribution described. E is limited to accessible peripheral vessels and cannot evaluate the full thoracic process.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.3, printed p 586 (PDF p 611); Vascular Surgery Curriculum (2021, v2 July 2023), Vasospastic Disorders and Vasculitis, printed p 57 (PDF p 14), and Aneurysm - Elective, printed pp 58-59 (PDF pp 15-16)",domain:"Vasospastic disorders and vasculitis; inflammatory and vasculitic aortic pathology",uncertainty:"PET-CT findings must be interpreted alongside clinical, biochemical and anatomical imaging findings. Draft pending human review."}),
Q(33,"Enlarging residual dissection after type A repair",`A 57-year-old man underwent emergency ascending aortic and hemiarch replacement for an acute type A dissection three years ago.

Surveillance CTA demonstrates a residual dissection extending from the distal arch through the visceral aorta. The descending thoracic aorta has enlarged from 49 mm to 61 mm over 18 months. The false lumen remains patent. The coeliac and superior mesenteric arteries arise from the true lumen, while the left renal artery arises from the false lumen.

What is the most appropriate management strategy?`,{A:"Perform a standard short zone 3 TEVAR terminating above the coeliac artery",B:"Plan staged complex-aortic repair with preservation of visceral and renal perfusion",C:"Continue annual surveillance because the patient is asymptomatic",D:"Commence therapeutic anticoagulation to decompress the false lumen",E:"Perform isolated open infrarenal aortic replacement"},"B","The residual dissection is enlarging and involves vessels arising from different lumens. Repair requires an anatomy-specific complex strategy that preserves all visceral and renal perfusion; staging should be considered to reduce the burden of extensive aortic treatment.","A does not address the complete diseased segment or mixed branch origins. C accepts substantial progressive enlargement. D does not decompress the false lumen. E treats the wrong aortic segment.",{source:"ESVS Clinical Practice Guidelines on the Management of Descending Thoracic Aorta Diseases, Recommendation 34b, printed p 23 (merged PDF p 1218); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed pp 221 and 223 (PDF pp 270 and 272); Oxford Textbook of Vascular Surgery, Chapter 8.7, printed p 617 (PDF p 642)",domain:"Aneurysm - Elective; chronic post-dissection aneurysm and complex branch-vessel planning",uncertainty:"The need for intervention and preservation of mixed-lumen visceral branches are supported, but the definitive open, hybrid or branched endovascular configuration remains anatomy- and expertise-dependent."}),
Q(34,"SMA bridging-stent instability after branched TAAA repair",`A 72-year-old man undergoes branched endovascular repair of a thoracoabdominal aortic aneurysm. Completion angiography demonstrates opacification of the superior mesenteric artery.

However, selective catheter assessment produces a damped pressure trace. Cone-beam CT demonstrates focal compression and kinking of the distal superior mesenteric bridging stent. The lesion remains crossable with a guidewire.

What is the most appropriate next step?`,{A:"Complete the procedure and arrange routine CTA after 30 days",B:"Embolise the superior mesenteric artery",C:"Remove the entire endograft and convert immediately to open repair",D:"Administer catheter-directed thrombolysis without altering the stent",E:"Correct the defect with angioplasty or relining and repeat completion imaging"},"E","The damped pressure trace and cross-sectional imaging demonstrate a correctable mechanical threat to SMA perfusion. It should be treated before the procedure is completed and the result confirmed.","A leaves a threatened branch untreated. B would cause mesenteric ischaemia. C is disproportionate when the lesion is crossable and correctable. D does not correct the mechanical defect.",{source:"ESVS 2024 Clinical Practice Guidelines on Management of Abdominal Aorto-iliac Artery Aneurysms, target-vessel instability and completion imaging sections, printed pp 266-267 and 273 (merged PDF pp 330-331 and 337); Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 221 (PDF p 270)",domain:"Aneurysm - branched endovascular repair; target-vessel instability; completion imaging",uncertainty:"The precise combination of angioplasty and relining depends on the mechanism and device configuration. Draft pending human review."}),
Q(35,"ACTA2-related heritable thoracic aortic disease",`A 39-year-old woman is referred after genetic testing identifies a pathogenic ACTA2 variant. Her mother sustained a type A aortic dissection at a relatively small aortic diameter, and a younger sibling has premature coronary artery disease. The patient has livedo reticularis and iris flocculi. Her aortic root measures 43 mm.\n\nWhat is the most appropriate management principle?`,{A:"Manage as a degenerative aneurysm and defer specialist review until the root reaches 55 mm",B:"Arrange annual echocardiography but do not offer assessment to relatives",C:"Plan ascending aortic TEVAR when the root reaches 50 mm",D:"Refer for gene-specific planning and cascade screening of first-degree relatives",E:"Discharge because the aortic root is below 50 mm"},"D","ACTA2-related disease is an autosomal-dominant heritable thoracic aortopathy associated with aortic aneurysm/dissection and may also be associated with premature coronary disease, stroke, livedo reticularis and iris flocculi. Dissection can occur at diameters below conventional degenerative thresholds. Management should therefore be individualised by a specialist heritable-aortic team using the causative gene, family history, diameter and growth, while first-degree relatives are offered targeted genetic assessment and serial aortic imaging.","A and E apply inappropriate conventional diameter reassurance despite a pathogenic variant and adverse family history. B provides surveillance to the proband but omits cascade assessment of relatives. C proposes an unsuitable ascending-aortic endovascular strategy and still reduces management to a single diameter.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.1, printed pp 571-576 (PDF pp 596-601), including ACTA2 phenotype, lower dissection diameters and family screening; Vascular Surgery Curriculum (2021, v2 July 2023), Vascular Pathology and Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Vascular Pathology and Aneurysm - Elective; heritable thoracic aortic disease",uncertainty:"The approved source supports gene- and family-specific management and cascade screening but predates contemporary HTAD guidance. It does not justify one universal operative diameter for every ACTA2 variant; a newer approved source is still required for current numerical thresholds."}),
Q(36,"Component separation after modular TEVAR",`A 71-year-old man undergoes surveillance four years after modular TEVAR for a descending thoracic aortic aneurysm. The excluded aneurysm has enlarged from 58 mm to 66 mm.

CTA demonstrates direct contrast entry into the sac through separation of two overlapping thoracic endograft components. The proximal and distal attachment sites remain sealed. There is sufficient graft length on either side of the separation to bridge the defect endovascularly.

What is the most appropriate treatment?`,{A:"Repeat CTA in six months without intervention",B:"Embolise the thoracic intercostal arteries supplying the aneurysm sac",C:"Insert a proximal thoracic extension cuff without crossing the component separation",D:"Proceed directly to open removal of the entire thoracic endograft",E:"Reline the separated components with an additional bridging stent-graft"},"E","Component separation produces a high-pressure type III endoleak and continued sac pressurisation. An additional stent-graft should bridge the separated components with adequate overlap, restoring continuity of the endograft and excluding the aneurysm sac.","A leaves a high-pressure endoleak and an enlarging sac untreated. B is a treatment for selected type II endoleaks and does not repair component separation. C does not bridge the mechanical defect. D is unnecessarily invasive when the defect can be relined endovascularly.",{source:"Oxford Textbook of Vascular Surgery, Chapter 8.5, printed p 603 (PDF p 628); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective, printed p 59 (PDF p 16)",domain:"Aneurysm - post-TEVAR surveillance; type III endoleak and endovascular relining",uncertainty:"Open conversion remains an alternative when endovascular relining is not technically possible or fails. Draft pending human review."}),
Q(37,"Endograft sizing in acute type B dissection",`A 70-year-old man requires TEVAR for an acute complicated type B aortic dissection. The non-dissected proximal landing zone measures 31 mm on centreline CTA measurements.

The initial procedural plan specifies a 39 mm thoracic endograft and routine balloon moulding after deployment.

Which modification most appropriately reduces the risk of further aortic-wall injury and retrograde dissection?`,{A:"Use the 39 mm graft and perform routine balloon moulding throughout the landing zone",B:"Select a graft of approximately 34 mm and avoid routine balloon dilatation",C:"Select a graft of approximately 37 mm and balloon only its proximal edge",D:"Increase the graft diameter to approximately 40 mm but omit balloon moulding",E:"Select a graft of approximately 34 mm and perform aggressive balloon moulding throughout its length"},"B","In acute dissection, the aortic wall is fragile. Endograft oversizing should be limited to approximately 10%, and routine balloon dilatation should be avoided to reduce the risk of further wall injury and retrograde type A dissection. A graft of approximately 34 mm provides about 10% oversizing for a 31 mm landing zone.","A, C and D use excessive oversizing for acute dissection. A, C and E also introduce balloon-related wall stress. E uses an appropriate approximate diameter but negates this advantage with aggressive routine ballooning.",{source:"Full Vascular: A Companion to Specialist Surgical Practice (2024), Chapter 14, printed p 227 (PDF p 276); Vascular Surgery Curriculum (2021, v2 July 2023), Aneurysm - Elective/Emergency, printed pp 59-60 (PDF pp 16-17)",domain:"Aneurysm - thoracic endovascular planning; acute complicated type B dissection",uncertainty:"Final device selection must use the manufacturer's sizing instructions and patient-specific centreline measurements. Draft pending human review."}),
Q(38,"Real case - CTA recognition of an incidental arteria lusoria",`A 47-year-old woman is referred with longstanding neck and left arm pain accompanied by occasional mild paraesthesia. Both arms are warm and well perfused, with normal and symmetrical brachial and radial pulses. There is no blood-pressure differential, digital ischaemia or history of embolic symptoms. She has no focal neurological deficit or history of transient cerebral or retinal ischaemia. She has no dysphagia, dyspnoea, cough or recurrent respiratory infection.\n\nThe CTA cine-loop is shown. The left internal carotid artery does not enhance, but this is a longstanding finding with established collateral cerebral perfusion.\n\nWhich interpretation of the arch anatomy and management plan is most appropriate?`,{A:"Incidental non-aneurysmal aberrant left subclavian artery - conservative management",B:"Symptomatic aberrant left subclavian artery causing dysphagia lusoria - left carotid-subclavian bypass with ligation of the aberrant artery",C:"Kommerell diverticulum at the aberrant subclavian origin - endovascular exclusion with left subclavian revascularisation",D:"Flow-limiting left subclavian occlusive disease - left carotid-subclavian bypass",E:"Arterial embolisation arising from the chronically occluded left internal carotid artery - therapeutic anticoagulation"},"A","The CTA demonstrates a right-sided aortic arch with an aberrant left subclavian artery: a left-sided arteria lusoria. There is no Kommerell diverticulum, aneurysmal degeneration, subclavian thrombosis or flow-limiting stenosis. In the absence of dysphagia, respiratory compression or upper-limb ischaemia, the anomaly is incidental and can be managed conservatively. The longstanding, well-collateralised left internal carotid non-enhancement is a separate finding and does not explain the arch branch anatomy or make the aberrant subclavian artery symptomatic. The neck and arm symptoms should therefore be assessed independently.","B is
