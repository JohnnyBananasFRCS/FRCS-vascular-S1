l or imaging features of infection, which are not described.", "editorial_trap": "A patent proximal seal does not mean the repair is durable forever. The distal stent edge can become the new failure point."}, {"id": "THO-027", "number": 27, "internal_title": "Thoracic aortic aneurysm in suspected genetic aortopathy", "exhibit": "No image required. The relevant CTA anatomy is: fusiform descending thoracic aneurysm 58 mm, long proximal and distal landing zones, no dissection flap, mild thoracic tortuosity and suitable iliac access.", "stem": "A 38-year-old man is referred with an asymptomatic 58 mm fusiform descending thoracic aortic aneurysm. CTA shows long proximal and distal landing zones, no dissection flap, mild thoracic tortuosity and suitable iliac access. He is tall, has pectus deformity and marked joint hypermobility.\n\nWhat is the most appropriate management principle?", "options": {"A": "Standard TEVAR", "B": "Annual surveillance", "C": "TEVAR with 25% oversizing", "D": "Open surgical repair", "E": "Anticoagulation"}, "answer": "D", "explanation": "This is a young patient with phenotypic features suggesting heritable thoracic aortic disease. Although the anatomy appears suitable for TEVAR, durable open repair is generally favoured when intervention is required and the patient is fit. As part of the work-up, genetic testing is required to confirm the underlying genetic aortopathy and guide operative thresholds, surveillance and family screening. Endovascular repair may be used selectively as a bridge or in emergencies, but it is not the default definitive treatment in suspected connective tissue disease.", "why_not": "A is tempting because the landing zones are good, but the underlying disease biology makes standard TEVAR a poor definitive choice. B is inappropriate for a 58 mm descending thoracic aneurysm in this context. C adds excessive oversizing to fragile aortic tissue. E does not treat aneurysm risk.", "editorial_trap": "Good landing zones do not automatically mean good TEVAR candidate. The aortic biology matters."}, {"id": "THO-028", "number": 28, "internal_title": "Delayed subclavian steal after zone 2 TEVAR", "exhibit": "Synthetic CTA arch and neck vessels:\n\n- Previous zone 2 TEVAR\n- Thoracic stent graft well positioned\n- No endoleak\n- Occluded proximal LSA origin\n- Right vertebral artery small\n- Left vertebral artery dominant\n\nDuplex report:\n\n- Left vertebral artery: retrograde flow throughout the cardiac cycle\n- Left subclavian distal waveform: damped monophasic flow\n- Right vertebral artery: antegrade low-volume flow", "stem": "A 76-year-old man underwent urgent zone 2 TEVAR for a symptomatic descending thoracic aneurysm 6 weeks ago. He now reports dizziness and visual disturbance when using his left arm. Duplex findings are shown above.\n\nWhat is the most appropriate management?", "options": {"A": "Antiplatelet therapy alone", "B": "Extension of the thoracic stent graft", "C": "Right carotid endarterectomy", "D": "Embolisation of the left vertebral artery", "E": "Left carotid-subclavian bypass"}, "answer": "E", "explanation": "This is symptomatic subclavian steal after zone 2 TEVAR. The duplex demonstrates retrograde left vertebral flow, and the patient has vertebrobasilar symptoms precipitated by left arm use. Revascularisation of the left subclavian artery, usually by carotid-subclavian bypass or transposition depending anatomy, is the best option offered.", "why_not": "A does not correct symptomatic vertebrobasilar steal. B does not restore LSA or vertebral flow. C is irrelevant unless there is separate carotid disease. D would worsen posterior circulation risk.", "editorial_trap": "The stem does not spell out LSA coverage. The candidate must know the implication of zone 2 TEVAR and interpret the duplex."}, {"id": "THO-029", "number": 29, "internal_title": "Acute TBAD with refractory hypertension", "exhibit": "Synthetic CTA centreline/MPR:\n\n- Acute type B dissection beginning 25 mm distal to LSA\n- No rupture\n- No visceral malperfusion\n- True lumen compressed but visceral branches patent\n- Descending thoracic aorta 40 mm\n- Proximal landing zone length 25 mm\n- Iliac access suitable", "stem": "A 57-year-old man presents with acute type B dissection. He remains in a monitored bed on IV beta-blockade and vasodilator therapy. Despite three intravenous agents, his systolic BP remains 165–180 mmHg. His pain has improved. Creatinine, lactate and limb perfusion are normal. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Continue medical therapy", "B": "Branched TEVAR", "C": "TEVAR with carotid-subclavian bypass", "D": "TEVAR", "E": "Repeat CTA in 48–72 hours"}, "answer": "D", "explanation": "Refractory hypertension despite appropriate intravenous anti-impulse therapy is a complicated or high-risk feature in acute TBAD. The exhibit gives a 25 mm proximal landing zone distal to the LSA, which is adequate for standard TEVAR in this question. There is no need for branched TEVAR or carotid-subclavian bypass.", "why_not": "A is less appropriate once hypertension remains refractory despite multiple intravenous agents. B is unnecessary when the proximal landing zone is adequate. C is unnecessary because the repair does not require LSA coverage. E delays treatment of refractory hypertension.", "editorial_trap": "The candidate must use the landing-zone measurement. This is not a zone 2/LSA strategy question; it is standard TEVAR anatomy with refractory hypertension."}, {"id": "THO-030", "number": 30, "internal_title": "Late thoracic endograft infection", "exhibit": "Synthetic CTA chest:\n\n- Previous TEVAR in descending thoracic aorta\n- Stent graft well positioned\n- No endoleak\n- No sac expansion\n- New perigraft soft tissue thickening\n- Small gas locules adjacent to the graft\n- No oesophageal contrast leak\n- No active extravasation", "stem": "A 71-year-old man presents 18 months after TEVAR for a descending thoracic aneurysm. He has 6 weeks of malaise, weight loss and intermittent sweats. Temperature is 37.4°C, HR 88 bpm and BP 124/70 mmHg. CRP is 87 mg/L. Two sets of blood cultures grow Enterococcus faecalis. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate next step?", "options": {"A": "Treat as TEVAR implantation syndrome", "B": "Relining with a further thoracic endograft", "C": "Bronchoscopy", "D": "Annual CTA surveillance", "E": "MDT"}, "answer": "E", "explanation": "This is concerning for thoracic endograft infection: late presentation, constitutional symptoms, raised CRP, positive blood cultures and perigraft gas/soft tissue change. He is not actively bleeding and there is no haemoptysis or clear airway fistula in the stem. The best next step is MDT assessment for graft infection, targeted antimicrobial therapy and source-control planning.", "why_not": "A is an early post-implant inflammatory syndrome, not an 18-month presentation with positive blood cultures and perigraft gas. B may temporise selected bleeding or rupture scenarios, but it is not the default response to suspected established graft infection. C may be relevant if there is haemoptysis or suspected airway communication, but this stem is primarily graft infection without active bleeding or airway symptoms. D is unsafe.", "editorial_trap": "This is not early post-implantation fever, and it is not a haemoptysis/aortobronchial fistula stem. Timing, microbiology and perigraft gas should trigger graft infection MDT management."}, {"id": "THO-031", "number": 31, "internal_title": "Native infected descending thoracic aneurysm", "exhibit": "Synthetic CTA chest:\n\n- Saccular aneurysm arising from the lateral descending thoracic aorta\n- Maximum diameter 42 mm\n- Irregular wall\n- Periaortic soft-tissue stranding\n- No established rupture\n- No prior thoracic graft\n- Proximal and distal landing zones appear adequate", "stem": "A 69-year-old man presents with 8 days of fever, malaise and worsening interscapular pain. Three months earlier, CT performed for renal colic showed mild thoracic aortic atheroma but no aneurysm. Current blood cultures grow Staphylococcus aureus. CRP is 214 mg/L and WCC is 17.8 × 10⁹/L. CTA findings are shown in the exhibit. He is physiologically fit for major surgery.\n\nWhat is the most appropriate management?", "options": {"A": "Repeat CTA in 3 months", "B": "IV antibiotics alone", "C": "TEVAR with targeted antimicrobial therapy", "D": "Open thoracic aortic repair", "E": "Best medical therapy and interval imaging"}, "answer": "D", "explanation": "This is a native infected descending thoracic aneurysm: fever, bacteraemia, pain, inflammatory change and rapid development of a saccular aneurysm. Degenerative aneurysm size thresholds do not apply. In a physiologically fit patient, open repair with debridement/source control is the gold standard treatment. TEVAR with prolonged antimicrobial therapy may be considered in patients unfit for open repair, as a bridge, or in selected emergency situations.", "why_not": "A delays treatment of an unstable infected aneurysm. B under-treats the rupture and source-control problem. C may be appropriate if open repair is unsuitable, but the stem gives no reason to avoid open surgery. E is inadequate for a rapidly developing infected aneurysm.", "editorial_trap": "The aneurysm is not large by degenerative standards, but infection changes the threshold and the treatment logic."}, {"id": "THO-032", "number": 32, "internal_title": "Inflammatory aortitis / IgG4-related disease", "exhibit": "Synthetic CTA chest/abdomen:\n\n- Diffuse circumferential wall thickening of descending thoracic and suprarenal abdominal aorta\n- Periaortic soft-tissue mantle\n- Mild aneurysmal dilatation of descending thoracic aorta to 44 mm\n- No dissection flap\n- No penetrating ulcer\n- Renal arteries patent\n- No gas or fluid collection", "stem": "A 62-year-old man is referred after CTA for back pain shows abnormal thickening around the descending thoracic and suprarenal abdominal aorta. He has weight loss and raised inflammatory markers. Blood cultures are negative. Serum IgG4 is elevated. There is no haemodynamic instability and no evidence of rupture.\n\nWhat is the most appropriate initial management principle?", "options": {"A": "High-dose steroids", "B": "TEVAR during this admission", "C": "Systemic anticoagulation", "D": "Open thoracoabdominal replacement", "E": "Annual surveillance without treatment"}, "answer": "A", "explanation": "The imaging and serology suggest inflammatory aortitis, such as IgG4-related aortitis/periaortitis. In the absence of rupture, malperfusion or a large aneurysm requiring repair, initial management is high-dose steroid therapy after appropriate diagnostic assessment. Intervention may be needed if aneurysmal degeneration, rupture risk, occlusive complications or diagnostic uncertainty develops.", "why_not": "B does not treat the inflammatory process and is not indicated for a stable 44 mm aorta without rupture features. C does not address aortitis. D is disproportionate as initial therapy. E ignores active inflammatory disease.", "editorial_trap": "This is not an infected aneurysm and not an acute aortic syndrome. The pattern should push the candidate toward inflammatory aortitis management."}, {"id": "THO-033", "number": 33, "internal_title": "Residual descending dissection after previous type A repair", "exhibit": "Synthetic CTA centreline/MPR:\n\n- Previous ascending aortic replacement for type A dissection\n- Residual chronic dissection from distal arch to iliac bifurcation\n- Descending thoracic aorta enlarged from 46 mm to 59 mm over 18 months\n- False lumen remains patent in descending thoracic aorta\n- Visceral branches patent\n- Proximal landing would require zone 2 coverage", "stem": "A 58-year-old man previously underwent emergency ascending aortic replacement for acute type A dissection. Surveillance CTA now shows progressive aneurysmal degeneration of the residual dissected descending thoracic aorta. He is fit and asymptomatic. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Continue annual surveillance", "B": "Medical therapy alone", "C": "TEVAR", "D": "Carotid-subclavian bypass alone", "E": "Open thoracoabdominal replacement"}, "answer": "C", "explanation": "Residual distal dissection after type A repair can undergo progressive aneurysmal degeneration. A descending thoracic aorta enlarging to 59 mm in a fit patient warrants repair planning. In this stem, the next treatment strategy is TEVAR, with appropriate planning for zone 2 landing and left subclavian management if required.", "why_not": "A and B are too passive for progressive aneurysmal enlargement to 59 mm. D may be an adjunct if zone 2 coverage is required, but it does not treat the aneurysm. E may be required in selected anatomy, but the stem gives a descending thoracic target suitable for TEVAR rather than a thoracoabdominal open-repair problem.", "editorial_trap": "Repairing the ascending aorta does not remove the need to treat progressive distal dissecting aneurysmal degeneration."}, {"id": "THO-034", "number": 34, "internal_title": "SMA branch instability after branched TAAA repair", "exhibit": "Synthetic CTA after branched endovascular TAAA repair:\n\n- Four-vessel branched repair to coeliac, SMA and both renal arteries\n- Aneurysm sac stable\n- Coeliac and renal bridging stents patent\n- SMA bridging stent kinked at branch origin\n- Reduced enhancement of proximal jejunal branches\n- No type I or III endoleak visible", "stem": "A 73-year-old man underwent branched endovascular repair of an extent II thoracoabdominal aneurysm 9 months ago. He now reports post-prandial abdominal pain and 6 kg weight loss. Lactate is normal. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate next step?", "options": {"A": "Annual CTA surveillance", "B": "Mesenteric duplex assessment", "C": "SMA branch relining", "D": "Open thoracoabdominal explant", "E": "Antiplatelet therapy alone"}, "answer": "C", "explanation": "The symptoms are consistent with chronic mesenteric ischaemia after branched repair, and the CTA already shows a mechanical problem with the SMA bridging stent. In this context, the best answer is reintervention on the SMA branch, such as relining or extension depending anatomy.", "why_not": "A ignores symptomatic branch compromise. B could be useful if CTA were equivocal, but the CTA already demonstrates a kinked SMA bridging stent with compatible symptoms. D is disproportionate as first-line if branch reintervention is feasible. E does not correct a mechanical stent problem.", "editorial_trap": "A stable aneurysm sac does not exclude clinically important branch failure after complex endovascular repair."}, {"id": "THO-035", "number": 35, "internal_title": "Shaggy thoracic aorta and embolic risk", "exhibit": "Synthetic CTA arch and descending thoracic aorta:\n\n- 61 mm descending thoracic aneurysm\n- Adequate proximal and distal seal lengths\n- Circumferential irregular mural thrombus throughout the arch\n- Mobile-appearing thrombus projecting into lumen at lesser curve\n- Iliac access adequate\n- No significant carotid stenosis", "stem": "An 80-year-old man is assessed for TEVAR for a 61 mm descending thoracic aneurysm. He is independent and wishes to proceed if the risk is acceptable. CTA findings are shown in the exhibit. He had a minor embolic stroke 3 months ago.\n\nWhich issue most affects the decision to offer standard TEVAR?", "options": {"A": "Risk of type II endoleak", "B": "Risk of embolic stroke", "C": "Risk of renal infarction", "D": "Risk of acute limb ischaemia", "E": "Need for renal fenestrations"}, "answer": "B", "explanation": "The aneurysm may be anatomically sealable, but the shaggy arch and descending thoracic thrombus create a major embolic risk during wire, catheter and stent-graft manipulation. Prior embolic stroke reinforces the concern. Solid organ infarction and acute limb ischaemia are also plausible embolic complications, but embolic stroke is the dominant issue affecting whether standard TEVAR should be offered.", "why_not": "A is not the dominant risk in this morphology. C and D are plausible embolic complications, but less central than stroke in a shaggy arch/descending thoracic aorta with recent embolic stroke. E is irrelevant for an isolated descending thoracic aneurysm with adequate distal seal.", "editorial_trap": "This is not a seal-zone question. It is a procedural embolic-risk question."}, {"id": "THO-036", "number": 36, "internal_title": "Post-TEVAR type III endoleak from component separation", "exhibit": "Synthetic CTA centreline/MPR:\n\n- Previous TEVAR from zone 3 to distal descending thoracic aorta\n- Proximal seal intact\n- Distal end of stent graft unchanged\n- New focal separation between overlapping thoracic stent-graft components\n- Contrast opacification of the aneurysm sac at the overlap zone\n- Sac diameter increased from 58 mm to 66 mm\n- No perigraft gas or inflammatory change", "stem": "A 76-year-old man underwent TEVAR for a descending thoracic aneurysm 5 years ago. Surveillance CTA now shows sac expansion. He has no fever, pain or constitutional symptoms. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Annual CTA surveillance", "B": "Reline the graft", "C": "Intercostal artery embolisation", "D": "Open explant", "E": "Long-term antibiotics"}, "answer": "B", "explanation": "This is a type III endoleak from component separation, with direct sac pressurisation and aneurysm growth. The most appropriate treatment is endovascular relining if anatomically feasible.", "why_not": "A is unsafe with sac expansion and direct endoleak. C would be relevant for selected type II endoleaks, not component separation. D may be required if endovascular repair fails or is unsuitable, but relining is the appropriate first strategy here. E is not supported by the clinical or imaging findings.", "editorial_trap": "Sac expansion after TEVAR is not always proximal or distal seal failure. Component separation is a device-related failure requiring repair."}, {"id": "THO-037", "number": 37, "internal_title": "Residual dissection after type A repair requiring zone 2 TEVAR and LSA strategy", "exhibit": "Synthetic CTA arch/descending thoracic aorta:\n\n- Previous ascending aortic replacement for type A dissection\n- Residual chronic dissection extending from distal arch into descending thoracic aorta\n- Proximal descending thoracic aorta now 61 mm\n- Primary residual entry at the distal arch\n- Zone 3 landing inadequate\n- Zone 2 landing adequate\n- Left vertebral artery dominant\n- No LIMA graft shown", "stem": "A 64-year-old man previously underwent emergency ascending aortic replacement for acute type A dissection. Surveillance CTA now shows progressive aneurysmal degeneration of the residual dissected proximal descending thoracic aorta. He is fit for intervention. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate treatment strategy?", "options": {"A": "Continue annual surveillance", "B": "Zone 3 TEVAR", "C": "Zone 2 TEVAR", "D": "Left carotid-subclavian bypass followed by zone 2 TEVAR", "E": "Open thoracoabdominal replacement"}, "answer": "D", "explanation": "He has progressive aneurysmal degeneration of residual distal dissection after type A repair. Zone 3 seal is inadequate and zone 2 seal is required. Because the left vertebral artery is dominant, planned left subclavian coverage should be preceded by revascularisation if feasible. Carotid-subclavian bypass followed by zone 2 TEVAR is therefore the best option offered.", "why_not": "A is too passive for progressive enlargement to 61 mm. B does not provide an adequate proximal seal. C provides the seal but ignores the left subclavian/vertebral issue. E may be needed in selected anatomy, but this stem provides a feasible endovascular zone 2 strategy.", "editorial_trap": "This is not simply residual dissection after type A repair equals TEVAR. The landing zone and left subclavian strategy still have to be planned."}, {"id": "THO-038", "number": 38, "internal_title": "Asymptomatic Kommerell diverticulum surveillance", "exhibit": "Synthetic CTA arch/descending thoracic aorta:\n\n- Aberrant right subclavian artery arising distal to left subclavian artery\n- Kommerell diverticulum diameter: 29 mm\n- No dissection\n- No aneurysmal degeneration of descending thoracic aorta\n- Mild posterior oesophageal impression", "stem": "A 52-year-old woman is investigated after an incidental abnormality is seen on CT pulmonary angiography. CTA findings are shown in the exhibit. She has no dysphagia, no arm symptoms and no chest or back pain.\n\nWhat is the most appropriate management?", "options": {"A": "Right subclavian revascularisation with diverticulum exclusion", "B": "Open arch replacement", "C": "Oesophageal dilatation", "D": "Surveillance imaging", "E": "Anticoagulation"}, "answer": "D", "explanation": "This is an asymptomatic aberrant right subclavian artery with a modest Kommerell diverticulum and no dissection or compressive symptoms. Surveillance is appropriate. Intervention is more strongly considered with symptoms, larger diverticulum, growth, dissection, rupture features or associated aneurysmal disease.", "why_not": "A is appropriate for selected symptomatic or higher-risk anatomy, but not this incidental stable presentation. B is disproportionate. C treats a symptom she does not have. E does not address the congenital arch anomaly or diverticulum.", "editorial_trap": "Kommerell diverticulum is not automatically an operation. Symptoms, size, growth and associated pathology matter."}, {"id": "THO-039", "number": 39, "internal_title": "Branch-related type IIIc endoleak after branched TAAA repair", "exhibit": "Synthetic CTA after branched endovascular TAAA repair:\n\n- Four-vessel branched endograft\n- Aneurysm sac increased from 70 mm to 76 mm\n- Coeliac, SMA and renal branches patent\n- Focal contrast jet at the junction between a bridging stent and renal branch portal\n- No proximal or distal seal failure\n- No perigraft gas", "stem": "A 71-year-old man underwent branched endovascular repair of an extent II thoracoabdominal aneurysm 18 months ago. Surveillance CTA shows sac expansion. He is asymptomatic. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Continue annual surveillance", "B": "Renal branch relining", "C": "Mesenteric duplex only", "D": "Open explant as first-line", "E": "Antibiotics and PET-CT"}, "answer": "B", "explanation": "The imaging suggests a branch-related type IIIc endoleak at a renal bridging stent/branch junction with sac expansion. In fenestrated or branched repairs, this represents failure or leakage related to the fenestration or branch/bridging-stent interface rather than a standard proximal or distal seal failure. This requires treatment, commonly relining or extension of the affected bridging stent if feasible.", "why_not": "A is unsafe with sac expansion and a direct endoleak source. C may provide haemodynamic information but does not treat a visible type III branch leak. D may be needed rarely, but endovascular branch correction is the appropriate first-line strategy if feasible. E is not supported by the imaging or clinical picture.", "editorial_trap": "After branched repair, sac expansion can result from branch junction failure even when the main proximal and distal seals look intact. This is a type IIIc endoleak pattern."}, {"id": "THO-040", "number": 40, "internal_title": "Inflammatory aortitis work-up when IgG4 is normal", "exhibit": "Synthetic CTA thoracic aorta:\n\n- Circumferential thickening of descending thoracic aortic wall\n- Periaortic inflammatory mantle\n- Mild left pleural thickening\n- Descending thoracic diameter: 47 mm\n- No gas, no pseudoaneurysm, no penetrating ulcer\n- No dissection flap", "stem": "A 65-year-old man presents with thoracic back discomfort and weight loss. CTA findings are shown in the exhibit. CRP is 96 mg/L. Blood cultures are negative. Serum IgG4 is normal. FDG-PET shows avid uptake in the descending thoracic aortic wall and periaortic tissue.\n\nWhat is the most appropriate next step?", "options": {"A": "TEVAR during this admission", "B": "Open descending thoracic replacement", "C": "Anticoagulation", "D": "Tissue diagnosis and inflammatory aortitis work-up", "E": "Discharge with 5-year surveillance"}, "answer": "D", "explanation": "This is an inflammatory periaortic process rather than a straightforward degenerative aneurysm or acute aortic syndrome. IgG4 is normal, so the diagnosis remains uncertain. Before committing to major repair or immunosuppression, further inflammatory, infective and malignant work-up is needed, with tissue diagnosis if safe and appropriate.", "why_not": "A does not treat the underlying inflammatory process and is not indicated without rupture, malperfusion or major aneurysmal degeneration. B is disproportionate as the immediate next step. C does not address the pathology. E ignores active inflammation and systemic symptoms.", "editorial_trap": "Not every hot thickened aorta is IgG4 disease, and not every thoracic aortic abnormality is fixed with TEVAR. Diagnosis matters before treatment."}, {"id": "THO-041", "number": 41, "internal_title": "Post-TEVAR type Ia endoleak", "exhibit": "Synthetic CTA chest:\n\n- Previous TEVAR for descending thoracic aneurysm\n- Proximal seal zone in zone 3\n- New contrast at proximal graft edge\n- Aneurysm sac increased from 62 mm to 70 mm\n- Distal seal intact\n- No component separation\n- No perigraft gas\n- Proximal arch anatomy should clarify whether there is enough seal above the graft or whether proximal extension would require zone 2 coverage", "stem": "A 74-year-old man underwent TEVAR for a descending thoracic aneurysm 3 years ago. Surveillance CTA shows sac expansion. He has no fever, chest pain or constitutional symptoms. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Repeat CTA in 6 months", "B": "Contrast-enhanced ultrasound", "C": "Catheter angiography", "D": "Proximal relining", "E": "Intercostal artery embolisation"}, "answer": "D", "explanation": "This is a proximal type Ia endoleak with sac expansion. The key problem is proximal seal failure, so the treatment should correct the proximal seal, usually with proximal relining or extension if anatomy allows. Further diagnostic tests may be useful in equivocal cases, but here the CTA already demonstrates proximal graft-edge contrast with sac expansion.", "why_not": "A delays treatment of a direct endoleak with sac growth. B can help characterise endoleak in selected cases, but CTA has already shown a proximal seal problem. C may be useful for planning or intra-operative confirmation, but it is not the definitive management. E is for selected branch-flow endoleaks, not type Ia seal failure.", "editorial_trap": "Do not treat sac expansion generically. Identify the endoleak mechanism and correct the failed seal."}, {"id": "THO-042", "number": 42, "internal_title": "Lifelong surveillance after TEVAR", "exhibit": "Synthetic CTA chest:\n\n- Previous TEVAR from zone 3 to distal descending thoracic aorta\n- No endoleak\n- No stent migration\n- No sac expansion\n- Aneurysm sac reduced from 66 mm to 54 mm\n- Distal thoracic and abdominal aorta stable", "stem": "A 72-year-old man attends follow-up 2 years after TEVAR for a descending thoracic aneurysm. He is asymptomatic. CTA findings are shown in the exhibit. He asks whether he can be discharged from aortic follow-up.\n\nWhat is the most appropriate advice?", "options": {"A": "Discharge from surveillance", "B": "Repeat imaging only if symptoms develop", "C": "Continue lifelong aortic surveillance", "D": "Remove antiplatelet therapy", "E": "Convert to open repair"}, "answer": "C", "explanation": "The imaging shows favourable sac regression and no current complication, but TEVAR still requires lifelong surveillance. Late problems include endoleak, migration, component separation, sac expansion, new dissection-related pathology and progression elsewhere in the aorta.", "why_not": "A and B underestimate late device and aortic risks. D is not determined by the sac response and would depend on wider cardiovascular indications. E is not indicated with stable favourable imaging.", "editorial_trap": "A good early TEVAR result does not mean the patient is cured or can stop aortic surveillance."}, {"id": "THO-043", "number": 43, "internal_title": "Uncomplicated acute TBAD", "exhibit": "Synthetic CTA chest:\n\n- Acute type B dissection beginning 30 mm distal to LSA\n- No rupture\n- No visceral malperfusion\n- Descending thoracic aorta 38 mm\n- True lumen patent\n- False lumen patent\n- No ulcer-like projection\n- No pleural effusion", "stem": "A 60-year-old man presents with acute type B aortic dissection. His pain settles with analgesia and IV beta-blockade. Systolic BP is maintained at 110–120 mmHg. Renal function, lactate and limb perfusion are normal. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Best medical therapy and outpatient surveillance", "B": "TEVAR", "C": "TEVAR with carotid-subclavian bypass", "D": "Repeat CTA in 48–72 hours", "E": "Open descending thoracic replacement"}, "answer": "D", "explanation": "This is uncomplicated acute TBAD: pain and blood pressure have settled, and there is no rupture, malperfusion or high-risk imaging feature in the stem. The patient should continue best medical therapy, but during the acute admission early repeat CTA in 48–72 hours is appropriate to confirm stability before stepping down or discharge planning. The option of outpatient surveillance is too loose for an acute inpatient presentation.", "why_not": "A contains the correct medical-management principle but moves too quickly to outpatient surveillance without confirming early stability. B is not indicated from the information given. C adds an unnecessary LSA strategy. E is excessive.", "editorial_trap": "Uncomplicated acute TBAD is not a TEVAR-by-default diagnosis, but inpatient surveillance still needs to be active rather than casual outpatient follow-up."}, {"id": "THO-044", "number": 44, "internal_title": "Symptomatic PAU with low-risk morphology", "exhibit": "Synthetic CTA arch/descending thoracic aorta:\n\n- Penetrating ulcer on lesser curve of proximal descending thoracic aorta\n- Ulcer depth 9 mm\n- Ulcer width 13 mm\n- No intramural haematoma\n- No pleural effusion\n- Aortic diameter 36 mm\n- No periaortic haematoma", "stem": "An 81-year-old woman presents with chest pain and undergoes CTA. Troponins are negative and there is no ECG evidence of myocardial infarction. CTA findings are shown in the exhibit. Her pain settles with analgesia and blood pressure control.\n\nWhat is the most appropriate next step?", "options": {"A": "Discharge without follow-up", "B": "Repeat CTA in 48–72 hours", "C": "TEVAR during this admission", "D": "Open descending thoracic repair", "E": "Repeat CTA in 5 years"}, "answer": "B", "explanation": "This is a symptomatic penetrating aortic ulcer, so it should be treated as part of the acute aortic syndrome spectrum even though the morphology is not high risk. There is no IMH, pleural effusion, large aortic diameter or periaortic haematoma to mandate immediate TEVAR, but early repeat imaging is appropriate to confirm stability.", "why_not": "A is unsafe after symptomatic acute aortic pathology. C may be appropriate with persistent pain, progression or high-risk morphology, but those features are not present. D is disproportionate. E is too delayed for an acute symptomatic presentation.", "editorial_trap": "This is not the same as an incidental asymptomatic ulcerated plaque. Symptoms move the patient into acute-aortic-syndrome follow-up logic."}, {"id": "THO-045", "number": 45, "internal_title": "Zone 2 TEVAR with LIMA graft", "exhibit": "Synthetic CTA chest:\n\n- Descending thoracic aneurysm 63 mm\n- Proximal seal would require zone 2 coverage\n- Zone 3 landing 6 mm\n- Zone 2 landing 32 mm\n- Left internal mammary artery graft arises from LSA\n- Iliac access suitable", "stem": "A 73-year-old man is planned for elective TEVAR for a symptomatic proximal descending thoracic aneurysm. He previously underwent CABG with a patent LIMA graft. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate adjunct?", "options": {"A": "Proceed without LSA revascularisation", "B": "Left carotid-subclavian bypass", "C": "Right carotid-subclavian bypass", "D": "Vertebral artery stenting", "E": "Carotid endarterectomy"}, "answer": "B", "explanation": "Zone 2 TEVAR will cover the left subclavian artery. A patent LIMA graft is a strong indication for left subclavian revascularisation before planned coverage to preserve coronary perfusion. Left carotid-subclavian bypass is the best option offered.", "why_not": "A risks compromising LIMA inflow. C treats the wrong side. D does not restore LSA inflow to the LIMA. E is unrelated unless there is separate carotid disease.", "editorial_trap": "The vertebral circulation is not the only reason to preserve the LSA. A LIMA graft is decisive."}, {"id": "THO-046", "number": 46, "internal_title": "Sequencing TEVAR and lung resection", "exhibit": "Synthetic CTA chest:\n\n- Right lower lobe lung tumour, 2.1 cm\n- No mediastinal nodal disease on staging CT\n- Descending thoracic aneurysm, 67 mm\n- Eccentric crescent high attenuation within the aneurysm wall\n- Focal tenderness/abutment near left recurrent laryngeal nerve region\n- No active extravasation\n- Proximal and distal TEVAR landing zones suitable\n- Iliac access suitable", "stem": "A 68-year-old man with newly diagnosed early-stage right lower lobe lung cancer is being planned for curative lung resection. He also reports new interscapular discomfort and hoarseness of voice. CTA shows a 67 mm descending thoracic aneurysm with eccentric crescent high attenuation within the aneurysm wall. The lung tumour is a peripheral right lower lobe lesion measuring 2.1 cm with no mediastinal nodal disease. TEVAR landing zones and iliac access are suitable.\n\nWhat is the most appropriate sequencing strategy?", "options": {"A": "Lung resection first", "B": "TEVAR before lung resection", "C": "Open descending thoracic replacement before lung resection", "D": "Chemotherapy before any vascular treatment", "E": "Surveillance of the aneurysm until after cancer follow-up"}, "answer": "B", "explanation": "The lung cancer appears early-stage, peripheral and resectable, but the aneurysm is large and has concerning symptoms/imaging features: new interscapular discomfort, hoarseness suggesting aneurysm-related local mass effect rather than tumour-related recurrent laryngeal involvement, and crescent high attenuation suggesting instability or impending rupture. With suitable anatomy, TEVAR should be performed before lung resection to reduce the immediate aortic risk without the delay and morbidity of open thoracic aortic replacement.", "why_not": "A risks proceeding to thoracic surgery with an unstable large aneurysm. C may delay cancer treatment and is more invasive when TEVAR anatomy is suitable. D is not the correct first step for the early-stage resectable tumour described. E is unsafe given the aneurysm size and instability features.", "editorial_trap": "This is a sequencing question. The cancer matters, but the unstable aneurysm is the immediate threat."}, {"id": "THO-047", "number": 47, "internal_title": "Follow-up after coarctation stenting", "exhibit": "Synthetic CTA after adult coarctation stenting:\n\n- Stent across juxtaductal coarctation\n- Stent patent\n- Residual diameter 17 mm\n- Proximal descending aorta 22 mm\n- Small focal aneurysm at distal stent edge, 27 mm\n- No rupture\n- Arm-leg BP gradient 10 mmHg", "stem": "A 31-year-old man attends follow-up after endovascular stenting for adult coarctation 4 years ago. He is asymptomatic and his hypertension is improved. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate management?", "options": {"A": "Discharge from follow-up", "B": "Continue surveillance of the stent and adjacent aorta", "C": "Immediate open arch replacement", "D": "Balloon angioplasty of the stent", "E": "Carotid-subclavian bypass"}, "answer": "B", "explanation": "After coarctation stenting, patients require ongoing surveillance for restenosis, stent fracture and aneurysm formation at or adjacent to the repair. A small distal stent-edge aneurysm without rupture or severe gradient requires continued specialist follow-up rather than discharge.", "why_not": "A ignores late complications after coarctation repair. C is disproportionate for the current findings. D is not indicated with a patent stent and low gradient. E does not address the coarctation repair or stent-edge aneurysm.", "editorial_trap": "Successful coarctation stenting improves haemodynamics, but it does not end aortic surveillance."}, {"id": "THO-048", "number": 48, "internal_title": "High-risk IMH with ulcer-like projection", "exhibit": "Synthetic CTA chest:\n\n- Acute descending thoracic intramural haematoma\n- Focal ulcer-like projection in proximal descending thoracic aorta\n- New left pleural effusion\n- Descending thoracic aorta 44 mm\n- No classic dissection flap\n- Proximal and distal landing zones suitable for TEVAR", "stem": "A 77-year-old woman presents with acute interscapular pain. CTA findings are shown in the exhibit. Her pain persists despite anti-impulse therapy. Haemoglobin is stable and there is no abdominal tenderness.\n\nWhat is the most appropriate management?", "options": {"A": "Medical therapy", "B": "Repeat CTA in 48–72 hours", "C": "TEVAR", "D": "Repeat CTA in 3–6 months", "E": "Open descending thoracic repair"}, "answer": "C", "explanation": "This is complicated/high-risk descending thoracic IMH with persistent pain, an ulcer-like projection and a new pleural effusion. These features suggest instability and risk of progression or rupture. If anatomy is suitable, TEVAR during the admission is the best option offered.", "why_not": "A is insufficient given persistent symptoms and high-risk imaging. B may be appropriate for a stable low-risk acute aortic syndrome, but this patient has persistent pain, an ulcer-like projection and a new pleural effusion. D is too delayed for an unstable acute aortic syndrome. E is a valid treatment concept in selected unsuitable anatomy, but it is more invasive and not the preferred option when descending thoracic TEVAR anatomy is suitable.", "editorial_trap": "Absence of a classic dissection flap does not make this benign. IMH with high-risk features should be treated as an unstable acute aortic syndrome."}, {"id": "THO-049", "number": 49, "internal_title": "Access-vessel rupture during TEVAR", "exhibit": "Synthetic CTA access-complication panel:\n\n- Thoracic stent graft deployed satisfactorily\n- Right external iliac artery contrast extravasation at access route\n- Retroperitoneal haematoma\n- Right common iliac artery suitable for proximal landing\n- Common femoral artery sheath still in situ", "stem": "During TEVAR for a descending thoracic aneurysm, the main device has been deployed and the aneurysm is excluded. On sheath withdrawal, the patient becomes hypotensive. Completion angiography findings are shown in the exhibit.\n\nWhat is the most appropriate immediate management?", "options": {"A": "Manual compression", "B": "Covered stent", "C": "Protamine and observation", "D": "Femoro-femoral bypass", "E": "Repeat thoracic angiography"}, "answer": "B", "explanation": "This is access-vessel rupture with active iliac extravasation and retroperitoneal bleeding. If anatomy allows, immediate endovascular control with a covered stent is the best option offered, while maintaining wire/sheath access and resuscitating the patient.", "why_not": "A will not control iliac rupture. C may be adjunctive after haemorrhage control but is not sufficient. D may be needed if endovascular repair is not possible, but covered stent control is faster and appropriate here. E ignores the cause of hypotension.", "editorial_trap": "The thoracic aneurysm may be excluded, but the life-threatening complication is now access haemorrhage."}, {"id": "THO-050", "number": 50, "internal_title": "Upper GI bleeding after TEVAR", "exhibit": "Synthetic CTA chest:\n\n- Previous TEVAR for descending thoracic aneurysm\n- Stent graft patent\n- Mild perigraft soft tissue thickening\n- No active extravasation\n- No definite gas tracking to oesophagus\n- Small hiatal hernia\n- No sac expansion", "stem": "A 70-year-old man presents 2 years after TEVAR with dysphagia and one episode of coffee-ground vomiting. Observations are HR 88 bpm, BP 126/72 mmHg, RR 18/min and temperature 37.2°C. Haemoglobin is 112 g/L. CTA findings are shown in the exhibit.\n\nWhat is the most appropriate next investigation?", "options": {"A": "Outpatient proton pump inhibitor trial", "B": "Upper GI endoscopy", "C": "TEVAR relining", "D": "PET-CT", "E": "Annual CTA surveillance"}, "answer": "B", "explanation": "He has upper GI symptoms after TEVAR, but the presentation is not one of active exsanguination and the CTA does not show definite graft-enteric fistulation. Upper GI endoscopy is the appropriate next investigation to assess for oesophageal or gastric pathology and to look for evidence of graft-enteric communication. This should still be approached cautiously in the context of prior TEVAR and discussed with the vascular team.", "why_not": "A is too passive given haematemesis-like symptoms after TEVAR. C is not justified without evidence of active bleeding or graft-related leak requiring immediate vascular control. D may be useful for suspected graft infection, but the immediate question is the source of upper GI bleeding/dysphagia. E is unsafe.", "editorial_trap": "Haematemesis after TEVAR is alarming, but if the patient is stable and CTA is not diagnostic, the next step may be endoscopic confirmation rather than reflex relining or vague MDT wording."}];

let mode = "study";
let examMarked = false;

const qContainer = document.getElementById("questions");
const studyBtn = document.getElementById("studyBtn");
const examBtn = document.getElementById("examBtn");
const markBtn = document.getElementById("markBtn");
const showBtn = document.getElementById("showBtn");
const resetBtn = document.getElementById("resetBtn");
const scoreBox = document.getElementById("scoreBox");
const modeNote = document.getElementById("modeNote");

function esc(str) {
  return String(str ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function render() {
  qContainer.innerHTML = "";
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("article");
    card.className = "question-card";
    card.id = `q-${idx}`;
    const optionsHtml = Object.entries(q.options).map(([letter, text]) => `
      <label class="option" data-letter="${letter}">
        <input type="radio" name="q${idx}" value="${letter}">
        <span><span class="letter">${letter}.</span> ${esc(text)}</span>
      </label>
    `).join("");
    card.innerHTML = `
      <div class="q-head">
        <div class="q-num">Question ${idx + 1}</div>
        <div class="q-id">${esc(q.id || "")}</div>
      </div>
      ${q.video ? `
        <div class="exhibit-image">
          <video controls loop muted playsinline preload="metadata">
            <source src="${esc(q.video)}" type="video/mp4">
            Your browser does not support embedded video.
          </video>
        </div>
      ` : q.image ? `
        <div class="exhibit-image">
          <img src="${esc(q.image)}" alt="Question ${idx + 1} imaging">
        </div>
      ` : ""}
      <div class="exhibit"><strong>Exhibit / imaging report</strong>

${esc(q.exhibit || "")}</div>
      <div class="stem">${esc(q.stem || "")}</div>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="fb-${idx}">
        <div class="result"></div>
        <h4>Explanation</h4>
        <div>${esc(q.explanation || "")}</div>
        <div class="why-not"><strong>Why not the others:</strong><br>${esc(q.why_not || "")}</div>
        <div class="trap"><strong>Editorial trap:</strong> ${esc(q.editorial_trap || "")}</div>
        ${q.source_verification ? `<div class="source-verification"><strong>Source verification</strong>
${esc(q.source_verification)}

<strong>Curriculum domain</strong>
${esc(q.curriculum_domain || "")}

<strong>Editorial status</strong>
${esc(q.editorial_status || "Draft pending source verification and human review.")}</div>` : ""}
        ${q.evidence_note ? `<div class="evidence-note"><strong>Evidence / controversy:</strong> ${esc(q.evidence_note)}</div>` : ""}
      </div>
    `;
    qContainer.appendChild(card);
  });
  qContainer.querySelectorAll("input[type=radio]").forEach(input => {
    input.addEventListener("change", e => {
      const idx = Number(e.target.name.replace("q",""));
      if (mode === "study") revealQuestion(idx);
      updateScore();
    });
  });
  updateModeUI();
  updateScore();
}

function selectedAnswer(idx) {
  const checked = document.querySelector(`input[name="q${idx}"]:checked`);
  return checked ? checked.value : null;
}

function revealQuestion(idx) {
  const q = QUESTIONS[idx];
  const chosen = selectedAnswer(idx);
  const card = document.getElementById(`q-${idx}`);
  const fb = document.getElementById(`fb-${idx}`);
  const result = fb.querySelector(".result");
  card.querySelectorAll("label.option").forEach(label => {
    const letter = label.dataset.letter;
    label.classList.remove("correct","incorrect");
    if (letter === q.answer) label.classList.add("correct");
    if (chosen && letter === chosen && chosen !== q.answer) label.classList.add("incorrect");
  });
  if (chosen) {
    result.textContent = chosen === q.answer ? "Correct" : `Incorrect. Correct answer: ${q.answer}`;
    result.className = "result " + (chosen === q.answer ? "good" : "bad");
  } else {
    result.textContent = `Correct answer: ${q.answer}`;
    result.className = "result";
  }
  fb.classList.add("show");
}

function hideQuestion(idx) {
  const card = document.getElementById(`q-${idx}`);
  const fb = document.getElementById(`fb-${idx}`);
  card.querySelectorAll("label.option").forEach(label => label.classList.remove("correct","incorrect"));
  fb.classList.remove("show");
}

function updateScore() {
  let answered = 0, correct = 0;
  QUESTIONS.forEach((q, idx) => {
    const ans = selectedAnswer(idx);
    if (ans) {
      answered++;
      if (ans === q.answer) correct++;
    }
  });
  scoreBox.textContent = `Score: ${correct} / ${answered}`;
}

function updateModeUI() {
  studyBtn.classList.toggle("active", mode === "study");
  examBtn.classList.toggle("active", mode === "exam");
  markBtn.style.display = mode === "exam" ? "inline-block" : "none";
  modeNote.textContent = mode === "study"
    ? "Study mode: explanations appear after you select an answer."
    : "Exam mode: explanations stay hidden until you mark the exam.";
  if (mode === "exam" && !examMarked) QUESTIONS.forEach((_, idx) => hideQuestion(idx));
}

function setMode(newMode) {
  mode = newMode;
  examMarked = false;
  QUESTIONS.forEach((_, idx) => hideQuestion(idx));
  updateModeUI();
  updateScore();
  window.scrollTo({top:0, behavior:"smooth"});
}

studyBtn.addEventListener("click", () => setMode("study"));
examBtn.addEventListener("click", () => setMode("exam"));
markBtn.addEventListener("click", () => {
  examMarked = true;
  QUESTIONS.forEach((_, idx) => revealQuestion(idx));
  updateScore();
  window.scrollTo({top:0, behavior:"smooth"});
});
showBtn.addEventListener("click", () => {
  QUESTIONS.forEach((_, idx) => revealQuestion(idx));
  updateScore();
});
resetBtn.addEventListener("click", () => {
  document.querySelectorAll("input[type=radio]").forEach(input => input.checked = false);
  QUESTIONS.forEach((_, idx) => hideQuestion(idx));
  examMarked = false;
  updateScore();
  window.scrollTo({top:0, behavior:"smooth"});
});

render();
</script>
</body>
</html>
